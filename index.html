<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Assedio a Valdombra: deckbuilder roguelike fantasy da giocare nel browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%90%89%3C/text%3E%3C/svg%3E">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Assedio a Valdombra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700&family=Alegreya:wght@600;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen app — HUD bar on top, a screen (map / combat / shop...) filling the rest. Torchlit stone, parchment cards. */
:root{
  --stone:#16141d; --stone2:#211e2b; --stone3:#2d2939; --line:#403a52;
  --fg:#ece4d4; --muted:#a69db6; --torch:#e9a440; --torch2:#ffcf7a;
  --blood:#cf4a3e; --block:#5d9fd8; --poison:#72b85c; --heal:#6fcf8e; --arcane:#a98be8;
  --parch:#efe3c6; --parch2:#e2d2ac; --ink:#2a2118; --ink2:#6b5a44;
  --f-disp:"Grenze Gotisch","Palatino Linotype",Georgia,serif;
  --f-card:"Alegreya",Georgia,serif;
  --f-body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--stone);color:var(--fg);font-family:var(--f-body);font-size:15px;overflow:hidden;
  background-image:radial-gradient(ellipse at 50% -10%,rgba(233,164,64,.10),transparent 60%)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--torch2);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--stone2);border-bottom:1px solid var(--line);font-size:14px}
.hud .cls{font-family:var(--f-disp);font-size:20px;color:var(--torch2)}
.hud .stat{font-variant-numeric:tabular-nums;white-space:nowrap}
.hud .stat b{color:var(--muted);font-weight:500;margin-right:3px;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.hp-t{color:#ff9a8f}.gold-t{color:var(--torch2)}
.pots{display:flex;gap:4px}
.pot{width:24px;height:24px;border-radius:50% 50% 45% 45%;border:2px solid var(--line);background:var(--stone3);padding:0;position:relative}
.pot.full{border-color:rgba(255,255,255,.35)}
.pot.sel{outline:2px solid var(--torch2)}
.relics{display:flex;gap:2px;flex-wrap:wrap}
.relic{background:none;border:0;font-size:19px;padding:0 1px;line-height:1}
.hud .grow{flex:1}
.btn{background:var(--stone3);border:1px solid var(--line);border-radius:8px;padding:7px 12px}
.btn:hover{border-color:var(--torch)}
.btn.primary{background:linear-gradient(#f0b456,#c9832a);color:#2a1a08;border-color:#ffd68f;font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
main{flex:1;min-height:0;overflow:auto;padding-block:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main.flush{padding:0;overflow:hidden;display:flex;flex-direction:column}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-disp);font-weight:700;text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:clamp(44px,9vw,76px);line-height:.95;color:var(--torch2);text-shadow:0 2px 0 #6b3d0c,0 0 30px rgba(233,164,64,.35)}
h2{font-size:32px;color:var(--torch2)}
h3{font-size:22px}
p{margin:0;line-height:1.5}
.muted{color:var(--muted)}
.lede{max-width:60ch;font-size:17px}

/* Title */
.classes{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.classcard{background:var(--stone2);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px}
.classcard.on{border-color:var(--torch);box-shadow:0 0 0 1px var(--torch),0 0 24px rgba(233,164,64,.18)}
.classcard .ic{font-size:40px;line-height:1}
.classcard .nm{font-family:var(--f-disp);font-size:26px;color:var(--fg)}
.classcard small{color:var(--muted);font-size:13px}
.seedrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seedrow input{background:var(--stone);border:1px solid var(--line);border-radius:8px;color:var(--fg);padding:8px 10px;font:inherit;font-variant-numeric:tabular-nums;letter-spacing:.12em;text-transform:uppercase;width:11ch}
.lvls{display:flex;flex-wrap:wrap;gap:6px}
.lvl{width:40px;height:40px;border-radius:8px;background:var(--stone3);border:1px solid var(--line);font-family:var(--f-disp);font-size:20px;font-variant-numeric:tabular-nums}
.lvl.on{background:linear-gradient(#f0b456,#c9832a);color:#2a1a08;border-color:#ffd68f}
.lvl[disabled]{opacity:.45;cursor:not-allowed;font-size:14px}
.party{display:flex;gap:8px;overflow-x:auto;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.pm{display:flex;align-items:center;gap:8px;background:var(--stone2);border:1px solid var(--line);border-radius:10px;padding:4px 10px;flex:none;width:170px}
.pm b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pm .bar{height:9px}.pm small{display:block;font-size:11px;color:var(--muted)}
.pm.off{opacity:.45}.ok{color:var(--heal)}
.allies{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:0 16px}
.ally{flex-direction:row;gap:6px;padding:4px 8px;width:170px;text-align:left}
.ally .info{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}.ally .bar{height:9px}.ally small{font-size:11px}
.ally.down,.hero.down{opacity:.45;filter:grayscale(.8)}
.tgt{color:var(--muted);font-weight:500;font-size:12px}
.mapsvg .vbadge{fill:var(--torch2);stroke:#2a1a08;stroke-width:2}.mapsvg .vbadge-t{font-size:15px;font-weight:700;fill:#2a1a08;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.mapsvg .node.voted circle:first-child{fill:#5a4320;stroke:var(--torch2);stroke-width:6}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:10px;background:var(--stone2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.prow .nm{font-weight:700}.badge{font-size:12px;border-radius:6px;padding:1px 8px;background:var(--stone);border:1px solid var(--line);white-space:nowrap}
.badge.on{color:var(--heal);border-color:var(--heal)}
.code{font-family:var(--f-disp);font-size:52px;line-height:1;letter-spacing:.14em;color:var(--torch2)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.codein{width:8em;text-transform:uppercase;letter-spacing:.2em;font-size:18px;text-align:center}
.codein::placeholder{letter-spacing:.2em;color:var(--muted);opacity:.6}
input.txt{background:var(--stone);border:1px solid var(--line);border-radius:8px;color:var(--fg);padding:9px 10px;font:inherit;max-width:100%}
.netwarn{background:#4a2420;color:#ffd0c8;padding:6px 16px;font-size:13px;text-align:center}
#chat{position:fixed;top:0;right:0;bottom:0;width:min(360px,100%);background:var(--stone2);border-left:1px solid var(--line);z-index:55;display:flex;flex-direction:column;
  padding-block:max(10px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-bottom,0px));padding-right:env(safe-area-inset-right,0px);box-shadow:-10px 0 30px rgba(0,0,0,.4)}
#chat .chead{display:flex;align-items:center;gap:8px;padding:0 12px 8px;border-bottom:1px solid var(--line)}
#chatlog{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.msg{background:var(--stone3);border-radius:10px;padding:6px 10px;max-width:90%;align-self:flex-start;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:#4a3a22}.msg b{display:block;font-size:12px;color:var(--torch2)}
#chatform{display:flex;gap:6px;padding:8px 12px 0;border-top:1px solid var(--line)}
#chatform input{flex:1;min-width:0}
.quick{display:flex;gap:4px;flex-wrap:wrap;padding:6px 12px 0}.quick button{font-size:12px;padding:3px 8px}
.chatbtn .dot{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--blood);color:#fff;font-size:11px;margin-left:4px}
.note{background:var(--stone2);border:1px dashed var(--line);border-radius:10px;padding:12px 14px;font-size:14px;color:var(--muted)}

/* Map */
.mapwrap{flex:1;overflow:auto;position:relative}
.mapsvg{display:block;width:100%;max-width:560px;margin:0 auto}
.mapsvg .edge{stroke:#4d4661;stroke-width:3;stroke-dasharray:2 8;stroke-linecap:round}
.mapsvg .edge.done{stroke:var(--torch);stroke-dasharray:none;opacity:.8}
.mapsvg .node circle{fill:var(--stone2);stroke:#5a5370;stroke-width:3}
.mapsvg .node text{font-size:24px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.mapsvg .node.done circle{fill:#3a2f22;stroke:var(--torch)}
.mapsvg .node.done text{opacity:.55}
.mapsvg .node.cur circle{stroke:var(--torch2);stroke-width:5}
.mapsvg .node.avail{cursor:pointer}
.mapsvg .node.avail circle{stroke:var(--torch2);animation:pulse 1.4s ease-in-out infinite}
.mapsvg .node.avail:hover circle{fill:#4a3a22}
.mapsvg .node.boss circle{stroke:var(--blood);stroke-width:4}
.mapsvg .node.boss text{font-size:44px}
@keyframes pulse{50%{stroke-width:7;stroke-opacity:.6}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:13px;color:var(--muted);padding:10px 16px;border-top:1px solid var(--line);background:var(--stone2)}

/* Combat */
.combat{flex:1;display:flex;flex-direction:column;min-height:0}
.cscroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;padding-bottom:6px}
.enemies{flex:1 0 auto;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-content:center;padding:12px 16px}
.btn.danger{background:#8e2a22;border-color:#d4574b;color:#fff;font-weight:700}
.ent{position:relative;background:var(--stone2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.enemy{width:150px;max-width:31vw;min-width:100px}
.enemy.target{border-color:var(--torch2);box-shadow:0 0 0 2px rgba(255,207,122,.5);cursor:crosshair}
.enemy.dead{opacity:.25;filter:grayscale(1)}
.enemy.boss{width:220px;max-width:70vw}
.ent .face{line-height:0;position:relative;padding-bottom:6px}
.ent .face::after{content:"";position:absolute;left:15%;right:15%;bottom:0;height:8px;border-radius:50%;background:rgba(0,0,0,.45)}
.spr{image-rendering:pixelated;display:block;position:relative;z-index:1;max-width:100%;height:auto}
.spr.inl{display:inline-block;vertical-align:-4px}
.spr.idle{animation:bob 1.6s steps(2) infinite}
.enemy:nth-child(2) .spr.idle{animation-delay:-.5s}.enemy:nth-child(3) .spr.idle{animation-delay:-1.1s}
.spr.hit{animation:hit .35s steps(3)}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes hit{0%,66%{filter:brightness(3) saturate(0);transform:translateX(-4px)}33%{transform:translateX(4px)}}
.enemy.dead .spr{animation:none;transform:rotate(90deg) translateX(20%)}
.ent .nm{font-size:13px;font-weight:700;line-height:1.15}
.intent{font-size:14px;font-weight:700;background:var(--stone);border:1px solid var(--line);border-radius:999px;padding:2px 9px;white-space:nowrap}
.intent .atk{color:#ff8c7f}.intent .def{color:#8cc4ff}.intent .buf{color:var(--torch2)}.intent .deb{color:#c49bff}
.bar{width:100%;height:12px;background:#0d0b12;border-radius:6px;overflow:hidden;position:relative;border:1px solid #000}
.bar i{display:block;height:100%;background:linear-gradient(#e2574a,#9e2c23)}
.bar span{position:absolute;inset:0;font-size:10px;font-weight:700;line-height:11px;text-align:center;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 1px 1px #000}
.blk{font-size:12px;font-weight:700;color:#bfe0ff;background:#22436a;border-radius:6px;padding:0 6px}
.chips{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;min-height:4px}
.chip{cursor:pointer;font-size:11px;border-radius:5px;padding:1px 5px;background:var(--stone3);border:0;line-height:1.4}
.chip.str{color:#ffb38a}.chip.dex{color:#9be0a8}.chip.vuln{color:#ff8fc7}.chip.weak{color:#c6b3ff}.chip.poison{color:#9de07f}.chip.spine{color:#ffd27a}.chip.pw{color:var(--torch2);background:#3a2f1f}
.herorow{display:flex;align-items:center;gap:12px;padding:6px 16px;flex-wrap:wrap;justify-content:center}
.hero{flex-direction:row;gap:10px;min-width:240px;max-width:380px;flex:1;text-align:left}
.hero .face{padding-bottom:4px}
.hero .info{flex:1;display:flex;flex-direction:column;gap:4px;align-items:stretch}
.energy{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-disp);font-size:26px;
  background:radial-gradient(circle at 35% 30%,#ffe2a0,#d88a26 60%,#7a420c);color:#2a1505;border:2px solid #ffd68f;box-shadow:0 0 18px rgba(233,164,64,.4);font-variant-numeric:tabular-nums}
.hand{display:flex;gap:6px;overflow-x:auto;padding:8px 16px 10px;justify-content:safe center;min-height:178px;align-items:flex-end}
.pilebar{display:flex;gap:8px;align-items:center;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-top:1px solid var(--line);background:var(--stone2);flex-wrap:wrap}
.pilebar .grow{flex:1}

/* Cards */
.card{flex:none;width:122px;min-height:166px;background:linear-gradient(var(--parch),var(--parch2));color:var(--ink);border:3px solid #8a7a62;border-radius:10px;
  padding:6px 7px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.35);transition:transform .12s}
button.card:hover{transform:translateY(-8px)}
.card.sel{transform:translateY(-14px);box-shadow:0 0 0 3px var(--torch2),0 8px 18px rgba(0,0,0,.5)}
.card.cant{filter:saturate(.3) brightness(.7)}
.card.r-U{border-color:#4f86b8}.card.r-R{border-color:#d8a135;box-shadow:0 0 12px rgba(216,161,53,.45),0 3px 0 rgba(0,0,0,.35)}
.card .cost{position:absolute;top:-9px;left:-9px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-disp);font-size:18px;
  background:radial-gradient(circle at 35% 30%,#ffe2a0,#d88a26 65%);color:#2a1505;border:2px solid #5c3a10}
.card .cname{font-family:var(--f-card);font-weight:700;font-size:14px;line-height:1.1;margin-top:4px;text-wrap:balance}
.card.up .cname{color:#2f7a3a}
.card .ctype{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#fff;border-radius:4px;padding:0 6px}
.card.t-A .ctype{background:#9a3329}.card.t-S .ctype{background:#2f5f8f}.card.t-P .ctype{background:#7a5a17}
.card .cdesc{font-size:12.5px;line-height:1.3;color:var(--ink);flex:1;display:flex;align-items:center}
.card .cdesc b{color:#6a2a12}
.cardgrid{display:flex;flex-wrap:wrap;gap:14px 10px;justify-content:center;padding-top:8px}

/* Panels */
.panel{background:var(--stone2);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.rewards{display:flex;flex-direction:column;gap:8px}
.ritem{display:flex;align-items:center;gap:10px;text-align:left;background:var(--stone3);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.ritem:hover{border-color:var(--torch)}
.ritem .ic{font-size:22px;width:28px;text-align:center}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--stone3);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.opt:hover:not([disabled]){border-color:var(--torch)}
.opt[disabled]{opacity:.45;cursor:not-allowed}
.evhead{display:flex;gap:14px;align-items:center}
.evhead .ic{font-size:54px}
.shopgrid{display:flex;flex-wrap:wrap;gap:16px 12px;justify-content:center}
.shopitem{display:flex;flex-direction:column;align-items:center;gap:6px}
.price{font-weight:700;color:var(--torch2);font-variant-numeric:tabular-nums}
.price.no{color:#8b8296}
.sold{opacity:.25;pointer-events:none}
.relicbox{width:122px;min-height:120px;background:var(--stone3);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:12px}
.relicbox .ic{font-size:34px}
.endstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.endstats div{background:var(--stone3);border-radius:10px;padding:10px 12px}
.endstats b{display:block;font-family:var(--f-disp);font-size:30px;color:var(--torch2);font-variant-numeric:tabular-nums}

/* Overlay & fx */
.modal{position:fixed;inset:0;background:rgba(8,6,12,.95);backdrop-filter:blur(3px);z-index:50;display:flex;flex-direction:column;padding-block:max(16px,env(safe-area-inset-top,0px)) 16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal .mhead{display:flex;align-items:center;gap:10px;max-width:900px;width:100%;margin:0 auto 8px}
.modal .mbody{flex:1;overflow:auto}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.float{position:absolute;font-family:var(--f-disp);font-size:30px;font-weight:700;transform:translate(-50%,-50%);animation:rise 1s ease-out forwards;text-shadow:0 2px 0 #000,0 0 8px #000}
.float.dmg{color:#ff6b5c}.float.blk{color:#9fd0ff}.float.heal{color:var(--heal)}.float.psn{color:var(--poison)}
@keyframes rise{to{transform:translate(-50%,-150%);opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0d0b12;border:1px solid var(--torch);color:var(--fg);padding:9px 14px;border-radius:10px;z-index:70;max-width:min(90vw,420px);font-size:14px;text-align:center}
@media (max-width:520px){
  .enemies{gap:6px;padding:8px}
  .enemy{width:calc(33.3% - 4px);min-width:0;max-width:none;padding:5px 4px;gap:3px}
  .enemy .spr{width:58px;height:auto}.enemy.boss{width:min(240px,90%)}.enemy.boss .spr{width:120px}
  .enemy .nm{font-size:11.5px}.intent{font-size:12px;padding:1px 6px;white-space:normal}
  .hud .btn{padding:5px 9px;font-size:13px}.hud .cls{font-size:17px}
  .herorow{padding:4px 8px;gap:8px}.energy{width:48px;height:48px;font-size:22px}.hero{min-width:0}.hero .spr{width:44px;height:auto}
  .allies{gap:4px;padding:0 8px}
  .ally{width:calc(33.3% - 3px);min-width:0;padding:3px 5px;gap:4px}
  .ally .spr{width:24px;height:auto}.ally .nm{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ally small{font-size:10px}
  .ally .chips{display:none}
  .enemy{min-width:96px}
  .card{width:100px;min-height:150px;padding:5px 5px 7px}
  .card .cname{font-size:13px}.card .cdesc{font-size:11.5px}
  .hand{min-height:160px;gap:4px}
  .hud{gap:4px 10px;font-size:13px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="app"></div>
<div id="fx"></div>
<aside id="chat" hidden aria-label="Chat di gioco">

function hashStr(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}return h>>>0}
class RNG{constructor(s){this.s=s|0}
  next(){this.s=(this.s+0x6D2B79F5)|0;let t=this.s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}
  int(a,b){return a+Math.floor(this.next()*(b-a+1))}
  pick(a){return a[Math.floor(this.next()*a.length)]}
  shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(this.next()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}}

/* ================= MAPPA ================= */
function genMap(r){
  const C=7,map=[];for(let y=0;y<=ROWS;y++)map.push(Array(C).fill(null));
  const node=(y,x)=>map[y][x]||(map[y][x]={y,x,type:null,next:[],jx:r.int(-18,18),jy:r.int(-12,12)});
  const crosses=(y,x,nx)=>{if(nx===x+1){const o=map[y][x+1];return o&&o.next.includes(x)}if(nx===x-1){const o=map[y][x-1];return o&&o.next.includes(x)}return false};
  let first=-1;
  for(let p=0;p<6;p++){
    let x=r.int(0,C-1);if(p===1)while(x===first)x=r.int(0,C-1);if(p===0)first=x;
    for(let y=0;y<ROWS-1;y++){const n=node(y,x);let nx=x;
      for(let t=0;t<12;t++){nx=Math.max(0,Math.min(C-1,x+r.int(-1,1)));if(!crosses(y,x,nx))break;nx=x}
      if(!n.next.includes(nx))n.next.push(nx);node(y+1,nx);x=nx}
  }
  map[ROWS][3]={y:ROWS,x:3,type:'boss',next:[],jx:0,jy:0};
  map[ROWS-1].forEach(n=>{if(n)n.next=[3]});
  for(let y=0;y<ROWS;y++)map[y].forEach(n=>{if(!n)return;
    if(y===0)n.type='combat';else if(y===8)n.type='treasure';else if(y===ROWS-1)n.type='rest';
    else{const p=r.next();n.type=(y>=5&&p<.15)?'elite':(p<.27&&y>=4&&y!==ROWS-2)?'rest':(p<.34&&y>=2)?'shop':p<.56?'event':'combat'}});
  return map;
}
function availNodes(){
  if(!R.map)return[];
  if(!R.pos)return R.map[0].filter(Boolean);
  const n=R.map[R.pos.y][R.pos.x];return n.next.map(x=>R.map[R.pos.y+1][x]);
}
function resolveVote(){
  const tally={};active().forEach(p=>{const v=R.votes[p];if(v)tally[v]=(tally[v]||0)+1});
  const max=Math.max(...Object.values(tally));const best=Object.keys(tally).filter(k=>tally[k]===max);
  const [y,x]=rng.pick(best).split(',').map(Number);R.votes={};enterNode(y,x);
}

    screen:null,done:true,reward:null,shop:null,event:null,treasure:null});
}
function startRunRoom(lvl,seed){
  R.order=R.order.filter(p=>isOnline(p));Object.keys(R.players).forEach(p=>{if(!R.order.includes(p))delete R.players[p]});
  seed=String(seed||'').trim().toUpperCase().slice(0,12)||newSeed();
  Object.assign(R,{seed,lvl:Math.max(0,Math.min(MAXLVL,lvl)),map:genMap(new RNG(hashStr(seed+'#map'))),pos:null,path:[],floor:0,votes:{},seenEv:[],combat:null,win:null,phase:'map'});
  rng=new RNG(hashStr(seed+'#'+R.order.map(p=>R.players[p].cls).join('')));
  R.order.forEach(p=>initPlayer(R.players[p]));
}
function toLobby(){
  R.order.forEach(p=>{const P=R.players[p];R.players[p]={pid:p,name:P.name,cls:P.cls,ready:p===R.host}});
  Object.assign(R,{phase:'lobby',combat:null,map:null,win:null,votes:{}});
}
function enterNode(y,x){
  R.pos={y,x};R.path.push([y,x]);R.floor=y+1;const t=R.map[y][x].type;
  if(t==='combat')return startCombat(rng.pick(y<3?EASY:HARD),'combat');
  if(t==='elite')return startCombat(rng.pick(ELITES),'elite');
  if(t==='boss')return startCombat(['drago'],'boss');
  const ids=active();let evId=null;
  if(t==='event'){let pool=EVENTS.filter(e=>!R.seenEv.includes(e.id));if(!pool.length)pool=EVENTS;evId=rng.pick(pool).id;R.seenEv.push(evId)}
  R.phase='room';
  R.order.forEach(pid=>{const P=R.players[pid];P.screen=null;P.done=!ids.includes(pid);if(P.done)return;ctx(pid);
    if(t==='event'){P.event={id:evId,result:null};P.screen='event'}
    else if(t==='rest')P.screen='rest';
    else if(t==='shop'){genShop();P.screen='shop'}
    else if(t==='treasure'){const r=randomRelic();const gold=rng.int(25,50);P.gold+=gold;if(r)gainRelic(r);P.treasure={relic:r,gold};P.screen='treasure'}
  });
}
function endRun(win){R.phase='end';R.win=win;R.combat=null;g=null}

/* ================= COMBATTIMENTO ================= */
function startCombat(ids,kind){
  const L=R.lvl||0,party=active(),n=Math.max(1,party.length);
  ids=[...ids];if(n>=5&&kind==='combat')ids.push(rng.pick(['goblin','ratto','lupo']));
  const hpM=1+.7*(n-1),dM=1+.1*(n-1);
  R.combat={kind,n,turn:0,busy:false,won:false,heroes:{},
    enemies:ids.map(id=>{const d=ENEMIES[id];const strong=!!(d.elite||d.boss);const hp=Math.round(rng.int(d.hp[0],d.hp[1])*(1+.1*L+(strong?.05*L:0))*hpM);
      return{id,n:d.n,hp,max:hp,blk:d.blk?Math.round(d.blk*hpM):0,st:{},t:0,dead:false,boss:!!d.boss,bonus:dmgBonus(L,strong),dm:dM}})};
  party.forEach(pid=>{const P=R.players[pid];R.combat.heroes[pid]={blk:0,st:{},pw:{},draw:rng.shuffle(P.deck.map(c=>({...c,uid:uid++}))),hand:[],disc:[],exh:[],energy:0,ended:false,down:false}});
  R.phase='combat';R.order.forEach(p=>{R.players[p].screen=null;R.players[p].done=true});
  g=R.combat;rollIntents();startTurn();
}
function targetable(){const c=R.combat;let t=Object.keys(c.heroes).filter(p=>!c.heroes[p].down&&isOnline(p));if(!t.length)t=Object.keys(c.heroes).filter(p=>!c.heroes[p].down);return t}
function rollIntents(){R.combat.enemies.forEach(e=>{if(e.hp<=0)return;e.intent=ENEMIES[e.id].ai(e,rng);e.t++;if(e.intent.d||e.intent.deb){const t=targetable();e.intent.tg=t.length?rng.pick(t):null}})}
function startTurn(){
  const c=R.combat;c.turn++;
  Object.keys(c.heroes).forEach(pid=>{const h=c.heroes[pid];if(h.down)return;ctx(pid);heroTurnStart(h,c.turn)});
  checkEnd();
}
function heroTurnStart(h,turn){
  h.ended=false;h.blk=0;delete h.st.spine;g.hit=new Set();
  let en=3,dr=5;const pw=h.pw;
  if(turn===1){
    if(has('lanterna'))en++;if(has('grimorio'))dr+=2;
    if(has('pietra'))S(h,'str',1);if(has('mantello'))S(h,'dex',1);
    if(has('ancora'))h.blk+=10;if(has('fiala'))SA('poison',2);if(has('corno'))SA('vuln',1);
  }
  if(has('dado')&&turn%3===0)en++;
  if(has('simbolo'))H(1);
  if(pw.furia)S(h,'str',pw.furia);
  if(pw.arcimago)en+=pw.arcimago;
  if(pw.rapide)dr+=pw.rapide;
  if(pw.aura){h.blk+=pw.aura;fx('hero','+'+pw.aura,'blk')}
  if(pw.inno)alive().forEach(e=>hurtEnemy(e,pw.inno));
  h.energy=en;D(dr);
}
function calcDmg(base,src,tgt){let d=base+(src.st.str||0);if(src.st.weak)d*=.75;if(tgt&&tgt.st&&tgt.st.vuln)d*=1.5;return Math.max(0,Math.floor(d))}
const enemyBase=(e,it)=>Math.round((it.d+(e.bonus||0))*(e.dm||1));
function eid(e){return 'e'+R.combat.enemies.indexOf(e)}
function hurtEnemy(e,d){
  if(e.hp<=0)return;const b=Math.min(e.blk,d);e.blk-=b;const r=d-b;e.hp-=r;
  fx(eid(e),r>0?'-'+r:'Parato',r>0?'dmg':'blk');
  if(e.hp<=0){e.hp=0;if(!e.dead){e.dead=true;if(run){run.kills++;if(has('zanna'))H(3)}}}
}
function heroDown(){
  if(run.hp>0)return;
  if(has('piuma')&&!run.piumaUsed){run.piumaUsed=true;run.relics=run.relics.filter(r=>r!=='piuma');run.hp=Math.floor(run.max*.3);fx('hero','Rinato!','heal');return}
  run.hp=0;if(g&&g.hero){g.hero.down=true;g.hero.disc.push(...g.hero.hand);g.hero.hand=[];fx('hero','A terra!','dmg')}
}
function hurtHero(d){
  const h=g.hero;const b=Math.min(h.blk,d);h.blk-=b;const r=d-b;
  if(r>0){run.hp-=r;fx('hero','-'+r,'dmg')}else fx('hero','Parato','blk');
  heroDown();
}
/* Effetti usati dalle carte */
function A(t,n,h=1){for(let i=0;i<h;i++){if(!t||t.hp<=0)break;hurtEnemy(t,calcDmg(n,g.hero,t));g.hit.add(t)}}
function AA(n){alive().forEach(e=>{hurtEnemy(e,calcDmg(n,g.hero,e));g.hit.add(e)})}
function AR(n,h){for(let i=0;i<h;i++){const a=alive();if(!a.length)break;const e=rng.pick(a);hurtEnemy(e,calcDmg(n,g.hero,e));g.hit.add(e)}}
function B(n){const v=Math.max(0,n+(g.hero.st.dex||0));g.hero.blk+=v;fx('hero','+'+v,'blk')}
function S(t,k,n){if(!t||(t.hp!==undefined&&t.hp<=0))return;t.st[k]=(t.st[k]||0)+n}
function SA(k,n){alive().forEach(e=>S(e,k,n))}
function D(n){const h=g.hero;for(let i=0;i<n;i++){if(h.hand.length>=10)break;if(!h.draw.length){if(!h.disc.length)break;h.draw=rng.shuffle(h.disc);h.disc=[]}h.hand.push(h.draw.pop())}}
function E(n){g.hero.energy+=n}
function H(n){if(!run)return;const b=run.hp;run.hp=Math.min(run.max,run.hp+n);const d=run.hp-b;if(d>0&&g&&g.hero)fx('hero','+'+d,'heal')}
function L(n){run.hp-=n;fx('hero','-'+n,'dmg');heroDown()}
function P(k,n){g.hero.pw[k]=(g.hero.pw[k]||0)+n}

function playCard(u,j){
  const c=R.combat,h=g&&g.hero;if(!c||c.busy||c.won||!h||h.ended||h.down)return;
  const i=h.hand.findIndex(x=>x.uid===u);if(i<0)return;const card=h.hand[i];const d=CARDS[card.id];const cost=costOf(card);if(cost>h.energy)return;
  let t=null;if(d.tg){t=c.enemies[j];if(!t||t.hp<=0){t=alive()[0];if(!t)return}}
  h.hand.splice(i,1);h.energy-=cost;g.hit=new Set();
  d.f(vals(card),t);
  if(d.t==='A'&&h.pw.intrise)g.hit.forEach(e=>S(e,'poison',h.pw.intrise));
  if(d.t==='S'&&h.pw.arcano)alive().forEach(e=>hurtEnemy(e,h.pw.arcano));
  if(d.t!=='P')(d.ex?h.exh:h.disc).push(card);
  checkEnd();
}
function usePotion(i,j){
  const c=R.combat,h=g&&g.hero;if(!c||c.busy||c.won||!h||h.down)return;
  const id=run.potions[i];if(!id)return;const p=POTIONS[id];
  let t=null;if(p.tg){t=c.enemies[j];if(!t||t.hp<=0){t=alive()[0];if(!t)return}}
  run.potions.splice(i,1);g.hit=new Set();p.f(t);checkEnd();
}
function endHeroTurn(){
  const h=g&&g.hero;if(!h||h.ended||h.down||R.combat.busy)return;
  h.disc.push(...h.hand);h.hand=[];
  if(has('orbe')&&h.blk===0){h.blk=6;fx('hero','+6','blk')}
  decay(h);h.ended=true;
}
async function enemyPhase(){
  const c=R.combat;if(!c||c.busy)return;c.busy=true;
  await wait(10);commit();await wait(300);
  for(const e of c.enemies){
    if(R.combat!==c)return;if(e.hp<=0)continue;e.blk=0;
    if(e.st.poison){ctx(null);const p=e.st.poison;e.hp-=p;fx(eid(e),'-'+p,'psn');e.st.poison--;
      if(e.hp<=0){e.hp=0;e.dead=true;commit();await wait(250);continue}}
    doIntent(e);commit();await wait(450);
    if(Object.values(c.heroes).every(h=>h.down))break;
  }
  if(R.combat!==c)return;
  c.enemies.forEach(decay);c.busy=false;
  if(!checkEnd()){rollIntents();startTurn()}
  checkProgress();commit();
}
function decay(t){['vuln','weak'].forEach(k=>{if(t.st[k]){t.st[k]--;if(!t.st[k])delete t.st[k]}});if(t.st.poison===0)delete t.st.poison}
function doIntent(e){
  const it=e.intent,c=R.combat;if(!it)return;
  if(it.b){e.blk+=Math.round(it.b*(e.dm||1));fx(eid(e),'+'+Math.round(it.b*(e.dm||1)),'blk')}
  if(it.s)(it.all?alive():[e]).forEach(x=>x.st.str=(x.st.str||0)+it.s);
  if(it.heal){const b=e.hp;e.hp=Math.min(e.max,e.hp+Math.round(it.heal*(1+.7*(c.n-1))));fx(eid(e),'+'+(e.hp-b),'heal')}
  if(it.d||it.deb){
    let tg=it.tg;if(!tg||!c.heroes[tg]||c.heroes[tg].down){const t=targetable();if(!t.length)return;tg=rng.pick(t)}
    ctx(tg);
    if(it.d)for(let k=0;k<(it.x||1);k++){hurtHero(calcDmg(enemyBase(e,it),e,g.hero));if(g.hero.st.spine)hurtEnemy(e,g.hero.st.spine);if(g.hero.down||e.hp<=0)break}
    if(it.deb&&!g.hero.down)g.hero.st[it.deb]=(g.hero.st[it.deb]||0)+it.dn;
  }
}
function checkEnd(){
  const c=R.combat;if(R.phase!=='combat'||!c||c.won)return true;
  if(Object.values(c.heroes).every(h=>h.down)){endRun(false);return true}
  if(!alive().length){c.won=true;c.busy=true;setTimeout(()=>{if(R&&R.combat===c&&isHost){winCombat();checkProgress();commit()}},550);return true}
  return false;
}
function winCombat(){
  const c=R.combat,kind=c.kind,pids=Object.keys(c.heroes);
  pids.forEach(pid=>{ctx(pid);if(c.heroes[pid].down)run.hp=Math.max(1,Math.floor(run.max*.25));else if(has('elmo'))H(6)});
  R.combat=null;g=null;
  if(kind==='boss'){endRun(true);return}
  R.phase='room';
  R.order.forEach(pid=>{const P=R.players[pid];if(!pids.includes(pid)||!isOnline(pid)){P.done=true;P.screen=null;return}
    ctx(pid);let gold=kind==='elite'?rng.int(25,35):rng.int(10,20);gold=Math.round(gold*(1+.1*(R.lvl||0)));if(has('sacchetto'))gold=Math.round(gold*1.25);
    P.reward={title:kind==='elite'?'Élite sconfitta!':'Vittoria!',gold,cards:rollCards(3,kind==='elite'),
      potion:rng.next()<(kind==='elite'?.6:.4)?rng.pick(Object.keys(POTIONS)):null,relic:kind==='elite'?randomRelic():null};
    P.screen='reward';P.done=false});
}

function rollCards(n,elite){
  const pool=Object.keys(CARDS).filter(k=>CARDS[k].cl===run.cls&&CARDS[k].r!=='B');const out=[];
  for(let i=0;i<n;i++){const p=rng.next()-.02*(R.lvl||0);const rar=p<(elite?.12:.05)?'R':p<(elite?.5:.37)?'U':'C';
    let opts=pool.filter(k=>CARDS[k].r===rar&&!out.includes(k));if(!opts.length)opts=pool.filter(k=>!out.includes(k));out.push(rng.pick(opts))}
  return out;
}
function randomRelic(){const p=RELIC_POOL.filter(k=>!run.relics.includes(k)&&!(k==='piuma'&&run.piumaUsed));return p.length?rng.pick(p):null}
function gainRelic(id){run.relics.push(id);if(id==='cuore'){run.max+=8;run.hp+=8}}
function addCard(id){run.deck.push({id,up:false})}
function genShop(){
  const pool=Object.keys(CARDS).filter(k=>CARDS[k].cl===run.cls&&CARDS[k].r!=='B');
  const pickR=(r,n,ex)=>rng.shuffle(pool.filter(k=>CARDS[k].r===r&&!ex.includes(k))).slice(0,n);
  const ids=[];ids.push(...pickR('C',2,ids));ids.push(...pickR('U',2,ids));ids.push(...pickR('R',1,ids));
  const pr={C:[45,55],U:[70,82],R:[140,160]};
  const rel=rng.shuffle(RELIC_POOL.filter(k=>!run.relics.includes(k))).slice(0,2);
  run.shop={cards:ids.map(id=>({id,price:rng.int(...pr[CARDS[id].r]),sold:false})),
    relics:rel.map(id=>({id,price:rng.int(140,170),sold:false})),
    potions:rng.shuffle(Object.keys(POTIONS)).slice(0,2).map(id=>({id,price:rng.int(45,55),sold:false})),removeUsed:false};
}
function buy(kind,k){
  const it=run.shop[kind]&&run.shop[kind][k];if(!it||it.sold||run.gold<it.price)return;
  if(kind==='potions'&&run.potions.length>=3)return;
  run.gold-=it.price;it.sold=true;
  if(kind==='cards')addCard(it.id);else if(kind==='relics')gainRelic(it.id);else run.potions.push(it.id);
}
function removePrice(){return 75+run.removes*25}

/* ================= RETE (Supabase Realtime) ================= */
function connect(code,onReady){
  if(typeof supabase==='undefined'){toast('Il multigiocatore non è disponibile qui: apri il gioco dal sito.');return false}
  sbc=sbc||supabase.createClient(SB_URL,SB_KEY);
  chan=sbc.channel('valdombra-'+code,{config:{broadcast:{self:false},presence:{key:ME}}});
  chan.on('broadcast',{event:'state'},({payload})=>onState(payload))
    .on('broadcast',{event:'act'},({payload})=>{if(isHost&&payload&&payload.a)dispatch(payload.pid,payload.a)})
    .on('broadcast',{event:'hello'},({payload})=>{if(isHost)onHello(payload)})
    .on('broadcast',{event:'closed'},()=>{toast('La stanza è stata chiusa.');leaveRoom(true)})
    .on('presence',{event:'sync'},()=>{if(!chan)return;online=new Set(Object.keys(chan.presenceState()));online.add(ME);onPresence()})
    .subscribe(async st=>{
      if(st==='SUBSCRIBED'){UI.status='';const tr=()=>{try{chan&&chan.track({name:myName,at:Date.now()})}catch(e){}};tr();setTimeout(tr,1200);setTimeout(tr,4000);clearInterval(window.trackIv);window.trackIv=setInterval(tr,15000);if(onReady){const f=onReady;onReady=null;f()}render()}
      else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'){UI.status='Connessione instabile, riprovo...';render()}
    });
  return true;
}
function onState(pl){
  if(!pl||!pl.s)return;const r=JSON.parse(pl.s);
  if(isHost){if(r.host===ME||(R&&r.v<=R.v))return;isHost=false}
  R=r;cacheState(pl.s);clearTimeout(joinTimer);UI.joining=null;
  if(R.host===ME&&!isHost){isHost=true;rng=new RNG(0);rng.s=R.rs|0;toast('Ora sei tu a guidare la stanza.')}
  if(!R.players[ME]&&R.phase!=='lobby'&&chan){const n=(UI.helloTries=(UI.helloTries||0)+1);if(n<=8&&!UI.helloT)UI.helloT=setTimeout(()=>{UI.helloT=null;if(R&&!R.players[ME]&&chan)chan.send({type:'broadcast',event:'hello',payload:{pid:ME,name:myName,cls:pickCls}})},3000)}else UI.helloTries=0;
  checkHost();render(pl.fx||[]);
}
function remapPid(o,n){
  R.players[n]=R.players[o];R.players[n].pid=n;delete R.players[o];R.order=R.order.map(x=>x===o?n:x);
  if(R.votes&&R.votes[o]){R.votes[n]=R.votes[o];delete R.votes[o]}
  const c=R.combat;if(c&&c.heroes[o]){c.heroes[n]=c.heroes[o];delete c.heroes[o];c.enemies.forEach(e=>{if(e.intent&&e.intent.tg===o)e.intent.tg=n})}
  if(R.host===o)R.host=n;(R.chat||[]).forEach(m=>{if(m.p===o)m.p=n});
}
function onHello(p){
  if(!p||!p.pid||!R)return;const name=String(p.name||'Eroe').slice(0,16);
  if(R.players[p.pid])R.players[p.pid].name=name;
  else{
    // stesso nome di un giocatore disconnesso: è lui che rientra (telefono diverso o memoria cancellata)
    const old=R.order.find(q=>q!==p.pid&&!online.has(q)&&String(R.players[q].name).toLowerCase()===name.toLowerCase());
    if(old)remapPid(old,p.pid);
    else if(R.phase==='lobby'&&R.order.length<MAXP){R.players[p.pid]={pid:p.pid,name,cls:CLASSES[p.cls]?p.cls:'guerriero',ready:false};R.order.push(p.pid)}
  }
  commit();
}
function onPresence(){if(!R)return;if(isHost){checkProgress();commit()}else{checkHost();render()}}
function checkHost(){
  if(solo||!R||isHost)return;
  if(online.has(R.host)){clearTimeout(hostTimer);hostTimer=null;return}
  if(hostTimer)return;
  hostTimer=setTimeout(()=>{hostTimer=null;if(!R||isHost||online.has(R.host))return;const cand=R.order.filter(p=>online.has(p));if(cand[0]===ME)becomeHost()},4000);
}
function becomeHost(msg){
  isHost=true;R.host=ME;rng=new RNG(0);rng.s=R.rs|0;
  if(R.combat){R.combat.busy=false;if(R.combat.won){R.combat.won=false;checkEnd()}}
  toast(msg||'L\'host è uscito: ora sei tu a guidare la stanza.');checkProgress();commit();
}
function rememberRoom(code){store('valdombra-room',code);try{location.hash=code}catch(e){}}
function createRoom(){
  if(!saveName())return;
  solo=false;isHost=true;ME=myPid();const code=newSeed(4);R=newLobby(code);rng=new RNG(hashStr(code));online=new Set([ME]);
  if(!connect(code,()=>commit())){R=null;solo=true;return}
  rememberRoom(code);render();
}
function joinRoom(code){
  code=String(code||'').trim().toUpperCase();if(code.length!==4){toast('Il codice della stanza ha 4 caratteri.');return}
  if(!saveName())return;
  if(chan){try{chan.unsubscribe()}catch(e){}chan=null}
  solo=false;isHost=false;ME=myPid();R=null;online=new Set([ME]);screen='mp';UI.joining=code;
  const hello=()=>chan&&chan.send({type:'broadcast',event:'hello',payload:{pid:ME,name:myName,cls:pickCls}});
  if(!connect(code,()=>{hello();setTimeout(()=>{if(!R)hello()},1500);
    joinTimer=setTimeout(()=>{if(R)return;
      // nessuno risponde: se eravamo in questa partita la riprendiamo dalla copia salvata su questo dispositivo
      let r=null;try{r=JSON.parse(load('valdombra-cache-'+code))}catch(e){}
      if(r&&r.players){if(!r.players[ME]){const old=r.order.find(q=>String(r.players[q].name).toLowerCase()===myName.toLowerCase());if(old){R=r;remapPid(old,ME)}}else R=r}
      if(R){becomeHost('Nessun altro è collegato: la partita riprende da qui. Gli amici possono rientrare con il codice '+code+'.');return}
      toast('Stanza '+code+' non trovata. Controlla il codice, oppure chiedi a chi è in partita di restare collegato.');leaveRoom(false)},5000)}))return;
  rememberRoom(code);render();
}
// forget=true: dimentica la stanza (non comparirà il tasto Continua)
function leaveRoom(forget){
  const code=R&&!solo?R.code:(UI.joining||load('valdombra-room'));
  clearInterval(window.trackIv);
  if(chan){try{chan.unsubscribe()}catch(e){}chan=null}
  clearTimeout(joinTimer);clearTimeout(hostTimer);hostTimer=null;
  if(cacheT){clearTimeout(cacheT);cacheT=null;if(!forget&&R&&!solo&&cacheS)store('valdombra-cache-'+R.code,cacheS)}
  if(forget===true){store('valdombra-room',null);if(code)store('valdombra-cache-'+code,null)}
  R=null;g=null;run=null;isHost=true;solo=true;UI.joining=null;screen='title';modal=null;
  try{history.replaceState(null,'',location.pathname)}catch(e){}render();
}
function removePlayer(pid){
  delete R.players[pid];R.order=R.order.filter(x=>x!==pid);if(R.votes)delete R.votes[pid];
  const c=R.combat;if(c&&c.heroes[pid]){delete c.heroes[pid];c.enemies.forEach(e=>{if(e.intent&&e.intent.tg===pid)e.intent.tg=null})}
  if(c&&!Object.keys(c.heroes).length){R.combat=null;R.phase='map';R.votes={}}
}
ACT.abandon=(a,P,pid)=>{
  removePlayer(pid);
  if(pid===R.host){const next=R.order.find(q=>online.has(q));if(next)R.host=next}
};
function abandonRun(){

}

  if(costOf(c)>h.energy){toast('Energia insufficiente');return}
  const a=alive();
  if(d.tg&&a.length>1){UI.sel=(UI.sel&&UI.sel.k==='c'&&UI.sel.uid===c.uid)?null:{k:'c',uid:c.uid};render();return}
  UI.sel=null;send({t:'play',uid:c.uid,j:d.tg&&a[0]?g.enemies.indexOf(a[0]):null});
}
function clickEnemy(j){
  if(!UI.sel||!g||!g.enemies[j]||g.enemies[j].hp<=0)return;const s=UI.sel;UI.sel=null;

function fx(k,txt,cls){if(k==='hero')k='h-'+CUR;fxq.push({k,txt,cls})}
function flushFx(list){
  const layer=$('#fx');const counts={};
  (list||[]).forEach(f=>{const el=document.getElementById('ent-'+f.k);if(!el)return;const r=el.getBoundingClientRect();counts[f.k]=(counts[f.k]||0)+1;
    const d=document.createElement('div');d.className='float '+f.cls;d.textContent=f.txt;d.style.left=(r.left+r.width/2+(counts[f.k]-1)*18)+'px';d.style.top=(r.top+r.height*.35+(counts[f.k]-1)*14)+'px';
    layer.appendChild(d);setTimeout(()=>d.remove(),1000);
    if(f.cls==='dmg'||f.cls==='psn'){const im=el.querySelector('.spr');if(im){im.classList.remove('hit');void im.offsetWidth;im.classList.add('hit')}}});
}

const KW=/(Vulnerabile|Debole|Veleno|Forza|Destrezza|Armatura|Spine|TUTTI)/g;
function cardHTML(c,o={}){

  return `<${tag} class="card t-${d.t} r-${d.r} ${c.up?'up':''} ${o.cls||''}" ${o.click?`onclick="${o.click}" aria-label="${d.n}"`:''}>

    <span class="cdesc"><span>${d.x(vals(c)).replace(KW,'<b>$1</b>')}${d.ex?' <b>Esaurisci.</b>':''}</span></span></${tag}>`;

function chips(t,pw){
  let h=Object.entries(t.st).filter(([k,v])=>v).map(([k,v])=>`<span class="chip ${k}" role="button" tabindex="0" onclick="event.stopPropagation();stInfo('${k}')">${STN[k][0]} ${v}</span>`).join('');

function hpBar(hp,max){return `<div class="bar"><i style="width:${Math.max(0,hp/max*100)}%"></i><span>${Math.max(0,hp)}/${max}</span></div>`}
function intentHTML(e){
  const it=e.intent;if(!it||e.hp<=0)return '<div class="intent" style="visibility:hidden">-</div>';
  const tgtH=(it.tg&&g.heroes[it.tg])||g.hero;const p=[];
  if(it.d){const d=calcDmg(enemyBase(e,it),e,tgtH);p.push(`<span class="atk">⚔ ${d}${it.x>1?'×'+it.x:''}</span>`)}
  if(it.b)p.push(`<span class="def">🛡 ${Math.round(it.b*(e.dm||1))}</span>`);
  if(it.s)p.push(`<span class="buf">▲ Forza${it.all?' a tutti':''}</span>`);
  if(it.heal)p.push(`<span class="def">✚ Cura</span>`);
  if(it.deb)p.push(`<span class="deb">☠ ${STN[it.deb][0]}</span>`);
  const tg=!solo&&it.tg&&(it.d||it.deb)?`<span class="tgt">→ ${it.tg===ME?'te':esc(pname(it.tg))}</span>`:'';

function mapScreen(){
  const map=R.map,W=700,G=86,H=(ROWS+1)*G+70;
  const pos=n=>[50+n.x*100+n.jx,H-50-n.y*G+n.jy-(n.type==='boss'?20:0)];
  const done=new Set(R.path.map(p=>p.join(',')));
  const doneE=new Set();for(let i=1;i<R.path.length;i++)doneE.add(R.path[i-1].join(',')+'>'+R.path[i].join(','));
  const av=new Set(availNodes().map(n=>n.y+','+n.x));
  const tally={};active().forEach(p=>{const v=R.votes[p];if(v)tally[v]=(tally[v]||0)+1});const myV=R.votes[ME];
  let lines='',nodes='';
  map.forEach(row=>row.forEach(n=>{if(!n)return;const[x1,y1]=pos(n);
    n.next.forEach(nx=>{const m=map[n.y+1][nx];const[x2,y2]=pos(m);lines+=`<line class="edge ${doneE.has(n.y+','+n.x+'>'+m.y+','+m.x)?'done':''}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`});
    const k=n.y+','+n.x;const cur=R.pos&&R.pos.y===n.y&&R.pos.x===n.x;const r=n.type==='boss'?44:24;
    nodes+=`<g class="node ${done.has(k)?'done':''} ${cur?'cur':''} ${av.has(k)?'avail':''} ${myV===k?'voted':''} ${n.type==='boss'?'boss':''}" ${av.has(k)?`onclick="vote(${n.y},${n.x})" role="button" tabindex="0" aria-label="${NODEN[n.type]}, piano ${n.y+1}" onkeydown="if(event.key==='Enter')vote(${n.y},${n.x})"`:''}>
      <circle cx="${x1}" cy="${y1}" r="${r}"/><image href="${spr(n.type)}" x="${x1-r*.62}" y="${y1-r*.62}" width="${r*1.24}" height="${r*1.24}" style="image-rendering:pixelated"/><title>${NODEN[n.type]}</title>
      ${tally[k]&&!solo?`<circle class="vbadge" cx="${x1+r*.8}" cy="${y1-r*.8}" r="12"/><text class="vbadge-t" x="${x1+r*.8}" y="${y1-r*.8}">${tally[k]}</text>`:''}</g>`;
  }));
  const act=active();const nv=act.filter(p=>R.votes[p]).length;
  const msg=solo?'Tocca un nodo illuminato per avanzare':`Votate il prossimo passo: ${nv}/${act.length} voti${myV?' · puoi cambiare voto finché votano tutti':''}`;
  return `<main class="flush"><div class="mapwrap" id="mapwrap"><svg class="mapsvg" id="mapsvg" viewBox="0 0 ${W} ${H}" aria-label="Mappa della Rocca">${lines}${nodes}</svg></div>
    <div class="legend">${Object.keys(NODEIC).map(k=>`<span>${sprImg(k,16,'inl')} ${NODEN[k]}</span>`).join('')}<span style="color:var(--torch2)">${msg}</span></div></main>`;
}
function scrollMap(){
  const w=$('#mapwrap'),svg=$('#mapsvg');if(!w||!svg)return;
  const H=(ROWS+1)*86+70;const sc=svg.getBoundingClientRect().height/H;
  const y=R.pos?R.pos.y:0;const target=(H-50-y*86)*sc;
  w.scrollTop=Math.max(0,target-w.clientHeight*.7);
}

    <p class="muted">Seed della partita: <b style="color:var(--fg)">${R.seed}</b>. Condividilo e sfida altri gruppi a fare meglio.</p>
    <div class="row">${solo?`<button class="btn primary" onclick="R=null;g=null;screen='title';render()">Nuova partita</button>`:
      (R.host===ME?`<button class="btn primary" onclick="send({t:'again'})">Nuova partita con il gruppo</button>`:'<span class="muted">L\'host può avviare una nuova partita.</span>')+'<button class="btn" onclick="leaveRoom(true)">Esci dalla stanza</button>'}</div></div></main>`;
}


/* ================= CHAT ================= */
let chatOpen=false,chatSeen=0;
ACT.chat=(a,P,pid)=>{const t=String(a.text||'').trim().slice(0,200);if(!t)return;R.chat=(R.chat||[]).concat({p:pid,n:P.name,t}).slice(-80)};
function toggleChat(v){chatOpen=v==null?!chatOpen:v;$('#chat').hidden=!chatOpen;if(chatOpen){chatSeen=(R&&R.chat||[]).length;renderChat();setTimeout(()=>{const i=$('#chatin');if(i)i.focus()},50)}render()}
function quickMsg(b){send({t:'chat',text:b.textContent})}
function renderChat(){
  const list=(R&&R.chat)||[];
  if(!R||solo){$('#chat').hidden=true;chatOpen=false;chatSeen=0;return}
  if(list.length>chatSeen&&!chatOpen){const m=list[list.length-1];if(m.p!==ME)toast(m.n+': '+m.t)}
  if(chatOpen)chatSeen=list.length;
  const log=$('#chatlog');const atBottom=log.scrollHeight-log.scrollTop-log.clientHeight<40;
  log.innerHTML=list.length?list.map(m=>`<div class="msg ${m.p===ME?'me':''}"><b>${esc(m.n)}</b>${esc(m.t)}</div>`).join(''):'<p class="muted">Nessun messaggio. Scrivi qualcosa al gruppo!</p>';
  if(atBottom||chatOpen)log.scrollTop=log.scrollHeight;
}
function chatBtn(){if(solo||!R)return '';const n=Math.max(0,((R.chat||[]).length)-chatSeen);return `<button class="btn chatbtn" onclick="toggleChat()">Chat${n&&!chatOpen?`<span class="dot">${n}</span>`:''}</button>`}
document.getElementById('chatform').addEventListener('submit',e=>{e.preventDefault();const i=$('#chatin');const t=i.value.trim();if(!t)return;send({t:'chat',text:t});i.value=''});

/* ================= AVVIO ================= */
(function boot(){
  const h=(location.hash||'').replace('#','').toUpperCase();
  if(/^[A-Z0-9]{4}$/.test(h)&&h!==load('valdombra-room')){UI.joinCode=h;screen='mp'}
  render();
})();

</script>
</body>
</html>
