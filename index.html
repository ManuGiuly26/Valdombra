    +sec('In combattimento',li(['Tutti giocano il proprio turno insieme; i nemici agiscono quando tutti hanno premuto «Fine turno». Se un alleato ti dà altra Energia puoi premere «Riprendi il turno».','Alcune carte aiutano gli alleati: dopo averle scelte tocca l\'eroe da aiutare. Le <b>carte di gruppo</b> diventano più forti se un alleato ha già giocato un certo tipo di carta.','Con <b>Segnala</b> tocchi un nemico («attacco questo!») o il tuo eroe («proteggimi!»).','Chi cade resta a terra fino alla fine del combattimento e si rialza con il 25% dei PV, a meno che un compagno non lo rianimi prima con «Rianimazione», «Ultima Grazia» o la Piuma di Fenice.','Il Guardiano può provocare i nemici e prendere i colpi al posto degli altri.']))
    +sec('Chat','Nella stanza e a fine partita il pulsante Chat è sempre visibile, con frasi rapide già pronte. Si può spegnere nelle Impostazioni.');
  if(t==='ombra')b=(LO()||SET.lo?'':'<p class="muted">Luce e Ombra ora è spenta: la riattivi da Impostazioni, Sviluppo.</p>')+sec('Due lati per ogni carta','Ogni carta con danni, Armatura o Veleno ha due lati. Il <b>lato Luce</b> è l\'effetto normale. Premi <b>«Lato Ombra»</b> prima di scegliere la carta e la giochi dal <b>lato Ombra</b>: danni, Armatura e Veleno aumentano del 50%, ma ricevi <b>1 Ombra</b>. Le carte che non hanno un lato Ombra si vedono sbiadite.')
    +sec('L\'Ombra',li(['La barra viola sotto i tuoi PV va da 0 a 10 e resta da un combattimento all\'altro.','<b>Da 5 in su</b> i nemici ti vedono: ogni loro colpo ti infligge 2 danni in più.','<b>A 10</b> cadi nell\'ombra: perdi 4 PV massimi e per quel turno infliggi danni doppi e ottieni 2 Energia. Poi <b>resti a 10</b> finché non ti purifichi: riposando a un Falò acceso, con l\'Incenso del mercante, dal Pellegrino o con la sacerdotessa del Tempio.','Quando cadi <b>si spengono alcuni falò</b> della mappa (uno in più ogni 2 Livelli di Assedio): lì non puoi riposare, e se ci passi a 10 Ombra ti ammali. Da malato ricevi una carta <b>Malattia</b> a ogni combattimento (perdi 3 PV a fine turno se è in mano) finché resti a 10.','Cala di 1 alla fine di ogni turno in cui giochi carte solo dal lato Luce (ma non quando sei a 10), e di 3 quando riposi a un Falò acceso.']))
    +sec('Creature d\'ombra','Scheletri, spettri, non morti, demoni, il Re Lich, Azhrakel e altri hanno l\'etichetta viola <b>Creatura d\'ombra</b>. Le carte dal lato Luce infliggono loro il 25% di danni in più, quelle dal lato Ombra non le fanno danni extra. Le loro maledizioni ti danno 1 Ombra, e a inizio combattimento ottengono 1 Forza ogni 5 Ombra del gruppo (massimo 3).')
    +sec('Il mondo ti guarda',li(['<b>Il Mercante</b>: con 0 o 1 Ombra ti fa il 10% di sconto, da 5 in su alza i prezzi del 15%. Vende un Incenso che toglie 3 Ombra e si paga '+PUR_GEM.incenso+' Gemme.','<b>Il Mercante d\'Ombra</b>: compare solo se hai almeno 5 Ombra e ti vende una reliquia maledetta in cambio di 3 Ombra invece che d\'oro.','<b>I nemici comuni</b> ti temono: se a inizio combattimento hai 7 Ombra o più, ricevono 1 Debole.','<b>Le creature d\'ombra</b> cercano chi ha più Ombra (almeno 5) e attaccano lui.','<b>Bottino</b>: con 5 Ombra o più trovi il 25% di oro in più dopo ogni combattimento.','<b>Eventi</b>: il Pellegrino della Luce e lo Specchio Nero cambiano a seconda della tua Ombra.']))
    +sec('In gruppo','L\'Ombra di uno è un problema di tutti: le creature d\'ombra si rafforzano con l\'Ombra di tutto il gruppo. Toccando l\'etichetta «Ombra» di un compagno puoi <b>assorbire</b> 3 della sua Ombra per 1 Energia, per salvarlo dalla Caduta. Così nascono i ruoli: chi resta nella luce e protegge, chi scende nell\'ombra e colpisce forte. Vale l\'impostazione di chi crea la stanza.');
  if(t==='vil')b=sec('Il Villaggio di Valdombra','Una missione secondaria che dura tra una partita e l\'altra. Ogni edificio ha un abitante con una richiesta (giocare una partita, superare piani, sconfiggere élite o nemici, completare un dungeon). Quando è esaudita, ricostruisci l\'edificio con le Corone e poi lo migliori fino al livello 3.'+li(vilList().map(b=>`<b>${b.n}</b>: ${b.lv.map((l,i)=>'liv. '+(i+1)+' '+l[1]+' ('+l[0]+' Corone)').join('; ')}`))+'<span class="muted">I vantaggi valgono da soli e in gruppo, ma non nella sfida del giorno.</span>')
    +sec('Le Gemme',`La seconda moneta, molto più rara delle Corone. Ne guadagni ${gemFonti()}. Servono anche per purificarti dall'Ombra durante la partita. Le Corone servono per eroi, abilità, zaino e Villaggio; le Gemme per:`+li([`<b>Cimeli permanenti</b> (${CIM_GEM} Gemme): reliquie comprate una volta sola che porti in ogni partita. Uno alla volta, due con la Sala dei Cimeli.`,`<b>Aspetti degli eroi</b> (${SKIN_GEM} Gemme l'uno).`,`<b>Cambio</b>: ${EX_GEM} Gemme diventano ${EX_CR} Corone.`]))
    +sec('Luce contro Ombra',li(['<b>Nella Luce</b> (0-2 Ombra): le cure ti curano il 25% in più, alla fine di un turno di sole carte Luce ottieni 3 Armatura (Scudo di Luce) e a inizio combattimento hai il <b>potere di Luce</b> del tuo eroe.','<b>Nell\'Ombra</b> (5 o più): a inizio combattimento hai il <b>potere d\'Ombra</b> del tuo eroe, ma i nemici ti colpiscono più forte; da 7 le cure ti curano la metà.','Tra 3 e 4 Ombra non hai né l\'uno né l\'altro.'])+`<table class="adtab"><tr><th>Eroe</th><th>Potere di Luce</th><th>Potere d'Ombra</th></tr>${Object.keys(CLASSES).map(c=>`<tr><td>${esc(CLASSES[c].n)}</td><td style="text-align:left;white-space:normal">${OMPOW[c].L[0]}</td><td style="text-align:left;white-space:normal">${OMPOW[c].O[0]}</td></tr>`).join('')}</table>`)
    +sec('Spegnere Luce e Ombra','Da Impostazioni, Sviluppo puoi spegnere Luce e Ombra, oppure accendere «Ombra per tutti gli eroi», che dà un lato Ombra anche alle carte che curano, marchiano, evocano o fanno pescare. I progressi restano salvati.');
  if(t==='prog')b=sec('Corone e Bottega','Le Corone si guadagnano completando i dungeon, in Sopravvivenza e con le Imprese. Nella Bottega le spendi in oggetti per lo zaino (pozioni, reliquie, oro, PV, carte potenziate) che porti nella partita successiva, da solo o in gruppo, e negli Aspetti degli eroi.')
    +sec('Nuovi eroi','Nella schermata principale gli eroi con il lucchetto si sbloccano con le Corone e restano tuoi per sempre.')
    +sec('Crescita degli eroi','Ogni eroe guadagna esperienza quando lo usi e sale di livello. Ai livelli 2, 3, 5, 7 e 10 puoi comprare con le Corone un\'abilità unica di quell\'eroe, da attivare prima della partita.')
    +sec('Imprese',`${ACH.length} obiettivi da completare, ognuno con un premio in Corone. Li trovi nel Diario, con l'avanzamento di quelli in corso.`)
    +sec('Aspetti degli eroi',`Nuovi colori per i tuoi eroi, ${GEMON()?SKIN_GEM+' Gemme':SKIN_PRICE+' Corone'} l'uno, nella Bottega. Li vedono anche i compagni e non cambiano le regole.`)
    +sec('Diario','Statistiche delle tue partite, Imprese ed enciclopedia di carte, mostri, reliquie e pozioni che hai scoperto.')
    +sec('Profilo','Con un profilo (nome e password) ritrovi Corone, eroi, livelli e progressi su ogni dispositivo, per esempio sul telefono e sul PC.');
  if(t==='set')b=sec('Impostazioni','Dall\'ingranaggio in alto a destra: volume di musica ed effetti, chat, animazioni, dimensione del testo, contrasto alto, vibrazione, consigli del tutorial (riprendono da dove eri rimasto) e invio delle statistiche anonime.')
    +sec('App sul telefono','Il gioco si può installare come app: dal browser scegli «Aggiungi a schermata Home» (o «Installa app»). Così si apre a schermo intero e funziona anche con poca rete, tranne il gioco in gruppo e le classifiche.');
  return `<div class="wrap" style="gap:12px"><div class="row gtabs">${GUIDA.map(([k,n])=>`<button class="btn ${t===k?'primary':''}" onclick="UI.guTab='${k}';render()">${n}</button>`).join('')}</div>${b}</div>`}

/* ================= SOLO ================= */
function startSolo(){
  solo=true;isHost=true;chan=null;ME='solo';online=new Set([ME]);
  R=newLobby('SOLO');R.players.solo.name=CLASSES[pickCls].n;R.players.solo.loadout=getZaino();R.players.solo.tal=getTal();R.players.solo.vil=SET.vil!==false?getVil():{};R.players.solo.cim=GEMON()?cimSel():[];rng=new RNG(1);
  if($('#sname')&&$('#sname').value.trim()){myName=$('#sname').value.trim().slice(0,16);store('valdombra-nome',myName)}
  if(noLvl(pickMode)&&myName)R.players.solo.name=myName;
  if(pickMode==='porta'||!dgUnlocked(pickDg,pickMode))pickDg='rocca';
  startRunRoom(Math.min(pickLvl,getUnlocked(pickDg)),($('#seed')&&$('#seed').value)||'',pickMode,pickDg);commit();
}
function continueSolo(){const s=load(SOLO_K);if(!s)return;solo=true;isHost=true;chan=null;ME='solo';online=new Set([ME]);R=JSON.parse(s);rng=new RNG(0);rng.s=R.rs|0;commit()}

/* ================= AZIONI DAL'INTERFACCIA ================= */
function clickCard(i){
  const h=g&&g.hero;if(!h||h.ended||h.down||g.busy)return;const c=h.hand[i];if(!c)return;const d=CARDS[c.id];
  if(d.unplay){toast(d.n+': questa carta non si può giocare.');return}
  if(costOf(c)>h.energy){toast('Energia insufficiente');return}
  if(UI.om&&!canShadow(c)){toast(d.n+(d.t==='P'?' è un Potere: i Poteri non hanno un lato Ombra.':LOX()?' non ha un lato Ombra.':' non ha un lato Ombra: solo le carte con danni, Armatura o Veleno ce l\'hanno.'));return}
  const sh=UI.om?1:0;const a=alive();
  if(d.tg&&a.length>1){UI.sel=(UI.sel&&UI.sel.k==='c'&&UI.sel.uid===c.uid)?null:{k:'c',uid:c.uid,sh};render();return}
  if(d.ally&&!solo&&party().length>1){UI.sel=(UI.sel&&UI.sel.uid===c.uid)?null:{k:'c',uid:c.uid,ally:1,sh};render();if(UI.sel)toast('Tocca l\'eroe da aiutare (anche te stesso)');return}
  UI.om=false;
  if(d.ally){UI.sel=null;send({t:'play',uid:c.uid,a:ME,sh});return}
  if(d.choose){UI.sel=null;const desc=lab=>{const f=FORMK.find(k=>FORMS[k][0]===lab);if(f)return FORMS[f][1];const e=ELEMK.find(k=>ELEMS[k][0]===lab);return e?ELEMS[e][1]:''};
    modal={title:d.n,cancel:true,list:[],html:`<div class="opts" style="max-width:520px;margin:0 auto">${d.choose.map((lab,i)=>`<button class="opt" onclick="modal=null;send({t:'play',uid:${c.uid},pk:${i},sh:${sh}})"><b>${lab}</b><br><span class="muted">${desc(lab)}</span></button>`).join('')}</div>`};render();return}
  if(d.pick&&h.disc.length){UI.sel=null;modal={title:'Scegli una carta dagli scarti',list:h.disc.map(x=>({c:x,i:x.uid})),cb:pk=>send({t:'play',uid:c.uid,pk,sh}),cancel:true};render();return}
  UI.sel=null;send({t:'play',uid:c.uid,j:d.tg&&a[0]?g.enemies.indexOf(a[0]):null,sh});
}
function clickHero(pid){
  if(UI.ping){UI.ping=false;if(pid===ME)send({t:'ping',k:'h'});else render();return}
  if(!UI.sel||!UI.sel.ally||!g||!g.heroes[pid]||g.heroes[pid].down)return;const s=UI.sel;UI.sel=null;UI.om=false;send({t:'play',uid:s.uid,a:pid,sh:s.sh});
}
function clickEnemy(j){
  if(UI.ping){UI.ping=false;if(g&&g.enemies[j]&&g.enemies[j].hp>0)send({t:'ping',k:'e',j});else render();return}
  if(!UI.sel||UI.sel.ally||!g||!g.enemies[j]||g.enemies[j].hp<=0)return;const s=UI.sel;UI.sel=null;
  if(s.k==='c'){UI.om=false;send({t:'play',uid:s.uid,j,sh:s.sh})}else send({t:'potion',i:s.i,j});
}
function clickPotion(i){
  const id=run&&run.potions[i];if(!id)return;const p=POTIONS[id];
  if(R.phase==='combat'&&g&&g.hero&&!g.hero.down){
    if(g.busy)return;const a=alive();
    if(p.tg&&a.length>1){UI.sel=(UI.sel&&UI.sel.k==='p'&&UI.sel.i===i)?null:{k:'p',i};render();if(UI.sel)toast('Scegli un bersaglio');return}
    send({t:'potion',i,j:p.tg&&a[0]?g.enemies.indexOf(a[0]):null});
  }else potionMenu(i);
}
function potionMenu(i){
  const id=run.potions[i],p=POTIONS[id];
  modal={title:p.n,cancel:true,list:[],html:`<div class="panel" style="max-width:520px;margin:0 auto;flex-direction:row;align-items:center;gap:14px">${potIc(id,48)}<div style="flex:1;display:flex;flex-direction:column;gap:10px">
    <p>${p.d}${id==='cura'?'':' Si può usare solo in combattimento.'}</p>
    <div class="row">${id==='cura'?`<button class="btn primary" onclick="modal=null;send({t:'drink',i:${i}});toast('Recuperi 15 PV.')">Bevi ora</button>`:''}
    <button class="btn danger" onclick="modal=null;send({t:'dropPot',i:${i}});toast('${p.n.replace(/'/g,"\\'")} gettata via.')">Getta via</button><button class="btn" onclick="closeModal()">Tienila</button></div></div></div>`};render();
}
function endTurnBtn(){UI.sel=null;send({t:'end'})}
function vote(y,x){send({t:'vote',y,x})}
function proceed(force){
  const r=run&&run.screen==='reward'&&run.reward;
  if(r&&r.cards&&!force){modal={title:'Non hai scelto una carta',cancel:true,list:[],html:`<div class="panel" style="max-width:520px;margin:0 auto">
    <p>Tra le ricompense c'è ancora una carta da scegliere. Oro, pozione e reliquia non raccolti finiscono comunque nel tuo inventario.</p>
    <div class="row"><button class="btn primary" onclick="closeModal()">Torna a scegliere la carta</button><button class="btn" onclick="modal=null;proceed(true)">Salta la carta e prosegui</button></div></div>`};render();return}
  const tr=run&&run.screen==='treasure'&&run.treasure;
  if(r||tr){const got=[];const o=r||tr;if(o.gold)got.push(o.gold+' oro');if(r&&r.potion)got.push(POTIONS[r.potion].n);if(o.relic)got.push(RELICS[o.relic].n);if(got.length)toast('Raccolto automaticamente: '+got.join(', '))}
  send({t:'done',skip:!!force});
}
function takeCardUI(k){toast(CARDS[run.reward.cards[k]].n+' aggiunta al mazzo');send({t:'takeCard',k})}
function takePotionUI(){send({t:'takePotion'})}
function takeRelicUI(){toast('Reliquia ottenuta: '+RELICS[run.reward.relic].n);send({t:'takeRelic'})}
function buyUI(kind,k){const it=run.shop[kind][k];if(it.sold)return;if(run.gold<omPrice(it.price)){toast('Oro insufficiente');return}
  if(kind==='potions'&&run.potions.length>=3){potFullUI(k);return}
  send({t:'buy',kind,k})}
function potFullUI(k){const it=run.shop.potions[k],np=it.id,pr=omPrice(it.price);modal={title:'Hai già 3 pozioni',cancel:true,potBuy:k,list:[],html:`<div class="panel" style="max-width:560px;margin:0 auto">
    <div class="row" style="gap:12px">${potIc(np,44)}<div style="flex:1;min-width:0"><b>${POTIONS[np].n}</b> · ${pr} oro<br><span class="muted">${POTIONS[np].d}</span></div></div>
    <p>Sei sicuro di volerla comprare? Le tue tasche sono piene: per tenerla devi lasciare una delle tue pozioni. Paghi ${pr} oro solo se scegli quale sostituire.</p>
    <div class="plist">${run.potions.map((id,i)=>`<div class="prow">${potIc(id,32)}<div style="flex:1;min-width:0"><b>${POTIONS[id].n}</b><br><span class="muted">${POTIONS[id].d}</span></div><button class="btn primary" onclick="potBuySwap(${k},${i})">Sostituisci</button></div>`).join('')}</div>
    <div class="row pkbar"><button class="btn" onclick="closeModal()">Annulla</button></div></div>`};render()}
function potBuySwap(k,i){const it=run.shop.potions[k];modal=null;toast(POTIONS[it.id].n+' al posto di '+POTIONS[run.potions[i]].n+': −'+omPrice(it.price)+' oro');send({t:'buy',kind:'potions',k,swap:i})}
function shopRemoveUI(){if(run.shop.removeUsed)return;if(run.gold<removePrice()){toast('Oro insufficiente');return}
  const pr=removePrice();openPicker(run.deck.map((c,i)=>i),'Scegli una carta da bruciare',i=>{toast(CARDS[run.deck[i].id].n+' bruciata: −'+pr+' oro');send({t:'shopRemove',i})},true,
    {confirm:'Brucia questa carta ('+pr+' oro)',hint:'Tocca la carta da togliere dal mazzo, poi premi <b>Brucia questa carta</b>. Paghi '+pr+' oro solo quando confermi: con <b>Annulla</b> non spendi nulla.'})}
function restHealUI(){toast((isPorta()?'Bende fresche: recuperi ':'Recuperi ')+Math.floor(run.max*restPct(run))+' PV.');send({t:'restHeal'})}
const restPct=P=>((P&&P.vb&&P.vb.erbe>=2)?.4:.3)*(R&&R.daily&&R.daily.mod==='umido'?.5:1);
function restForgeUI(){openPicker(run.deck.map((c,i)=>i).filter(i=>canUp(run.deck[i])),'Scegli una carta da potenziare',i=>{toast(CARDS[run.deck[i].id].n+' potenziata!');send({t:'restForge',i})},true,{preview:true})}
function chooseEv(k){const ev=EVENTS.find(e=>e.id===run.event.id);const o=ev.opts[k];if(o.req&&!o.req())return;if(o.gem&&!gemPaga(o.gem,o.t.toLowerCase()))return;
  if(o.pick)openPicker(run.deck.map((c,i)=>i),'Scegli una carta da dimenticare',i=>send({t:'ev',k,i}));else send({t:'ev',k})}
const HEROES_K='valdombra-eroi';
function getHeroes(){try{const a=JSON.parse(load(HEROES_K));return Array.isArray(a)?a.filter(k=>CLASSES[k]):[]}catch(e){return[]}}
const heroOwned=k=>!!CLASSES[k]&&(!CLASSES[k].price||getHeroes().includes(k));
function openBuyHero(k){const c=CLASSES[k],cr=getCrowns();
  modal={title:'Sblocca il '+c.n,cancel:true,list:[],html:`<div class="panel" style="max-width:560px;margin:0 auto;align-items:center;text-align:center">${sprImg(k,96)}<p>${c.desc}</p>
    <p class="muted">${c.hp} PV · Reliquia iniziale: ${relIc(c.relic,16)} <b>${RELICS[c.relic].n}</b>: ${RELICS[c.relic].d}</p>
    <div class="row" style="justify-content:center"><button class="btn primary" ${cr<c.price?'disabled':''} onclick="buyHero('${k}')">${ic('i_crown',16)} Sblocca per ${c.price} Corone</button><button class="btn" onclick="closeModal()">Non ora</button></div>
    <p class="muted" style="font-size:13px">Hai ${cr} Corone.${cr<c.price?' Ne guadagni vincendo un dungeon o in Sopravvivenza.':''} L'eroe resta sbloccato per sempre${ACC?' sul tuo profilo':''}.</p></div>`};render()}
function buyHero(k){const c=CLASSES[k];if(!c||heroOwned(k))return;const cr=getCrowns();if(cr<c.price){toast('Corone insufficienti.');return}
  setCrowns(cr-c.price);const h=getHeroes();h.push(k);store(HEROES_K,JSON.stringify(h));modal=null;achCheck();sfx('fanfare');toast(c.n+' sbloccato!');setCls(k)}
function setCls(k){if(!heroOwned(k)){openBuyHero(k);return}pickCls=k;if(R&&R.phase==='lobby')send({t:'cls',cls:k});else render()}
function startGame(){
  const notReady=active().filter(p=>!R.players[p].ready&&p!==R.host);
  if(notReady.length){toast('Aspetta che siano tutti pronti: '+notReady.map(pname).join(', '));return}
  {const dg=R.ldg||'rocca',m=R.lmode||'norm',L=noLvl(m)?0:Math.min(pickLvl,getUnlocked(dg));const bl=blockers(dg,m,L);if(bl.length){toast(blockMsg(bl,dg,m,L)+' Scegli un dungeon o un livello che avete tutti.');return}}
  send({t:'start',lvl:Math.min(pickLvl,getUnlocked(R.ldg||'rocca')),seed:UI.seed});
}
function copyText(s,ok){try{navigator.clipboard.writeText(s).then(()=>toast(ok),()=>toast(s))}catch(e){toast(s)}}
function inviteLink(){return location.origin+location.pathname+'#'+R.code}
function copyInvite(){copyText(inviteLink(),'Link d\'invito copiato!')}
function copySeed(){copyText(R.seed,'Seed copiato: '+R.seed)}

/* ================= MODALI ================= */
function openPicker(indices,title,cb,cancel=true,opt={}){UI.pvSel=null;modal={title,list:indices.map(i=>({c:run.deck[i],i})),cb,cancel,preview:!!opt.preview,confirm:opt.confirm||null,hint:opt.hint||''};render()}

function pvClick(k){if(canHover()||UI.pvSel===k)pickerPick(k);else{UI.pvSel=k;render()}}
function pickerGrid(){

function render(fxs){

  else{
    ctx(ME);const P=R.players[ME];
    if(UI.sel&&UI.sel.k==='c'&&!(g&&g.hero&&g.hero.hand.some(c=>c.uid===UI.sel.uid)))UI.sel=null;
    if(!P)h=notInRoomHTML();
    else if(R.phase==='lobby')h=lobbyHTML();
    else{
      h=hud();
      if(R.phase==='map')h+=partyHTML()+mapScreen();
      else if(R.phase==='combat')h+=g&&g.hero?combatScreen():waitBoxHTML('Combattimento in corso','Ti unirai al gruppo dallo scontro successivo.');
      else if(R.phase==='room')h+=partyHTML()+roomScreen(P);
      else if(R.phase==='end')h+=endScreen();
    }
  }
  if(R&&R.players[ME]){
    const P=R.players[ME];
    if(!solo&&(R.phase==='lobby'||R.phase==='end')){const me=R.players[ME];const vl=SET.vil!==false?getVil():{},cm=GEMON()?cimSel():[];const zj=JSON.stringify(getZaino())+JSON.stringify(getTal())+JSON.stringify(myProg())+JSON.stringify(skSel())+JSON.stringify(vl)+JSON.stringify(cm)+(me&&me.prog?1:0);if(UI.sentZ!==R.code+zj){UI.sentZ=R.code+zj;setTimeout(()=>send({t:'loadout',z:getZaino(),tal:getTal(),prog:myProg(),sk:skSel(),vil:vl,cim:cm}),0)}
      if(R.phase==='lobby'&&R.host===ME){const L=Math.min(pickLvl,getUnlocked(R.ldg||'rocca'));if((R.llvl|0)!==L&&UI.sentL!==R.code+L+':'+R.v){UI.sentL=R.code+L+':'+R.v;setTimeout(()=>send({t:'lvl',l:L}),0)}}}
    else UI.sentZ=null;
    if(P.zApplied&&UI.zClr!==R.code+R.seed){UI.zClr=R.code+R.seed;setZaino({});if(R.phase==='map'&&R.floor===0)toast('Dallo zaino: '+P.zApplied)}
    if(P.vApplied&&UI.vClr!==R.code+R.seed+R.t0&&R.phase==='map'&&R.floor===0){UI.vClr=R.code+R.seed+R.t0;setTimeout(()=>toast('Dal Villaggio: '+P.vApplied),P.zApplied?2200:0)}
  }
  {const Pn=R&&R.players&&R.players[ME];if(Pn&&Pn.upNote){const key=R.code+R.seed+(R.t0||0)+':'+Pn.upNote.k;if(UI.upK!==key){UI.upK=key;setTimeout(()=>toast(Pn.upNote.t),UI.upK0?0:900);UI.upK0=1}}}
  if(R&&run&&run.pendPot&&(!modal||modal.pend)){const np=run.pendPot;modal={title:'Hai già 3 pozioni',pend:1,cancel:false,list:[],html:`<div class="panel" style="max-width:560px;margin:0 auto">
    <div class="row" style="gap:12px">${potIc(np,44)}<div style="flex:1;min-width:0"><b>Nuova: ${POTIONS[np].n}</b><br><span class="muted">${POTIONS[np].d}</span></div></div>
    <p>Puoi tenerla al posto di una delle tue:</p>
    <div class="plist">${run.potions.map((id,i)=>`<div class="prow">${potIc(id,32)}<div style="flex:1;min-width:0"><b>${POTIONS[id].n}</b><br><span class="muted">${POTIONS[id].d}</span></div><button class="btn primary" onclick="send({t:'potSwap',i:${i}})">Sostituisci</button></div>`).join('')}</div>
    <div><button class="btn" onclick="send({t:'potLeave'})">Non la prendo</button></div></div>`}}
  else if(modal&&modal.pend&&!(run&&run.pendPot))modal=null;
  if(modal&&modal.bottega)modal.html=bottegaHTML();
  if(modal&&modal.board)modal.html=boardModalHTML();
  if(modal&&modal.settings)modal.html=settingsHTML();
  if(modal&&modal.crescita)modal.html=crescitaHTML();
  if(modal&&modal.villaggio)modal.html=villaggioHTML();
  if(modal&&modal.gioca)modal.html=giocaHTML();
  if(modal&&modal.profilo)modal.html=profiloHTML();
  if(modal&&modal.dboard)modal.html=dailyBoardHTML();
  if(modal&&modal.diario)modal.html=diarioHTML();
  if(modal&&modal.guida)modal.html=guidaHTML();
  if(modal&&modal.admin)modal.html=adminHTML();
  if(R&&!solo&&SET.chat&&!chatOpen&&R.players[ME]&&(R.phase==='lobby'||R.phase==='end')){const n=Math.max(0,((R.chat||[]).length)-chatSeen);h+=`<button class="btn primary chatfab" onclick="toggleChat(true)" aria-label="Apri la chat">Chat${n?`<span class="dot">${n}</span>`:''}</button>`}
  if(!modal&&(!R||R.phase==='lobby'||R.phase==='end'||!R.players[ME]))h+=`<button class="crownbadge" onclick="openBottega()" title="Le tue Corone: apri la Bottega" aria-label="${getCrowns()} Corone, apri la Bottega">${ic('i_crown',16)}<b>${getCrowns()}</b>${GEMON()?`${ic('i_gem',16)}<b class="gemc">${getGems()}</b>`:''}</button>`;
  h+=tutHTML();
  if(modal)h+=`<div class="modal" role="dialog" aria-label="${modal.title}"><div class="mhead"><h3 style="flex:1">${modal.title}</h3>${modal.cancel?`<button class="btn" onclick="closeModal()">${modal.cb||modal.potBuy!=null?'Annulla':'Chiudi'}</button>`:''}</div>
    <div class="mbody">${modal.html||pickerGrid()}</div></div>`;
  // mantieni la posizione di scorrimento se la schermata è la stessa
  const SCR=['main','#mapwrap','#cscroll','.hand','.party','.mbody'];
  const P0=R&&R.players[ME];
  const key=R?[R.code,R.phase,R.floor,P0?P0.screen:'',R.phase==='combat'&&R.combat?R.combat.enemies.length:''].join('|'):'t:'+screen;
  const mkey=modal?modal.title:'';

  document.body.dataset.dg=R&&R.dg&&R.phase!=='lobby'?R.dg:'';document.body.classList.toggle('mlite',!!SET.menu&&!R&&screen!=='mp');document.body.classList.toggle('hasmodal',!!modal);
  app.innerHTML=h;
  const same=UI.lastKey===key;UI.lastKey=key;UI.lastModal=mkey;
  Object.entries(saved).forEach(([q,[t,l]])=>{const el=$(q);if(el){el.scrollTop=t;el.scrollLeft=l}});
  if(R&&R.phase==='map'&&!same)scrollMap();
  if(R&&R.voteAnim&&(!UI.anim||UI.anim.id!==R.voteAnim.id))startVoteAnim(R.voteAnim);
  if(R&&!R.voteAnim&&UI.anim)UI.anim=null;
  renderChat();
  flushFx(fxs);
  musicFollow();
  try{seenTrack();if(R&&R.phase==='end')statsAward()}catch(e){}
  if(canHover()){const he=document.querySelector('.ent.enemy:hover');if(he)dmgTip(he);else dmgTipHide()}else dmgTipHide();
  if(!glTouch){const hv=document.querySelector('.card[data-gl]:hover');if(hv&&prevOn())cardPreview(hv);else{cardPreviewHide();if(hv)glShow(hv);else glHide()}}
  try{const hc=canHover()&&document.querySelector('.hand .card[data-uid]:hover');UI.hovC=hc?+hc.dataset.uid:null;dmgMarks()}catch(e){}
  cardTrunc();
}

/* Novità (v9.2): un messaggio per versione. Con il «Menu essenziale» si leggono dal pulsante «Novità» in alto a destra
   (pallino rosso se ce ne sono di nuove), non più nelle informazioni delle Impostazioni. */
function novitaTxt(){return `Novità della 9.2: nel «Menu essenziale» (in Sviluppo) sotto il titolo torna la descrizione, le Impostazioni si aprono dal pulsante in alto a destra (ora più grande) e c'è il pulsante «Novità»: le novità arrivano come messaggi, con un pallino rosso quando ce ne sono di nuove da leggere. Novità della 9.1: Guerriero e Mago più forti. L'Elmo del Veterano dà anche 1 Forza all'inizio di ogni combattimento; il Mago ha 76 PV, Scudo Arcano 7 Armatura, Dardo Magico 7 danni, Palla di Fuoco 9 danni a tutti e il Grimorio dà anche 1 Energia nel primo turno. Novità della 9.0: in Sviluppo c'è il «Menu essenziale», più semplice soprattutto da telefono. Dove vedi una carta (mazzo, ricompense, mercante, enciclopedia, carta ingrandita) vedi anche il suo lato Ombra, e viceversa. Nella barra in alto c'è il tempo di gioco (le pause lunghe non contano): se finisci il dungeon sotto i 5 minuti il punteggio sale del 30%, sotto i 10 del 15%, sotto i 20 del 5%. A 10 Ombra cadi e ci resti finché non ti purifichi: si spengono dei falò e passarci ti fa ammalare. Dal 19/11 la sfida del giorno è più dura: solo malus e Livello di Assedio 3. Guerriero, Mago e Ladro hanno più PV; Guardiano meno; l'Orso del Druido dà meno Armatura. In alto a destra corone e gemme senza scritte. Novità della 8.9: con Luce e Ombra e almeno 8 Ombra puoi uccidere il mercante (una sola volta per partita): prendi gratis una carta, una pozione e una reliquia a scelta, ma la tua Ombra sale a 10. Quando una carta si potenzia a caso (scrigni, eventi, zaino, villaggio) ti dice quale. Puoi disegnare il percorso che pensi di fare anche da solo, toccando i nodi o le linee (in gruppo ognuno col suo colore). Su telefono la mappa ha di nuovo tutto lo spazio: missioni, climi e aiuto del villaggio stanno in un riquadro che si apre toccandolo. Novità della 8.8: passando col mouse sopra una carta in mano vedi su ogni nemico quanta vita perderebbe (l'Armatura a parte), anche con le carte che colpiscono tutti; sulla sua barra lampeggia la parte che se ne andrebbe e il numero sta sopra la sua testa senza coprire il testo delle carte. Novità della 8.7: in «Aprite il cancello» al posto del Falò ci sono le Retrovie (bende o armaioli) e dietro di te si vedono gli abitanti in salvo, che crescono con i salvati e calano con i persi. Passando col mouse sopra un nemico vedi quanti danni gli fa ogni carta che hai in mano (o quella che hai scelto), già con Forza, Debole, Vulnerabile, Marchio, lato Luce/Ombra e la sua Armatura; quando scegli il bersaglio il numero compare sopra ogni nemico, anche su telefono. Novità della 8.6: dal mercante, se hai già 3 pozioni ti chiede prima se sei sicuro e quale sostituire; «Brucia una carta» apre il mazzo, scegli la carta e confermi, e con Annulla non paghi nulla. Novità della 8.5: «Aprite il cancello» si gioca anche in gruppo (lo sceglie l'host nella stanza) e ha la sua classifica, da soli e in cooperativa: 100 punti per ogni abitante salvato, più le ondate respinte e i nemici uccisi. Novità della 8.4: nuova modalità «Aprite il cancello»: le campagne bruciano e tu tieni aperto il cancello della Rocca contro 8 ondate, salvando più abitanti che puoi (4 Corone per ognuno). Nell'enciclopedia le carte si vedono anche dal lato Ombra. In combattimento le barre della vita sono più grandi e leggibili; sulla mappa la figura dell'eroe non copre più i nodi; le Gemme si vedono nella barra in alto. Un nemico si cura al massimo di metà dei suoi PV per combattimento. Novità della 8.3: Luce e Ombra più equilibrate. Con 0-2 Ombra sei nella Luce: cure +25%, Scudo di Luce e il potere di Luce del tuo eroe; da 5 Ombra c'è il potere d'Ombra, ma da 7 le cure ti curano la metà. Missioni di partita (tre obiettivi per Corone e Gemme), reliquie maledette, piani con un clima (Nebbia, Gelo, Luna nera, Vento) e un aiuto dal villaggio per partita. Le carte giocate dal lato Ombra hanno la loro illustrazione. Goblin ridisegnati. In Sviluppo c'è «Combattimento a scena». La purificazione dall'Ombra si paga in Gemme, che ora sono più rare. Corretto: un nemico che si cura e aggiunge Ferite non può più rendere un combattimento senza fine (al massimo 10 maledizioni per combattimento). Novità della 8.2: di rado sulla mappa si apre una strada segreta con tesori unici, tra cui sei reliquie segrete più forti del solito. In Sviluppo c'è «Ombra per tutti gli eroi»: anche cure, Marchio, Condanna, evocazioni e carte pescate hanno un lato Ombra. Villaggio, Gemme e Grafica Pixellab ora sono sempre accesi. C'è un codice premio per le Gemme. Novità della 8.1: le app del gioco per altre piattaforme possono inviare e ricevere le statistiche (visite, partite, le tue statistiche) tramite un unico indirizzo; il pannello di amministrazione mostra da quali piattaforme si gioca e le chiamate delle app. Novità della 8.0:il gioco conta le visite in modo anonimo (un codice casuale per dispositivo, niente nomi: si spegne con «Invia statistiche anonime»); per l'amministratrice c'è un pannello con visite, visitatori unici, partite, eroi, carte e classifica. Novità della 7.9: la mappa del dungeon ha i nodi più al centro, più grandi e più facili da toccare sul telefono; con «Grafica Pixellab» lo sfondo della mappa riempie tutto lo schermo. In combattimento le carte in mano hanno tutte la stessa altezza: l'illustrazione resta intera e il testo lungo sfuma (lo leggi tutto passando col mouse o tenendo premuta la carta). Novità della 7.8: con «Grafica Pixellab» accesa, passando col mouse sopra una carta la vedi ingrandita, con il testo intero e le parole chiave a fianco; le illustrazioni nella striscia sono più alte e inquadrate sul soggetto. Con «Contrasto alto» la descrizione delle carte giocate dal lato Ombra ora si legge. Novità della 7.7: con «Grafica Pixellab» accesa tutte le 191 carte hanno un'illustrazione sotto il nome; tenendo premuta una carta (anche col mouse, o con il tasto destro) la vedi in grande con l'illustrazione e le parole chiave. La Guida del gioco ha la sua icona, un libro. Novità della 7.6: con «Grafica Pixellab» accesa le carte hanno la nuova cornice del colore del tipo, il costo su una runa e la rarità come gemma; anche l'Energia è una runa. Novità della 7.5: con «Grafica Pixellab» accesa i nemici sconfitti hanno la loro animazione di morte e restano a terra, gli aspetti degli eroi hanno la versione Pixellab e Azhrakel ha nuovi colori. Novità della 7.4: con «Grafica Pixellab» accesa il villaggio cambia aspetto a ogni ricostruzione, reliquie, pozioni e icone sono nuove, eventi e luoghi hanno la loro illustrazione, i combattimenti hanno lo sfondo del dungeon e la mappa ha sfondo, decorazioni e la figura del tuo eroe. Novità della 7.3: con «Grafica Pixellab» accesa anche nemici, élite e boss sono disegnati con PixelLab, attaccano e reagiscono ai colpi; nuova icona del gioco. Novità della 7.2: con «Grafica Pixellab» accesa gli eroi disegnati con PixelLab compaiono ovunque, anche nella scelta dell'eroe, nei menu e nei riepiloghi. Novità della 7.1: in Sviluppo c'è «Grafica Pixellab», spenta di base. Accesa, in combattimento gli eroi sono disegnati con PixelLab e hanno le animazioni di attacco, difesa e colpo subito. Novità della 7.0: il pulsante «Gioca» sempre visibile per scegliere la modalità; Luce e Ombra (ogni carta si può giocare dal lato Ombra, più forte ma rischioso; creature d'ombra, mercante, eventi e bottino reagiscono alla tua Ombra), il Villaggio di Valdombra da ricostruire per avere vantaggi in ogni partita, e le Gemme, la seconda moneta per cimeli permanenti e aspetti. Si possono spegnere da Sviluppo. Dalla 6.4: la sfida del giorno usa tutti e 10 gli eroi e non ripete eroe, dungeon o modificatore del giorno prima; dalla 6.3: corretto il blocco quando l'eroe cade per una carta Ustione o Maledizione, tratti delle élite più leggeri (soprattutto da soli); dalla 6.2: aspetto Autunno per Ladro, Ranger e Druido, barra per la dimensione del testo, Guida del gioco, il tutorial riprende da dove eri rimasto; dalla 6.0: tutorial, Imprese con corone, un secondo boss per ogni dungeon, élite con tratti speciali, segnali in combattimento, rianimazione, aspetti degli eroi, opzioni di accessibilità e statistiche anonime; dalla 5.4: in multigiocatore ognuno deve aver sbloccato il dungeon e il Livello di Assedio scelto; in modalità normale i dungeon si sbloccano solo completando il precedente, in Sopravvivenza anche superando lì un ciclo; sei nuovi eroi da sbloccare (Necromante, Ranger, Druido, Monaco, Guardiano, Paladino); dalla 4.0: terzo dungeon, carte di gruppo, sfida del giorno, diario con statistiche ed enciclopedia, riepilogo di fine partita, percorsi disegnati sulla mappa, «Riprendi il turno» e gioco installabile.`}
const NOV_K='valdombra-novita-viste';
function novitaList(){const t=novitaTxt(),out=[];const re=/Novità della ([0-9]+\.[0-9]+):\s*/g;let m,last=null;
  while((m=re.exec(t))){if(last)last.t=t.slice(last.i,m.index).trim();last={v:m[1],i:re.lastIndex};out.push(last)}if(last)last.t=t.slice(last.i).trim();
  return out.map(x=>({v:x.v,t:x.t?x.t[0].toUpperCase()+x.t.slice(1):x.t}))}
const vNum=v=>{const [a,b]=String(v).replace(/^v/,'').split('.').map(Number);return (a|0)*1000+(b|0)};
function novitaNuove(){const L=novitaList();let vis=null;try{vis=localStorage.getItem(NOV_K)}catch(e){}
  if(!vis)return L.length?1:0;// la prima volta: solo l'ultima conta come nuova
  return L.filter(x=>vNum(x.v)>vNum(vis)).length}
function openNovita(){const L=novitaList();let vis=null;try{vis=localStorage.getItem(NOV_K)}catch(e){}
  const nuova=x=>vis?vNum(x.v)>vNum(vis):x===L[0];
  modal={title:'Novità',cancel:true,list:[],html:`<div class="novlist">${L.map(x=>`<div class="novmsg ${nuova(x)?'nuova':''}"><div class="novh">${ic('event',18)}<b>Versione ${x.v}</b>${nuova(x)?'<span class="novtag">Nuova</span>':''}</div><p>${x.t}</p></div>`).join('')}</div>`};
  try{localStorage.setItem(NOV_K,VERSION.replace(/^v/,''))}catch(e){}render()}

function mapScreen(){
  const map=R.map,W=700,G=86,H=(ROWS+1)*G+70;
  const pos=n=>[mapX(n.x,n.jx),H-50-n.y*G+n.jy-(n.type==='boss'?20:0)];
  const done=new Set(R.path.map(p=>p.join(',')));
  const doneE=new Set();for(let i=1;i<R.path.length;i++)doneE.add(R.path[i-1].join(',')+'>'+R.path[i].join(','));
  const av=new Set(availNodes().map(n=>n.y+','+n.x));

  const drawOk=n=>{if(!UI.draw)return false;if(mlast&&mlast[0]===n.y&&mlast[1]===n.x)return true;const prev=mlast?map[mlast[0]][mlast[1]]:(R.pos?map[R.pos.y][R.pos.x]:null);return prev?(prev.y+1===n.y&&prev.next.includes(n.x)):n.y===0};
  // linee che si possono toccare mentre si disegna: quelle che partono da dove sei o dal tuo percorso
  const chainK=new Set((R.pos?[[R.pos.y,R.pos.x]]:[]).concat(mine).map(q=>q.join(',')));const edgeOk=n=>UI.draw&&(chainK.has(n.y+','+n.x)||(!R.pos&&!mine.length&&n.y===0));
  let plans='';{const ids=R.order.filter(p=>R.players[p]&&planValid((R.plans||{})[p]).length);
    ids.forEach((p,i)=>{const pl=planValid(R.plans[p]);const off=(i-(ids.length-1)/2)*6;const pts=(R.pos?[[R.pos.y,R.pos.x]]:[]).concat(pl).map(([y,x])=>{const[a,b]=pos(map[y][x]);return (a+off)+','+(b+off*.4)});

  map.forEach(row=>row.forEach(n=>{if(!n)return;const[x1,y1]=pos(n);
    n.next.forEach(nx=>{const m=map[n.y+1][nx];const[x2,y2]=pos(m);const ed=edgeOk(n);lines+=`<line class="edge ${doneE.has(n.y+','+n.x+'>'+m.y+','+m.x)?'done':''} ${ed?'edraw':''}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`+(ed?`<line class="ehit" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" onclick="edgeTap(${n.y},${n.x},${m.y},${m.x})" role="button" aria-label="Linea verso ${NODEN[m.type]}, piano ${m.y+1}"/>`:'')});
    const k=n.y+','+n.x;const cur=R.pos&&R.pos.y===n.y&&R.pos.x===n.x;const r=n.type==='boss'?44:28;const tap=drawOk(n),cliccabile=UI.draw?tap:av.has(k);
    nodes+=`<g data-k="${k}" class="node ${UI.anim&&UI.anim.cur===k?'spin':''} ${UI.anim&&UI.anim.done&&UI.anim.win===k?'win':''} ${done.has(k)?'done':''} ${cur?'cur':''} ${av.has(k)&&!UI.draw?'avail':''} ${tap&&UI.draw?'drawable':''} ${myV===k?'voted':''} ${n.type==='boss'?'boss':''} ${n.spento?'spento':''}" ${(UI.draw?tap:av.has(k))?`onclick="nodeTap(${n.y},${n.x})" role="button" tabindex="0" aria-label="${NODEN[n.type]}, piano ${n.y+1}" onkeydown="if(event.key==='Enter')nodeTap(${n.y},${n.x})"`:''}>
      <circle cx="${x1}" cy="${y1}" r="${r}"/>${pxMapNode(n,x1,y1,r,bossId())||`<image href="${spr(n.type==='boss'?bossId():n.type)}" x="${x1-r*.62}" y="${y1-r*.62}" width="${r*1.24}" height="${r*1.24}" style="image-rendering:pixelated"/>`}<title>${n.type==='boss'?'Boss: '+BOSSI[bossId()][0]+'. '+BOSSI[bossId()][3]:n.spento?'Falò spento: non puoi riposare, e a 10 Ombra ti ammali':NODEN[n.type]}</title>
      ${tally[k]&&!solo?`<circle class="vbadge" cx="${x1+r*.8}" cy="${y1-r*.8}" r="12"/><text class="vbadge-t" x="${x1+r*.8}" y="${y1-r*.8}">${tally[k]}</text>`:''}${cliccabile?`<ellipse class="hit" cx="${x1}" cy="${y1}" rx="${r+4}" ry="${r+16}"/>`:''}</g>`;
  }));
  const act=active();const nv=act.filter(p=>R.votes[p]).length;

  const va=R.voteAnim;let banner=R.mode==='surv'&&R.cycle>1&&!R.pos?`<div class="votebanner" role="status">Ciclo ${R.cycle}: ${BOSSI[bossId()][2]}</div>`:'';
  if(va){const wn=R.map[+va.win.split(',')[0]][+va.win.split(',')[1]];const fin=UI.anim&&UI.anim.done;
    banner=`<div class="votebanner ${fin?'fin':''}" role="status">${va.tie?(fin?`La sorte ha scelto: <b>${NODEN[wn.type]}</b>`:`Pareggio! ${va.opts.map(k=>va.tally[k]).join(' a ')} · la sorte decide...`):
      (fin?`Si va: <b>${NODEN[wn.type]}</b> (${va.tally[va.win]} voti contro ${Object.values(va.tally).reduce((a,b)=>a+b,0)-va.tally[va.win]})`:`Vince la maggioranza...`)}</div>`}
  const tools=R.voteAnim?'':`<div class="plantools">${UI.draw?`<span class="pdot" style="background:${pcol(ME)}"></span><span class="muted" style="flex:1;min-width:180px">Tocca i nodi o le linee uno dopo l'altro per disegnare il ${solo?'percorso che pensi di fare':'tuo percorso: gli altri lo vedono col tuo colore'}. Tocca di nuovo l'ultimo per toglierlo.</span>`:`<span class="muted" style="flex:1;min-width:180px">${solo?'Prova a disegnare la strada che pensi di fare: resta sulla mappa mentre avanzi.':'Proponi la strada al gruppo disegnando un percorso di prova.'}</span>`}
    ${mine.length?`<button class="btn" onclick="send({t:'plan',p:[]})">Cancella il mio</button>`:''}<button class="btn ${UI.draw?'primary':''}" onclick="UI.draw=!UI.draw;render()">${UI.draw?(solo?'Fine, torna a giocare':'Fine, torna a votare'):'Traccia un percorso'}</button></div>`;
  const pxl=pxMapLayer(map,W,H,G,pos);
  const climi=climiList().map(([y,id])=>{const yy=H-50-y*G;return `<g class="clima-r clima-${id}"><rect x="6" y="${yy-38}" width="${W-12}" height="76" rx="14"/><text x="18" y="${yy-22}">${CLIMI[id].n}</text></g>`}).join('');
  return `<main class="flush">${banner}${tools}<div class="mapwrap ${pxl.bg?'pxfill':''}" id="mapwrap"${pxl.bg?` style="--mapbg:url(pixel/sfondi/mappa-${R.dg||'rocca'}.png)"`:''}><svg class="mapsvg ${UI.draw?'drawing':''} ${pxl.bg?'pxmap':''}" id="mapsvg" viewBox="0 0 ${W} ${H}" aria-label="Mappa della Rocca">${pxl.bg}${climi}${pxl.deco}${lines}${plans}${pxl.heroes}${nodes}</svg></div>
    <div class="legend">${Object.keys(NODEIC).map(k=>`<span>${sprImg(k,16,'inl')} ${NODEN[k]}</span>`).join('')}${map.some(r=>r.some(n=>n&&n.spento))?`<span class="spentol">${sprImg('rest',16,'inl')} Falò spento</span>`:''}<span style="color:var(--torch2)">${msg}</span></div>${mapExtraHTML()}</main>`;
}
function scrollMap(){
  const w=$('#mapwrap'),svg=$('#mapsvg');if(!w||!svg)return;
  const H=(ROWS+1)*86+70;const sc=svg.getBoundingClientRect().height/H;
  const y=R.pos?R.pos.y:0;const target=(H-50-y*86)*sc;
  w.scrollTop=Math.max(0,target-w.clientHeight*.7);
}

function pingNotify(){if(!g||!g.pings||solo)return;const L=Object.entries(g.pings).filter(([p])=>p!==ME).map(([p,v])=>p+v.k+v.j);const k=L.join('|');if(k===UI.pingSeen)return;const was=(UI.pingSeen||'').split('|');UI.pingSeen=k;if(L.some(x=>!was.includes(x))){sfx('ping');buzz([30,40,30])}}
function combatScreen(){
  pingNotify();

  const PG=(g.pings&&!solo)?g.pings:{};const pgE=j=>Object.keys(PG).filter(p=>PG[p].k==='e'&&PG[p].j===j&&R.players[p]),pgH=Object.keys(PG).filter(p=>PG[p].k==='h'&&R.players[p]&&g.heroes[p]&&!g.heroes[p].down);
  const pgTag=(p,t)=>`<span class="pingtag" style="--pc:${pcol(p)}">${p===ME?'Tu':esc(R.players[p].name)}: ${t}</span>`;
  const en=g.enemies.map((e,j)=>`<button class="ent enemy ${e.boss?'boss':''} ${e.hp<=0?'dead':''} ${(sel&&!sel.ally||UI.ping)&&e.hp>0?'target':''} ${pgE(j).length&&e.hp>0?'pinged':''}" style="${pgE(j).length?'--pc:'+pcol(pgE(j)[0]):''}" id="ent-e${j}" onclick="clickEnemy(${j})" ${e.hp<=0?'disabled':''} aria-label="${e.n}, ${e.hp} PV">
      ${e.hp>0&&pgE(j).length?`<span class="pings">${pgE(j).map(p=>pgTag(p,'attacco questo!')).join('')}</span>`:''}${intentHTML(e)}<span class="face">${pxeOk(e.id)?pxeHTML(e.id,e.boss?150:(ENEMIES[e.id].elite?96:80),'idle','e'+j,e.hp<=0):sprImg(e.id,e.boss?150:(ENEMIES[e.id].elite?96:80),'idle')}</span><span class="nm">${e.n}</span>${e.trait?`<span class="etrait" role="button" tabindex="0" onclick="event.stopPropagation();trInfo('${e.trait}')">${ETRAITS[e.trait][0]}</span>`:''}${isDark(e)?`<span class="etrait dark" role="button" tabindex="0" onclick="event.stopPropagation();darkInfo()">Creatura d'ombra</span>`:''}${ENEMIES[e.id].spine?`<span class="etrait" role="button" tabindex="0" onclick="event.stopPropagation();toast('Corpo di lava: chi lo colpisce con un Attacco subisce ${ENEMIES[e.id].spine} danni.')">Corpo di lava</span>`:''}${hpBar(e.hp,e.max)}
      ${e.blk?`<span class="blk">${ic('i_shield',12)} ${e.blk}</span>`:''}${chips(e)}</button>`).join('');
  const cl=CLASSES[run.cls];
  const allies=Object.keys(g.heroes).filter(p=>p!==ME).map(p=>{const a=g.heroes[p],P=R.players[p];return `<div class="ent ally ${a.down?'down':''} ${sel&&sel.ally&&!a.down?'target':''}" id="ent-h-${p}" onclick="clickHero('${p}')">${heroArt(P,p,34)}
    <div class="info"><span class="nm">${esc(P.name)} ${a.blk?`<span class="blk">${ic('i_shield',12)} ${a.blk}</span>`:''}</span>${pgH.includes(p)?pgTag(p,'proteggimi!'):''}${hpBar(P.hp,P.max)}${chips(a)}${omChip(p,`absorbUI('${p}')`)}<small class="muted">${!isOnline(p)?'disconnesso':a.down?'a terra':a.ended?'<span class="ok">✓ fine turno</span>':'sta giocando'}</small></div></div>`}).join('');
  if(!LO()||h.ended||h.down)UI.om=false;
  const hand=h.hand.map((c,i)=>{const om=UI.om||(sel&&sel.k==='c'&&sel.uid===c.uid&&sel.sh);const cs=om&&canShadow(c);return cardHTML(c,{click:`clickCard(${i})`,sh:cs,cls:(sel&&sel.k==='c'&&sel.uid===c.uid?'sel ':'')+(cs?'shadow ':UI.om?'noshadow ':'')+(costOf(c)>h.energy||h.ended?'cant':'')})}).join('');
  const heroes=Object.keys(g.heroes).filter(p=>!g.heroes[p].down&&isOnline(p));const ended=heroes.filter(p=>g.heroes[p].ended).length;
  let status=UI.ping?'Segnala: tocca un nemico («attacco questo!») o il tuo eroe («proteggimi!»)':UI.om&&!sel?'Lato Ombra: scegli la carta da giocare (+50%, +1 Ombra)':sel?(sel.ally?'Scegli l\'eroe da aiutare':'Scegli un nemico come bersaglio'):'Turno '+g.turn;
  if(g.busy)status='Turno dei nemici...';else if(h.down)status='Sei a terra: ti rialzi a fine combattimento';else if(h.ended&&!solo)status=`In attesa degli altri (${ended}/${heroes.length})`;
  return `<main class="flush"><div class="combat" style="--omb:${LO()?(omOf(ME)/OM_MAX*.75).toFixed(2):0}${pxCombatBg()}"><div class="cscroll" id="cscroll">${isPorta()?portaBanner():''}${g.clima&&CLIMI[g.clima]?`<div class="climabar clima-${g.clima}"><b>${CLIMI[g.clima].n}</b> · ${CLIMI[g.clima].d}</div>`:''}
    <div class="enemies">${en}</div>
    ${allies?`<div class="allies">${allies}</div>`:''}
    <div class="herorow">${SET.scena?'':portaFolla()}
      <div class="energy" title="Energia">${h.energy}</div>
      <div class="ent hero ${h.down?'down':''} ${sel&&sel.ally&&!h.down?'target':''}" id="ent-h-${ME}" onclick="clickHero('${ME}')"><span class="face">${SET.scena?portaFolla(1):''}${heroArt(run,ME,60)}</span><div class="info"><span class="nm">${solo?cl.n:esc(run.name)} ${h.blk?`<span class="blk">${ic('i_shield',12)} ${h.blk}</span>`:''}</span>${pgH.includes(ME)?pgTag(ME,'proteggimi!'):''}${hpBar(run.hp,run.max)}${omBar(ME)}${chips(h,h.pw)}</div></div>
    </div></div>
    <div class="hand">${hand||`<p class="muted" style="align-self:center">${h.ended?(solo?'Hai finito il turno.':'Hai finito il turno. Finché gli altri giocano puoi ancora ripensarci con «Riprendi il turno».'):'Nessuna carta in mano.'}</p>`}</div>
    <div class="pilebar">
      <button class="btn" onclick="viewPile('draw')">Pesca ${h.draw.length}</button>
      <button class="btn" onclick="viewPile('disc')">Scarti ${h.disc.length}</button>
      ${h.exh.length?`<button class="btn" onclick="viewPile('exh')">Esaurite ${h.exh.length}</button>`:''}
      <span class="grow muted" style="font-size:13px">${status}</span>

      ${solo?'':`<button class="btn ${UI.ping?'primary':''}" onclick="UI.ping=!UI.ping;UI.sel=null;render()" aria-pressed="${!!UI.ping}" title="Segnala un nemico da attaccare o chiedi protezione">${UI.ping?'Annulla':'Segnala'}</button>`}
      ${h.ended&&h.undo&&!g.busy&&!h.down&&!solo?`<button class="btn" onclick="send({t:'unend'})" title="Riprendi il turno finché gli altri stanno ancora giocando">Riprendi il turno</button>`:`<button class="btn primary" onclick="endTurnBtn()" ${g.busy||h.ended||h.down?'disabled':''}>Fine turno</button>`}
    </div></div></main>`;
}

function roomScreen(P){
  if(P.screen==='reward')return rewardScreen();
  if(P.screen==='shop')return shopScreen();
  if(P.screen==='rest')return restScreen();
  if(P.screen==='spento')return spentoScreen();
  if(P.screen==='event')return eventScreen();
  if(P.screen==='treasure')return treasureScreen();
  if(P.screen==='secret')return secretScreen();
  const wait=active().filter(p=>!R.players[p].done);
  return waitBoxHTML('In attesa degli altri giocatori',wait.length?'Stanno ancora scegliendo: '+wait.map(p=>esc(pname(p))).join(', '):'Si riparte...');
}

  <div class="panel"><h3>Reliquie ${d.r?'(presa)':''}</h3><div class="shopgrid">${rel.map(([kind,x,k])=>it(kind,x,k,`<button class="relicbox" ${d.r||x.sold?'disabled':''} onclick="send({t:'loot',kind:'${kind}',k:${k}})"><span class="ic">${relIc(x.id,40)}</span><b>${RELICS[x.id].n}</b><span class="muted">${RELICS[x.id].d}</span></button>`,'r')).join('')}</div></div>
  <div><button class="btn primary" onclick="proceed()">${d.c&&d.p&&d.r?'Vattene':'Vattene (lasci il resto)'}</button></div></div></main>`}
function shopScreen(){

const ZK='valdombra-zaino',CK='valdombra-corone',PK='valdombra-premiati';
const META={potion:15,relic:60,gold:20,hp:30,upg:35};
const ZCAP={potions:2,relics:2,gold:3,hp:2,upg:2};
const crownReward=L=>60+20*L;
function getCrowns(){return parseInt(load(CK)||'0',10)||0}
function setCrowns(n){store(CK,String(Math.max(0,n)))}
function getZaino(){let z=null;try{z=JSON.parse(load(ZK))}catch(e){}z=z||{};return{potions:(z.potions||[]).filter(k=>POTIONS[k]),relics:(z.relics||[]).filter(k=>RELICS[k]&&ALL_RELICS.includes(k)),gold:z.gold|0,hp:z.hp|0,upg:z.upg|0}}
function setZaino(z){store(ZK,JSON.stringify(z))}
const zEmpty=z=>!z||!(z.potions.length||z.relics.length||z.gold||z.hp||z.upg);
function zText(z){if(!z)return '';const t=[];if(z.potions&&z.potions.length)t.push(z.potions.length+(z.potions.length>1?' pozioni':' pozione'));if(z.relics&&z.relics.length)t.push(z.relics.length+(z.relics.length>1?' reliquie':' reliquia'));
  if(z.gold)t.push('+'+50*z.gold+' oro');if(z.hp)t.push('+'+10*z.hp+' PV max');if(z.upg)t.push(2*z.upg+' carte potenziate');return t.join(', ')}
function cleanZ(z){if(!z||typeof z!=='object')return null;const c=k=>Math.max(0,Math.min(ZCAP[k],z[k]|0));
  return{potions:(Array.isArray(z.potions)?z.potions:[]).filter(k=>POTIONS[k]).slice(0,ZCAP.potions),relics:(Array.isArray(z.relics)?z.relics:[]).filter(k=>ALL_RELICS.includes(k)).slice(0,ZCAP.relics),gold:c('gold'),hp:c('hp'),upg:c('upg')}}
function applyLoadout(P){
  const z=cleanZ(P.loadout);delete P.loadout;if(zEmpty(z))return;
  z.potions.forEach(k=>{if(P.potions.length<3)P.potions.push(k)});
  z.relics.forEach(k=>{if(!P.relics.includes(k)){P.relics.push(k);if(k==='cuore'){P.max+=8;P.hp+=8}}});
  P.gold+=50*z.gold;P.max+=10*z.hp;P.hp+=10*z.hp;
  const zu=upRandP(P,2*z.upg);
  P.zApplied=zText(z)+(zu.length?' (potenziate: '+zu.join(', ')+')':'');
}
function buyMeta(kind,id){
  const z=getZaino(),cr=getCrowns();
  const price=kind==='potions'?META.potion:kind==='relics'?META.relic:META[kind];
  const n=kind==='potions'||kind==='relics'?z[kind].length:z[kind];
  if(n>=ZCAP[kind]){toast('Puoi portarne al massimo '+ZCAP[kind]+' per partita.');return}
  if(kind==='relics'&&z.relics.includes(id))return;
  if(cr<price){toast('Corone insufficienti: vinci il dungeon per guadagnarne.');return}
  setCrowns(cr-price);if(kind==='potions'||kind==='relics')z[kind].push(id);else z[kind]++;setZaino(z);toast('Aggiunto allo zaino per la prossima partita.');render();
}
function refundMeta(kind,i){
  const z=getZaino();let price=0;
  if(kind==='potions'||kind==='relics'){if(!z[kind][i])return;z[kind].splice(i,1);price=kind==='potions'?META.potion:META.relic}
  else{if(!z[kind])return;z[kind]--;price=META[kind]}
  setZaino(z);setCrowns(getCrowns()+price);render();
}

function getGems(){return parseInt(load(GK)||'0',10)||0}
function setGems(n){store(GK,String(Math.max(0,n)))}
function gemInit(){if(!GEMON()||load(GIN_K))return;const n=ACH_GEM*getAch().length;store(GIN_K,'1');if(n)setGems(getGems()+n)}
const jsonArr=k=>{try{const a=JSON.parse(load(k));return Array.isArray(a)?a:[]}catch(e){return[]}};
const cimOwned=()=>jsonArr(CIM_K).filter(k=>CIMELI.includes(k));
const cimSlots=()=>((getVil().sala|0)>=1&&SET.vil!==false)?2:1;
const cimSel=()=>jsonArr(CIMS_K).filter(k=>cimOwned().includes(k)).slice(0,cimSlots());
const cleanCim=a=>Array.isArray(a)?[...new Set(a.filter(k=>CIMELI.includes(k)))].slice(0,2):[];
function buyCim(k){if(!CIMELI.includes(k))return;if(cimOwned().includes(k)){togCim(k);return}const gm=getGems();if(gm<CIM_GEM){toast('Gemme insufficienti: te ne servono '+CIM_GEM+'.');return}
  setGems(gm-CIM_GEM);store(CIM_K,JSON.stringify([...cimOwned(),k]));sfx('fanfare');toast(RELICS[k].n+' è tuo per sempre!');togCim(k,true)}
function togCim(k,on){let a=cimSel();if(a.includes(k)&&!on)a=a.filter(x=>x!==k);else if(!a.includes(k)){a.push(k);if(a.length>cimSlots())a.shift()}store(CIMS_K,JSON.stringify(a));render()}

function gemGain(P,x){let n=GEM_BOSS*(x.bk|0);if(R.win&&R.mode!=='surv')n+=GEM_WIN;if(R.daily&&R.daily.official)n+=GEM_DAILY;return n}
function gemsAward(){if(!GEMON()||!R||R.phase!=='end'||!R.players[ME])return null;const key=R.code+':'+R.seed+':'+(R.t0||0);const done=jsonArr(GPK);

const ALL_TAL=Object.values(TALENTS).flat().map(t=>t.id);
const TALBY={};Object.values(TALENTS).flat().forEach(t=>TALBY[t.id]=t);
function TE(k){if(!run||!run.talents)return 0;return run.talents.reduce((a,id)=>a+((TALBY[id]&&TALBY[id].e&&TALBY[id].e[k])||0),0)}
function getXP(){let x=null;try{x=JSON.parse(load(XK))}catch(e){}return x&&typeof x==='object'?x:{}}
function heroLv(cls){const x=getXP()[cls]|0;let l=1;while(l<MAXHLV&&x>=XP_LV[l+1])l++;return l}
function getTal(){let t=null;try{t=JSON.parse(load(TK))}catch(e){}return Array.isArray(t)?t.filter(k=>ALL_TAL.includes(k)):[]}
const hasT=id=>!!(run&&run.talents&&run.talents.includes(id));
function cleanTal(t){return Array.isArray(t)?t.filter(k=>ALL_TAL.includes(k)).slice(0,20):[]}
function applyTalents(P){
  const own=cleanTal(P.tal);delete P.tal;const mine=(TALENTS[P.cls]||[]).map(t=>t.id);P.talents=own.filter(k=>mine.includes(k));
  const T=k=>P.talents.includes(k);
  if(T('g1')||T('c1')){P.max+=8;P.hp+=8}
  if(T('l1'))P.gold+=40;
  if(T('g4'))P.deck.push({id:'lamainsaz',up:true});if(T('m4'))P.deck.push({id:'fiammavor',up:true});if(T('l4'))P.deck.push({id:'lamaaffam',up:true});if(T('c4'))P.deck.push({id:'innocresc',up:true});
  if(T('c5')&&!P.relics.includes('piuma'))P.relics.push('piuma');
  P.talents.forEach(id=>{const t=TALBY[id];if(!t||!t.e)return;const e=t.e;if(e.hp){P.max+=e.hp;P.hp+=e.hp}if(e.gold)P.gold+=e.gold;if(e.card)P.deck.push({id:e.card,up:true})});
}
function buyTalent(cls,id){
  const t=(TALENTS[cls]||[]).find(x=>x.id===id);if(!t)return;const own=getTal();if(own.includes(id))return;
  if(heroLv(cls)<t.lv){toast('Serve il livello '+t.lv+' del '+CLASSES[cls].n+'.');return}
  const cr=getCrowns();if(cr<t.cost){toast('Corone insufficienti: te ne servono '+t.cost+'.');return}
  setCrowns(cr-t.cost);own.push(id);store(TK,JSON.stringify(own));sfx('win');toast(t.n+' sbloccato! Vale da ora in tutte le partite con il '+CLASSES[cls].n+'.');render();
}
function xpGain(){
  const P=R&&R.players[ME];if(!P)return 0;const fl=R.mode==='surv'?totalFloors():R.floor;
  return Math.max(10,Math.round(fl*10+(P.kills||0)*2+(R.win?100:0)+25*(R.lvl||0)));
}
function xpAward(){
  if(!R||R.phase!=='end'||!R.players[ME])return null;const P=R.players[ME];const key=R.code+':'+R.seed+':'+(R.t0||0);
  let done=[];try{done=JSON.parse(load(XPK))||[]}catch(e){}
  if(done.includes(key))return UI.lastXP&&UI.lastXP.key===key?UI.lastXP:null;
  const cls=P.cls,before=heroLv(cls),n=xpGain();const x=getXP();x[cls]=(x[cls]|0)+n;store(XK,JSON.stringify(x));
  done.push(key);store(XPK,JSON.stringify(done.slice(-50)));UI.lastXP={key,cls,n,before,after:heroLv(cls)};return UI.lastXP;
}

function startVoteAnim(va){
  UI.anim={id:va.id,cur:null,done:false,win:va.win};
  setTimeout(scrollMap,30);
  const opts=va.opts,wi=opts.indexOf(va.win);const seq=[];
  if(va.tie){let n=opts.length*5+wi;for(let i=0;i<=n;i++)seq.push(opts[i%opts.length])}else seq.push(va.win,null,va.win,null,va.win);
  let t=0;const total=va.ms-500;const base=va.tie?total/seq.length/2.2:total/seq.length;
  seq.forEach((k,i)=>{const d=va.tie?base*Math.pow(1.12,i)*(2.2*seq.length/((Math.pow(1.12,seq.length)-1)/.12)):base;t+=d;
    setTimeout(()=>{if(!UI.anim||UI.anim.id!==va.id)return;UI.anim.cur=k;paintAnim()},Math.min(t,total))});

function statSend(P,x,fl){if(!SET.stats||isPorta())return;const c=sbClient();if(!c)return;
  const row={versione:VERSION,dungeon:R.dg||'rocca',modalita:R.daily?'daily':R.mode==='surv'?'surv':'norm',livello:R.lvl|0,giocatori:Math.min(8,R.order.length),classe:P.cls,vittoria:!!R.win&&R.mode!=='surv',piano:fl|0,
    boss:(R.mode!=='surv'&&R.floor>=ROWS+1)||R.win?bossId():null,morte:R.win?null:(R.deathAt||null),carte:P.deck.slice(0,80).map(d=>d.id+(d.up?'+':'')),reliquie:(P.relics||[]).slice(0,40),danni:Math.min(1e7,x.dmg|0),uccisioni:P.kills|0,durata:Math.min(172800,Math.round(tempoMs()/1000))};
  // se il database non ha ancora la colonna «durata» (database/durata.sql), si riprova senza: la partita viene salvata lo stesso
  try{c.from('statistiche').insert(row).then(r=>{if(r&&r.error){delete row.durata;c.from('statistiche').insert(row).then(()=>{},()=>{})}},()=>{})}catch(e){}}
function statsAward(){
  if(!R||R.phase!=='end'||!R.players[ME])return;const key=R.code+':'+R.seed+':'+(R.t0||0);let done=[];try{done=JSON.parse(load(STATP_K))||[]}catch(e){}
  if(done.includes(key))return;done.push(key);store(STATP_K,JSON.stringify(done.slice(-50)));
  const P=R.players[ME],st=getStats(),x=P.stx||{},fl=R.mode==='surv'?totalFloors():R.floor,win=!!R.win&&R.mode==='norm';
  const inc=(o,k,n=1)=>{o[k]=(o[k]||0)+n};
  inc(st,'runs');if(win)inc(st,'wins');if(!solo)inc(st,'coop');if(R.mode==='surv')inc(st,'surv');if(R.daily)inc(st,'daily');
  inc(st,'kills',P.kills||0);inc(st,'dmg',x.dmg||0);inc(st,'heal',x.heal||0);inc(st,'blk',x.blk||0);inc(st,'floors',fl);
  st.top=Math.max(st.top||0,x.top||0);st.best=Math.max(st.best||0,fl);if(R.mode==='surv')st.survBest=Math.max(st.survBest||0,fl);
  st.cls=st.cls||{};const c=st.cls[P.cls]=st.cls[P.cls]||{};inc(c,'runs');if(win)inc(c,'wins');c.best=Math.max(c.best||0,fl);
  st.dg=st.dg||{};const d=st.dg[R.dg||'rocca']=st.dg[R.dg||'rocca']||{};inc(d,'runs');if(win)inc(d,'wins');if(win)d.maxLvl=Math.max(d.maxLvl||0,R.lvl||0);
  st.cards=st.cards||{};Object.entries(x.cards||{}).forEach(([k,n])=>inc(st.cards,k,n));
  if(win&&!solo)inc(st,'coopWins');if(win&&R.order.length>=4)inc(st,'big4');if(win&&P.deck.length<=12)inc(st,'slim');
  inc(st,'elites',x.elites||0);inc(st,'rev',x.rev||0);inc(st,'falls',x.falls||0);inc(st,'shadow',x.shadow||0);if(x.flawless)inc(st,'flawless');st.maxTurn=Math.max(st.maxTurn||0,x.maxTurn||0);st.maxGold=Math.max(st.maxGold||0,P.gold||0);
  st.bosses=st.bosses||[];(x.bosses||[]).forEach(b=>{if(!st.bosses.includes(b))st.bosses.push(b)});
  store(STAT_K,JSON.stringify(st));
  const nw=achCheck();if(nw.length){UI.newAch=nw;UI.newAchFor=key;setTimeout(render,0)}
  statSend(P,x,fl);
}

    <div class="adtiles"><div class="adtile"><small>Classifica Sopravvivenza</small><b>${n(C.tot)}</b><span>punteggi registrati</span></div><div class="adtile"><small>Record da solo</small><b>${C.solo==null?'–':n(C.solo)}</b><span>punti</span></div><div class="adtile"><small>Record in gruppo</small><b>${C.coop==null?'–':n(C.coop)}</b><span>punti</span></div></div>
    <h5>Versioni del gioco in uso (7 giorni)</h5>${tab((d.versioni||[]).map(([v,k,p])=>[esc(v)+(p&&p!=='web'?` <span class="muted">(${adminPiatt(p)})</span>`:v===VERSION?' <span class="muted">(l\'ultima)</span>':''),n(k)]),['Versione','Visite'])}
    ${d.api?(A=>`<h4>Client nativi (API)</h4>
    <div class="adtiles"><div class="adtile"><small>Chiamate</small><b>${n(A.g7)}</b><span>in 7 giorni, ${n(A.errori7)} con errore</span></div><div class="adtile"><small>Dispositivi</small><b>${n(A.dispositivi7)}</b><span>in 7 giorni</span></div>
      <div class="adtile"><small>Giocatori collegati</small><b>${n(A.giocatori7)}</b><span>con il loro profilo</span></div><div class="adtile"><small>Ultima chiamata</small><b class="adora">${A.ultima?esc(A.ultima):'–'}</b><span>ora italiana</span></div></div>
    <h5>Chiamate per app e azione (7 giorni)</h5>${tab((A.azioni||[]).map(([p,a,k,e,g])=>[adminPiatt(p)+`<br><small class="muted">${esc(ADMAZ[a]||a)}</small>`,n(k),n(e),n(g)]),['App e azione','Chiamate','Errori','Giocatori'])}
    ${(A.errori||[]).length?`<h5>Errori più frequenti (7 giorni)</h5>${tab(A.errori.map(([e,k])=>[esc(ADMERR[e]||e),n(k)]),['Errore','Volte'])}`:''}`)(d.api):''}
    <p class="muted" style="font-size:13px">Le visite si contano senza dati personali: solo un codice casuale per dispositivo, al massimo una visita ogni 30 minuti. Non vengono contati i dispositivi con «Invia statistiche anonime» spento e i tuoi, da quando ci hai aperto il profilo di amministratrice. Se nelle versioni compare una versione vecchia, qualcuno ha ancora il gioco in memoria e lo aggiornerà alla prossima apertura. I client nativi (app per Android, iPhone, PC...) inviano visite e partite all'endpoint «api»: ogni chiamata dice da quale app, versione e dispositivo arriva e, se il giocatore ha fatto l'accesso, con quale profilo.</p>
  </div>`}
async function accPull(){
  if(!ACC||ACCS.busy)return;ACCS.busy=true;ACCS.state='sync';
  try{const rows=await accRpc('profilo_leggi',{p_nome:ACC.nome,p_token:ACC.token});const row=rows&&rows[0];if(!row)throw new Error('credenziali');
    if(row.rev!==ACC.rev){accApply(ACC.dirty?accMerge(row.dati,accCollect()):row.dati);ACC.rev=row.rev;accKeep();gemInit();if(!R)render()}
    ACCS.state='ok';ACCS.msg='';ACCS.last=Date.now();if(!ADM.chk)adminCheck();
  }catch(e){ACCS.state='err';ACCS.msg=accErr(e);if(/credenziali/.test(String(e&&e.message))){ACC=null;accKeep();ADM.ok=false;toast('Il profilo non è più valido: accedi di nuovo.')}}
  ACCS.busy=false;if(ACC&&ACC.dirty&&ACCS.state==='ok')accPush();else if(modal&&modal.profilo)render();
}
async function accPush(tries=0){
  if(!ACC)return;if(ACCS.busy){clearTimeout(ACCS.timer);ACCS.timer=setTimeout(accPush,1500);return}
  ACCS.busy=true;ACCS.state='sync';const gen=ACCS.gen;
  try{const r=await accRpc('profilo_salva',{p_nome:ACC.nome,p_token:ACC.token,p_dati:accCollect(),p_rev:ACC.rev});
    if(r>0){ACC.rev=r;if(gen===ACCS.gen)ACC.dirty=false;accKeep();ACCS.state='ok';ACCS.msg='';ACCS.last=Date.now()}
    else{ACCS.busy=false;if(tries<3){await accPull();return}ACCS.state='err';ACCS.msg='Salvataggio in conflitto, riprovo più tardi.'}
  }catch(e){ACCS.state='err';ACCS.msg=accErr(e)}
  ACCS.busy=false;if(ACC&&ACC.dirty&&gen!==ACCS.gen){clearTimeout(ACCS.timer);ACCS.timer=setTimeout(accPush,1500)}
  if(modal&&modal.profilo)render();
}
async function accLogin(create){
  const n=(UI.accN||'').trim(),p=UI.accP||'';if(!n||!p){UI.accMsg='Scrivi nome e password.';render();return}
  UI.accMsg='Attendi...';UI.accBusy=true;render();
  try{
    if(create){const rows=await accRpc('profilo_crea',{p_nome:n,p_pass:p,p_dati:accCollect()});const r=rows[0];
      ACC={nome:n.toLowerCase(),token:r.token,rev:r.rev,dirty:false};accKeep();toast('Profilo creato! I tuoi progressi ora sono salvati online.')}
    else{const rows=await accRpc('profilo_accedi',{p_nome:n,p_pass:p});const r=rows&&rows[0];if(!r)throw new Error('credenziali');
      const loc=accCollect();const merged=accMerge(r.dati,loc);ACC={nome:n.toLowerCase(),token:r.token,rev:r.rev,dirty:false};accKeep();accApply(merged);
      if(JSON.stringify(merged)!==JSON.stringify(r.dati||{})){ACC.dirty=true;ACCS.gen++;accKeep();accPush()}
      toast('Bentornato, '+n+'! Progressi caricati.')}
    if(!myName){myName=n.slice(0,16);store('valdombra-nome',myName)}
    UI.accP='';UI.accMsg='';ACCS.state='ok';ACCS.last=Date.now();adminCheck();
  }catch(e){UI.accMsg=accErr(e)}
  UI.accBusy=false;render();
}
function accLogout(){if(ACC&&ACC.dirty)accPush();ACC=null;accKeep();ACCS.state='';toast('Sei uscito dal profilo. I progressi restano anche su questo dispositivo.');render()}
function openProfilo(){modal={title:'Profilo',profilo:true,cancel:true,list:[]};if(ACC)accPull();render()}
function profiloHTML(){
  if(ACC){const st=ACCS.state==='sync'?'Sincronizzazione in corso...':ACCS.state==='err'?ACCS.msg:ACC.dirty?'Modifiche da salvare...':'Tutto salvato online.';
    return `<div class="set"><div class="panel"><h4>Collegato come ${esc(ACC.nome)}</h4>
      <p>Corone, zaino, esperienza, abilità uniche, dungeon e Livelli di Assedio sbloccati e la partita da solo in corso sono gli stessi su ogni telefono o PC dove accedi con questo nome.</p>
      <p class="${ACCS.state==='err'?'':'muted'}" style="${ACCS.state==='err'?'color:#ff9a8f':''}">${st}</p>
      <div class="row"><button class="btn primary" onclick="accPull()">Sincronizza ora</button><button class="btn" onclick="accLogout()">Esci dal profilo</button></div></div>
      <p class="muted" style="font-size:13px">Per giocare su un altro dispositivo apri il sito, tocca Profilo e accedi con lo stesso nome e la stessa password.</p></div>`}
  return `<div class="set"><div class="panel"><h4>Stessi progressi su telefono e PC</h4>
    <p class="muted">Crea un profilo con un nome e una password: i progressi vengono salvati online e li ritrovi su ogni dispositivo in cui accedi. Non serve nessuna email.</p>
    <form class="accform" onsubmit="event.preventDefault();accLogin(false)" autocomplete="on">
      <label>Nome del profilo<input class="txt" name="username" autocomplete="username" maxlength="20" value="${esc(UI.accN||'')}" oninput="UI.accN=this.value" placeholder="Per esempio: manu"></label>
      <label>Password<input class="txt" type="password" name="password" autocomplete="current-password" maxlength="72" value="${esc(UI.accP||'')}" oninput="UI.accP=this.value"></label>
      ${UI.accMsg?`<p style="color:${UI.accMsg==='Attendi...'?'var(--muted)':'#ff9a8f'}">${esc(UI.accMsg)}</p>`:''}
      <div class="row"><button class="btn primary" type="submit" ${UI.accBusy?'disabled':''}>Accedi</button><button class="btn" type="button" ${UI.accBusy?'disabled':''} onclick="accLogin(true)">Crea profilo nuovo</button></div>
    </form>
    <p class="muted" style="font-size:13px">Creando il profilo, i progressi che hai già su questo dispositivo vengono salvati nel profilo. Accedendo da un dispositivo che ha già dei progressi, vengono uniti a quelli del profilo.</p></div></div>`;
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&ACC&&Date.now()-ACCS.last>20000)accPull();else if(document.visibilityState==='hidden'&&ACC&&ACC.dirty)accPush()});
setInterval(()=>{if(ACC&&document.visibilityState==='visible'&&(!R||R.phase==='lobby')&&Date.now()-ACCS.last>90000)accPull()},30000);
// appena si apre il gioco: prendi subito i progressi dal profilo (per esempio la partita iniziata su un altro dispositivo)
setTimeout(()=>{if(ACC&&!R)accPull()},400);
setTimeout(()=>{if(!visitaConta())setTimeout(()=>visitaConta(),6000)},1500);// conta la visita (se la libreria di Supabase non è ancora pronta riprova una volta)
try{gemInit()}catch(e){}


/* ================= APP INSTALLABILE ================= */
let instEv=null;
const isStandalone=()=>{try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}};
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();instEv=e;if(!R)render()});
window.addEventListener('appinstalled',()=>{instEv=null;toast('Gioco installato! Lo trovi tra le tue app.');if(!R)render()});
if('serviceWorker' in navigator&&window.isSecureContext&&/^https?:$/.test(location.protocol)&&!/claude\.ai|claudeusercontent|claude\.site/.test(location.hostname)){setTimeout(()=>navigator.serviceWorker.register('sw.js').catch(()=>{}),1500)}
function installApp(){
  if(instEv){instEv.prompt();instEv.userChoice.then(()=>{instEv=null;render()}).catch(()=>{});return}
  modal={title:'Installa il gioco',cancel:true,list:[],html:`<div class="set"><div class="panel">
    <p>Installato, il gioco si apre a schermo intero dalla sua icona, come un'app. Da soli si può giocare anche senza internet; per giocare con gli amici serve la connessione.</p>
    ${isIOS?`<h4>iPhone e iPad</h4><ol><li>Apri il sito con <b>Safari</b>.</li><li>Tocca il tasto <b>Condividi</b> (il quadrato con la freccia verso l'alto).</li><li>Scegli <b>Aggiungi alla schermata Home</b> e poi <b>Aggiungi</b>.</li></ol>`:
    `<h4>Android</h4><ol><li>Apri il sito con <b>Chrome</b>.</li><li>Tocca il menu con i tre puntini in alto a destra.</li><li>Scegli <b>Installa app</b> oppure <b>Aggiungi a schermata Home</b>.</li></ol>
     <h4>PC</h4><p>Con Chrome o Edge, clicca l'icona di installazione a destra nella barra degli indirizzi, oppure Menu → <b>Installa Assedio a Valdombra</b>.</p>`}
  </div></div>`};render();
}
function installPanel(){if(isStandalone())return '';
  return `<div class="panel" style="flex-direction:row;align-items:center;flex-wrap:wrap"><span style="line-height:0">${sprImg('drago',34)}</span><div style="flex:1;min-width:200px"><b style="font-size:17px">Installa il gioco</b><br><span class="muted">Mettilo sulla schermata Home del telefono o tra le app del PC: si apre a schermo intero e da solo funziona anche offline.</span></div><button class="btn" onclick="installApp()">${instEv?'Installa':'Come si fa'}</button></div>`}

/* ================= AVVIO ================= */
(function boot(){
  if(ACC)setTimeout(accPull,300);
  const h=(location.hash||'').replace('#','').toUpperCase();
  if(/^[A-Z0-9]{4}$/.test(h)&&h!==load('valdombra-room')){UI.joinCode=h;screen='mp'}
  render();
})();

</script>
