<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Assedio a Valdombra: deckbuilder roguelike fantasy da giocare nel browser.">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#16131d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Valdombra">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Assedio a Valdombra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@500;700&family=Alegreya:wght@600;700&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen app — HUD bar on top, a screen (map / combat / shop...) filling the rest. Torchlit stone, parchment cards. */
:root{
  --stone:#16141d; --stone2:#211e2b; --stone3:#2d2939; --line:#403a52;
  --fg:#ece4d4; --muted:#a69db6; --torch:#e9a440; --torch2:#ffcf7a;
  --blood:#cf4a3e; --block:#5d9fd8; --poison:#72b85c; --heal:#6fcf8e; --arcane:#a98be8;
  --parch:#efe3c6; --parch2:#e2d2ac; --ink:#2a2118; --ink2:#6b5a44;
  --f-disp:"Grenze Gotisch","Palatino Linotype",Georgia,serif;
  --f-card:"Alegreya",Georgia,serif;
  --f-body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--stone);color:var(--fg);font-family:var(--f-body);font-size:15px;overflow:hidden;
  background-image:radial-gradient(ellipse at 50% -10%,rgba(233,164,64,.10),transparent 60%)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--torch2);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}
#ver{position:fixed;top:calc(env(safe-area-inset-top,0px) + 2px);right:calc(env(safe-area-inset-right,0px) + 8px);z-index:80;font-size:10.5px;line-height:1;letter-spacing:.04em;color:var(--muted);background:var(--stone);border:1px solid var(--line);border-radius:5px;padding:2px 6px 2px 4px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:4px}
#ver:hover{color:var(--fg);border-color:var(--torch)}#ver .spr{width:12px;height:12px}
.set{display:flex;flex-direction:column;gap:14px;max-width:560px;margin:0 auto;width:100%}
.set .panel{gap:12px}.set h4{margin:0;font-family:var(--f-disp);font-size:18px;color:var(--torch2);display:flex;align-items:center;gap:8px}
.srow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.srow .lab{flex:1;min-width:150px}.srow .lab small{display:block;color:var(--muted);font-size:13px}
@media (max-width:560px){.srow.sl .lab{flex-basis:100%}}
.srow input[type=range]{flex:1;min-width:140px;max-width:260px;accent-color:var(--torch)}.srow .val{width:42px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.sw{width:52px;height:28px;border-radius:14px;border:1px solid var(--line);background:var(--stone3);position:relative;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:left .15s}
.sw[aria-pressed=true]{background:var(--torch);border-color:var(--torch)}.sw[aria-pressed=true]::after{left:27px;background:#fff}
body.noanim *{animation:none!important;transition:none!important}body.noanim .float{display:none}

.hud{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--stone2);border-bottom:1px solid var(--line);font-size:14px;padding-top:20px!important}
.hud .cls{font-family:var(--f-disp);font-size:20px;color:var(--torch2)}
.hud .stat{font-variant-numeric:tabular-nums;white-space:nowrap}
.hud .stat b{color:var(--muted);font-weight:500;margin-right:3px;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.hp-t{color:#ff9a8f}.gold-t{color:var(--torch2)}
.pots{display:flex;gap:4px}
.pot{width:24px;height:24px;border-radius:50% 50% 45% 45%;border:2px solid var(--line);background:var(--stone3);padding:0;position:relative}
.pot.full{border-color:var(--torch);display:grid;place-items:center;background:var(--stone)}
.pot .spr{display:block}
.pot.sel{outline:2px solid var(--torch2)}
.relics{display:flex;gap:2px;flex-wrap:wrap}
.relic{background:none;border:0;font-size:19px;padding:0 1px;line-height:1}
.hud .grow{flex:1}
.btn{background:var(--stone3);border:1px solid var(--line);border-radius:8px;padding:7px 12px}
.btn:hover{border-color:var(--torch)}
.btn.primary{background:linear-gradient(#f0b456,#c9832a);color:#2a1a08;border-color:#ffd68f;font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
main{flex:1;min-height:0;overflow:auto;padding-block:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main.flush{padding:0;overflow:hidden;display:flex;flex-direction:column}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-disp);font-weight:700;text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:clamp(44px,9vw,76px);line-height:.95;color:var(--torch2);text-shadow:0 2px 0 #6b3d0c,0 0 30px rgba(233,164,64,.35)}
h2{font-size:32px;color:var(--torch2)}
h3{font-size:22px}
p{margin:0;line-height:1.5}
.muted{color:var(--muted)}
.lede{max-width:60ch;font-size:17px}

/* Title */
.classes{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.classcard{background:var(--stone2);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px}
.classcard.on{border-color:var(--torch);box-shadow:0 0 0 1px var(--torch),0 0 24px rgba(233,164,64,.18)}
.classcard .ic{line-height:1}
.classcard .nm{font-family:var(--f-disp);font-size:26px;color:var(--fg)}
.classcard small{color:var(--muted);font-size:13px}
.seedrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seedrow input{background:var(--stone);border:1px solid var(--line);border-radius:8px;color:var(--fg);padding:8px 10px;font:inherit;font-variant-numeric:tabular-nums;letter-spacing:.12em;text-transform:uppercase;width:11ch}
.lvls{display:flex;flex-wrap:wrap;gap:6px}
.lvl{width:40px;height:40px;border-radius:8px;background:var(--stone3);border:1px solid var(--line);font-family:var(--f-disp);font-size:20px;font-variant-numeric:tabular-nums}
.lvl.on{background:linear-gradient(#f0b456,#c9832a);color:#2a1a08;border-color:#ffd68f}
.lvl[disabled]{opacity:.45;cursor:not-allowed;font-size:14px}
.party{display:flex;gap:8px;overflow-x:auto;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.pm{display:flex;align-items:center;gap:8px;background:var(--stone2);border:1px solid var(--line);border-radius:10px;padding:4px 10px;flex:none;width:170px}
.pm b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pm .bar{height:15px;margin:2px 0}.pm .bar span{font-size:11px}.pm small{display:block;font-size:11px;color:var(--muted)}
.pm.off{opacity:.45}.ok{color:var(--heal)}
.allies{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:0 16px}
.ally{flex-direction:row;gap:6px;padding:4px 8px;width:170px;text-align:left}
.ally .info{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}.ally .bar{height:16px;min-width:130px}.ally .bar span{font-size:11.5px}.ally small{font-size:11px}
.ally.down,.hero.down{opacity:.45;filter:grayscale(.8)}
.tgt{color:var(--muted);font-weight:500;font-size:12px}
.mapsvg .vbadge{fill:var(--torch2);stroke:#2a1a08;stroke-width:2}.mapsvg .vbadge-t{font-size:15px;font-weight:700;fill:#2a1a08;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.mapsvg .node.voted circle:first-child{fill:#5a4320;stroke:var(--torch2);stroke-width:6}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:10px;background:var(--stone2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.prow .nm{font-weight:700}.badge{font-size:12px;border-radius:6px;padding:1px 8px;background:var(--stone);border:1px solid var(--line);white-space:nowrap}
.badge.on{color:var(--heal);border-color:var(--heal)}
.code{font-family:var(--f-disp);font-size:52px;line-height:1;letter-spacing:.14em;color:var(--torch2)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.codein{width:8em;text-transform:uppercase;letter-spacing:.2em;font-size:18px;text-align:center}
.codein::placeholder{letter-spacing:.2em;color:var(--muted);opacity:.6}
input.txt{background:var(--stone);border:1px solid var(--line);border-radius:8px;color:var(--fg);padding:9px 10px;font:inherit;max-width:100%}
.netwarn{background:#4a2420;color:#ffd0c8;padding:6px 16px;font-size:13px;text-align:center}
#chat{position:fixed;top:0;right:0;bottom:0;width:min(360px,100%);background:var(--stone2);border-left:1px solid var(--line);z-index:55;display:flex;flex-direction:column;
  padding-block:max(10px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-bottom,0px));padding-right:env(safe-area-inset-right,0px);box-shadow:-10px 0 30px rgba(0,0,0,.4)}
#chat .chead{padding-top:20px!important;display:flex;align-items:center;gap:8px;padding:0 12px 8px;border-bottom:1px solid var(--line)}
#chatlog{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.msg{background:var(--stone3);border-radius:10px;padding:6px 10px;max-width:90%;align-self:flex-start;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:#4a3a22}.msg b{display:block;font-size:12px;color:var(--torch2)}
#chatform{display:flex;gap:6px;padding:8px 12px 0;border-top:1px solid var(--line)}
#chatform input{flex:1;min-width:0}
.quick{display:flex;gap:4px;flex-wrap:wrap;padding:6px 12px 0}.quick button{font-size:12px;padding:3px 8px}
.chatfab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:50;box-shadow:0 6px 18px rgba(0,0,0,.45);padding:12px 18px;font-size:16px}.chatfab .dot{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--blood);color:#fff;font-size:11px;margin-left:6px}
.chatbtn .dot{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--blood);color:#fff;font-size:11px;margin-left:4px}
.note{background:var(--stone2);border:1px dashed var(--line);border-radius:10px;padding:12px 14px;font-size:14px;color:var(--muted)}

/* Map */
.mapwrap{flex:1;overflow:auto;position:relative}
.mapsvg{display:block;width:100%;max-width:560px;margin:0 auto}
.mapsvg .plan polyline{fill:none;stroke:var(--pc);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;opacity:.85;pointer-events:none}.mapsvg .plan circle{fill:var(--pc);stroke:#1b1424;stroke-width:2;pointer-events:none}
.mapsvg .node.drawable{cursor:pointer}.mapsvg .node.drawable circle:first-child{stroke:#fff;stroke-dasharray:6 4}
.plantools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px max(16px,env(safe-area-inset-left,0px));background:var(--stone2);border-bottom:1px solid var(--line);font-size:13.5px}
.pdot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:baseline;border:1px solid rgba(0,0,0,.5);flex:none}
.mapsvg .edge{stroke:#4d4661;stroke-width:3;stroke-dasharray:2 8;stroke-linecap:round}
.mapsvg .edge.done{stroke:var(--torch);stroke-dasharray:none;opacity:.8}
.mapsvg .node.spento circle{fill:#1b1820;stroke:#5a5566}.mapsvg .node.spento image{filter:grayscale(1) brightness(.72) contrast(1.1)}.legend .spentol{color:#b9b3c8}.spentoic img,.spentol img{filter:grayscale(1) brightness(.72) contrast(1.1)}
.mapsvg .edge.edraw{stroke:var(--torch2);stroke-width:4;stroke-dasharray:7 6;opacity:.95}.mapsvg .ehit{stroke:transparent;stroke-width:24;stroke-linecap:round;cursor:pointer;pointer-events:stroke}.mapsvg .ehit:hover{stroke:rgba(255,207,122,.18)}
.mapsvg .node circle{fill:var(--stone2);stroke:#5a5370;stroke-width:3}
.mapsvg .node text{font-size:24px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.mapsvg .node.done circle{fill:#3a2f22;stroke:var(--torch)}
.mapsvg .node.done text{opacity:.55}
.mapsvg .node.cur circle{stroke:var(--torch2);stroke-width:5}
.mapsvg .node.avail{cursor:pointer}
.mapsvg .node.avail circle{stroke:var(--torch2);animation:pulse 1.4s ease-in-out infinite}
.mapsvg .node.avail:hover circle{fill:#4a3a22}
.mapsvg .node.boss circle{stroke:var(--blood);stroke-width:4}
.mapsvg .node.boss text{font-size:44px}
@keyframes pulse{50%{stroke-width:7;stroke-opacity:.6}}
.votebanner{position:relative;z-index:2;text-align:center;padding:10px 16px;background:linear-gradient(#3a2a12,#2a1f10);border-bottom:1px solid var(--torch);color:var(--torch2);font-size:16px;font-family:var(--f-card);font-weight:700}
.votebanner.fin{background:linear-gradient(#1f3a24,#18291b);border-color:var(--heal);color:#bff0c9}
@keyframes bannerin{from{transform:translateY(-100%);opacity:0}}
.mapsvg .node.spin circle:first-of-type{fill:#7a5a1c;stroke:#fff;stroke-width:8}
.mapsvg .node.win circle:first-of-type{fill:#2e5a36;stroke:var(--heal);stroke-width:8;animation:winp .5s ease-in-out 4}
@keyframes winp{50%{stroke-width:14}}
.pvhint{max-width:900px;margin:0 auto 6px;text-align:center}
.pk{display:flex;flex-direction:column;align-items:center;gap:8px}.pk.on .card{outline:3px solid var(--torch2);outline-offset:3px}
.tlite{gap:14px}.tlite h1{font-size:clamp(34px,9vw,56px);margin:0}.mbig{display:flex;flex-direction:column;gap:10px;max-width:420px}.mbig .btn{font-size:19px;padding:14px 18px}
body.mlite.hasmodal #ver{display:none}body.mlite #ver{font-size:14px;padding:7px 12px 7px 9px;border-radius:9px;gap:7px}body.mlite #ver .spr{width:18px;height:18px}body.mlite .crownbadge{top:calc(env(safe-area-inset-top,0px) + 46px)}
#novbtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 2px);right:calc(env(safe-area-inset-right,0px) + 150px);z-index:80;display:flex;align-items:center;gap:6px;font:inherit;font-size:14px;font-weight:700;color:var(--fg);background:var(--stone);border:1px solid var(--torch);border-radius:9px;padding:7px 12px;cursor:pointer}
#novbtn .novdot{min-width:20px;height:20px;border-radius:999px;background:#e5372c;color:#fff;font-size:12px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;box-shadow:0 0 0 2px var(--stone)}
.novlist{display:flex;flex-direction:column;gap:12px;max-width:680px;margin:0 auto}.novmsg{background:var(--stone2);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:10px 14px}.novmsg.nuova{border-color:var(--torch);box-shadow:0 0 0 1px rgba(255,207,122,.25)}
.novmsg .novh{display:flex;align-items:center;gap:8px;margin-bottom:4px}.novmsg p{margin:0;line-height:1.45}.novtag{background:#e5372c;color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:1px 8px}
.mtiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}@media (max-width:640px){.mtiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mtile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;background:var(--stone2);border:1px solid var(--line);border-radius:14px;color:var(--fg);font:inherit;cursor:pointer}.mtile:hover{border-color:var(--torch)}.mtile b{font-size:14px}.mtile .mic{line-height:0}
.duo{display:flex;gap:5px;align-items:flex-start;padding:4px;border-radius:12px;background:rgba(80,40,120,.14);border:1px dashed rgba(176,108,255,.4)}.pkbar{justify-content:center;margin-top:14px;position:sticky;bottom:0;z-index:2;padding:12px 0 4px;background:linear-gradient(rgba(8,6,12,0),rgba(8,6,12,.96) 30%)}
.pv{display:flex;flex-direction:column;align-items:center;gap:8px}
.pvstack{display:grid}.pvstack>div{grid-area:1/1}
.pv-up{visibility:hidden}
.pv.on .pv-up{visibility:visible}.pv.on .pv-base{visibility:hidden}
@media (hover:hover) and (pointer:fine){.pv:hover .pv-up{visibility:visible}.pv:hover .pv-base{visibility:hidden}}
.card.upgraded{box-shadow:0 0 0 3px var(--heal),0 0 16px rgba(111,207,142,.5)}
.why{color:#ffb38a;font-size:13px}
.opt[disabled] .why{opacity:1}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.opt.on{border-color:var(--torch);box-shadow:0 0 0 1px var(--torch)}
.board{display:flex;flex-direction:column;gap:6px}
.brow{display:flex;align-items:center;gap:10px;background:var(--stone3);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.brow.mine{border-color:var(--torch);background:#3a2f1f}
.brow .pos{font-family:var(--f-disp);font-size:22px;color:var(--torch2);width:28px;text-align:center;font-variant-numeric:tabular-nums}
.brow .who{flex:1;min-width:0;display:flex;flex-direction:column}.brow .who b{overflow-wrap:anywhere}.brow .cls{line-height:0}
.brow .pts{font-family:var(--f-disp);font-size:22px;font-variant-numeric:tabular-nums}
.dgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.dg{display:flex;gap:12px;align-items:center;text-align:left;background:var(--stone2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.dg.on{border-color:var(--torch);box-shadow:0 0 0 1px var(--torch),0 0 22px rgba(233,164,64,.15)}
.dg.dg-cripte{background:linear-gradient(135deg,#1d2433,#211e2b)}.dg.dg-cripte.on{border-color:#8fd3ff;box-shadow:0 0 0 1px #8fd3ff,0 0 22px rgba(143,211,255,.18)}
.dg[disabled]{opacity:.55;cursor:not-allowed}.dg .dgart{line-height:0;flex:none}.dg .dgtx{display:flex;flex-direction:column;gap:3px;min-width:0}
.spr.locked{filter:brightness(.25) grayscale(1)}
.dg.dg-abisso{background:linear-gradient(135deg,#33201a,#26181b)}.dg.dg-abisso.on{border-color:#ff7a3a;box-shadow:0 0 0 1px #ff7a3a,0 0 22px rgba(255,122,58,.2)}
body[data-dg="abisso"]{background-image:radial-gradient(ellipse at 50% 110%,rgba(255,110,40,.16),transparent 60%)}
body[data-dg="abisso"] .mapsvg .edge.done{stroke:#ff7a3a}body[data-dg="abisso"] .votebanner:not(.fin){background:linear-gradient(#46241a,#2d1712);border-color:#ff7a3a;color:#ffd9c2}
body[data-dg="cripte"]{background-image:radial-gradient(ellipse at 50% -10%,rgba(143,211,255,.12),transparent 60%)}
body[data-dg="cripte"] .mapsvg .edge.done{stroke:#8fd3ff}body[data-dg="cripte"] .votebanner:not(.fin){background:linear-gradient(#1f3346,#16202d);border-color:#8fd3ff;color:#cfeeff}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:13px;color:var(--muted);padding:10px 16px;border-top:1px solid var(--line);background:var(--stone2)}

/* Combat */
.combat{flex:1;display:flex;flex-direction:column;min-height:0}
.cscroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;padding-bottom:6px}
.enemies{flex:1 0 auto;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-content:center;padding:12px 16px}
.btn.danger{background:#8e2a22;border-color:#d4574b;color:#fff;font-weight:700}
.ent{position:relative;background:var(--stone2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.enemy{width:150px;max-width:31vw;min-width:100px}
.ent.hero.target,.ent.ally.target{border-color:var(--heal);box-shadow:0 0 0 2px rgba(111,207,142,.55);cursor:pointer}

.spr{image-rendering:pixelated;display:block;position:relative;z-index:1;max-width:100%;height:auto}

.spr.hit{animation:hit .35s steps(3)}

@keyframes hit{0%,66%{filter:brightness(3) saturate(0);transform:translateX(-4px)}33%{transform:translateX(4px)}}

/* Grafica Pixellab (Sviluppo): figura in una cella quadrata con margini vuoti, che i margini negativi recuperano */
.pxh{display:block;flex:none;max-width:none;background-repeat:no-repeat;background-position:0 0;background-size:100% 100%;image-rendering:pixelated}
.hero .face .pxh{width:126px;height:126px;margin:-22px -36px -24px}
.ally>.pxh{width:63px;height:63px;margin:-11px -18px -12px}
/* figura ferma fuori dal combattimento: la cella di 84 px è ritagliata sulla parte centrale di 56 px, dove stanno tutti gli eroi */
.pxs{aspect-ratio:1/1;height:auto;background-repeat:no-repeat;background-size:150% 150%;background-position:50% 43%;image-rendering:pixelated;flex:none}
.spr.pxan{background-size:calc(var(--n) * 100%) 100%;animation:pxan var(--d) steps(var(--n),jump-none) 1 forwards}
/* nemici Pixellab: la figura riempie un quadrato di lato --t (come lo sprite); la cella intera sborda con margini negativi, così attacchi ed effetti escono dal riquadro */
.pxe{display:block;flex:none;max-width:none;background-repeat:no-repeat;background-position:0 0;background-size:100% 100%;image-rendering:pixelated;margin:calc(var(--t)*var(--mt)) calc(var(--t)*var(--mr)) calc(var(--t)*var(--mb)) calc(var(--t)*var(--ml))}
.pxe,.ent.enemy .face .spr.pxe{width:calc(var(--t)*var(--k));height:calc(var(--t)*var(--k))}
.spr.inl.pxe{display:inline-block;vertical-align:middle}
.spr.pxi{image-rendering:auto}
.enemy.dead .spr.pxe{transform:none}.enemy.dead .spr.pxe.pxan{animation:pxan var(--d) steps(var(--n),jump-none) 1 forwards}
.enemy.dead:has(.pxe){opacity:.7;filter:grayscale(.35)}
.dg .dgart:has(.pxe){border-radius:50%;background:radial-gradient(circle,rgba(255,240,215,.2),rgba(255,240,215,.07) 50%,transparent 72%)}

class RNG{constructor(s){this.s=s|0}
  next(){this.s=(this.s+0x6D2B79F5)|0;let t=this.s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}
  int(a,b){return a+Math.floor(this.next()*(b-a+1))}
  pick(a){return a[Math.floor(this.next()*a.length)]}

  a.forEach((r,y)=>[...r].forEach((ch,X)=>{const v=ch==='x'?col:ch==='X'?'#'+dark:PAL[ch];if(v){x.fillStyle=v;x.fillRect(X,y,1,1)}}));return sprCache[key]=c.toDataURL()}

const sprImg=(name,px,cls='',noPx)=>{if(!noPx&&pxeOk(name))return pxeHTML(name,px,cls);const fk=!noPx&&pxFig(name);if(fk)return `<span class="spr pxs ${cls}" role="img" aria-label="${CLASSES[String(name).split('@')[0]].n}" style="width:${px}px;background-image:url(pixel/${fk}.png)"></span>`;const pi=!noPx&&pxIco(name),src=pi||spr(name);const a=SPR[name]||ICONS[name]||SPR[String(name).split('@')[0]];return `<img class="spr ${cls}${pi&&px<32?' pxi':''}" src="${src}" width="${px}" height="${Math.round(px*a.length/a[0].length)}" alt="">`};

/* --- meccaniche --- */
function SUMMON(n){const h=g.hero;h.min=h.min||[];for(let i=0;i<n;i++){if(h.min.length>=5)break;h.min.push({hp:5,atk:3})}fx('hero','+'+n+' Scheletr'+(n>1?'i':'o'),'heal')}
function taunter(){const c=R.combat;if(!c)return null;const t=Object.keys(c.heroes).filter(p=>!c.heroes[p].down&&c.heroes[p].st.taunt>0);return t.length?t[0]:null}
function retarget(){const p=taunter();if(!p)return;R.combat.enemies.forEach(e=>{const it=e.intent;if(!it||e.hp<=0||it.aoe)return;if(it.tg)it.tg=p;if(it.tgs)it.tgs=it.tgs.map(()=>p)})}
function TAUNT(n){S(g.hero,'taunt',n);retarget()}
function FERV(n){S(g.hero,'fervor',n)}
function setForm(k){const h=g.hero;if(!FORMS[k])k='orso';const first=!h.formed;h.form=k;h.formed=1;fx('hero',FORMS[k][0]+'!','heal');if(first&&has('seme'))D(2)}
function setElem(k){const h=g.hero;if(!ELEMS[k])k='fuoco';h.elem=k;fx('hero',ELEMS[k][0]+'!','heal');if(has('rosario'))B(3)}
function inForm(k){return g.hero&&g.hero.form===k}
function inElem(k){return g.hero&&g.hero.elem===k}
function petHit(t,mult=1){const h=g.hero;if(!h.pet||!alive().length)return;const a=alive();t=t&&t.hp>0?t:(a.find(e=>e.st.mark)||rng.pick(a));const d=h.pet.atk+(h.pw.addestr||0)*2;
  for(let i=0;i<mult;i++){if(t.hp<=0)break;hurtEnemy(t,calcDmg(d,{st:{},hand:[]},t));g.hit.add(t)}if(h.pw.istinto)B(h.pw.istinto*2)}
function elemHit(h){const tg=[...g.hit].filter(e=>e.hp>0);const n=h.pw.armonia?2:1;
  for(let k=0;k<n;k++){if(h.elem==='fuoco'&&tg[0])S(tg[0],'burn',2);if(h.elem==='acqua')H(2);if(h.elem==='terra')B(3);if(h.elem==='aria'){const a=alive();if(a.length){const e=rng.pick(a);hurtEnemy(e,3)}}}}
function allyAttacks(){const c=R.combat;Object.keys(c.heroes).forEach(pid=>{const h=c.heroes[pid];if(h.down)return;ctx(pid);g.hit=new Set();
  (h.min||[]).forEach(m=>{const a=alive();if(!a.length)return;const e=a.find(x=>x.st.doom)||rng.pick(a);hurtEnemy(e,m.atk+(h.pw.ossa||0)*2)});
  if(h.pet)petHit(null)})}
function doomCheck(e){if(e.hp>0&&e.st.doom&&e.st.doom>=e.hp){ctx(null);fx(eid(e),'Condannato!','psn');e.hp=0;e.dead=true;return true}return false}

function genMap(r){
  const C=7,map=[];for(let y=0;y<=ROWS;y++)map.push(Array(C).fill(null));
  const node=(y,x)=>map[y][x]||(map[y][x]={y,x,type:null,next:[],jx:r.int(-18,18),jy:r.int(-12,12)});
  const crosses=(y,x,nx)=>{if(nx===x+1){const o=map[y][x+1];return o&&o.next.includes(x)}if(nx===x-1){const o=map[y][x-1];return o&&o.next.includes(x)}return false};
  let first=-1;
  for(let p=0;p<6;p++){
    let x=r.int(0,C-1);if(p===1)while(x===first)x=r.int(0,C-1);if(p===0)first=x;
    for(let y=0;y<ROWS-1;y++){const n=node(y,x);let nx=x;
      for(let t=0;t<12;t++){nx=Math.max(0,Math.min(C-1,x+r.int(-1,1)));if(!crosses(y,x,nx))break;nx=x}
      if(!n.next.includes(nx))n.next.push(nx);node(y+1,nx);x=nx}
  }
  map[ROWS][3]={y:ROWS,x:3,type:'boss',next:[],jx:0,jy:0};
  map[ROWS-1].forEach(n=>{if(n)n.next=[3]});
  for(let y=0;y<ROWS;y++)map[y].forEach(n=>{if(!n)return;
    if(y===0)n.type='combat';else if(y===8)n.type='treasure';else if(y===ROWS-1)n.type='rest';
    else{const p=r.next();n.type=(y>=5&&p<.15)?'elite':(p<.27&&y>=4&&y!==ROWS-2)?'rest':(p<.34&&y>=2)?'shop':p<.56?'event':'combat'}});
  return map;
}
const PCOL=['#ffb347','#6ec3ff','#ff6f91','#7ee07e','#c39bff','#ffe45c','#4fd6c6','#ff9257'];
const pcol=pid=>PCOL[Math.max(0,R.order.indexOf(pid))%PCOL.length];
function planValid(path){if(!Array.isArray(path)||!R.map)return [];const out=[];let prev=R.pos?R.map[R.pos.y][R.pos.x]:null;
  for(const q of path.slice(0,ROWS+1)){if(!Array.isArray(q))break;const y=q[0]|0,x=q[1]|0;const n=R.map[y]&&R.map[y][x];if(!n)break;
    if(prev?!(prev.y+1===y&&prev.next.includes(x)):y!==0)break;out.push([y,x]);prev=n}return out}
ACT.plan=(a,P,pid)=>{if(R.phase!=='map')return;R.plans=R.plans||{};const v=planValid(a.p);if(v.length)R.plans[pid]=v;else delete R.plans[pid]};
function planTap(y,x){const mine=planValid((R.plans||{})[ME]);const last=mine[mine.length-1];
  if(last&&last[0]===y&&last[1]===x)mine.pop();
  else{const prev=last?R.map[last[0]][last[1]]:(R.pos?R.map[R.pos.y][R.pos.x]:null);const ok=prev?(prev.y+1===y&&prev.next.includes(x)):y===0;
    if(!ok){toast('Tocca un nodo collegato alla fine del tuo percorso.');return}mine.push([y,x])}
  send({t:'plan',p:mine})}
function nodeTap(y,x){if(UI.draw)planTap(y,x);else vote(y,x)}
// toccando una linea che parte dal percorso (o da dove sei) il percorso la segue; se parte da un nodo a metà, cambia strada da lì; l'ultima linea toccata di nuovo si toglie
function edgeTap(y1,x1,y2,x2){const mine=planValid((R.plans||{})[ME]),st=R.pos?[R.pos.y,R.pos.x]:null,chain=(st?[st]:[]).concat(mine);
  const i=chain.findIndex(q=>q[0]===y1&&q[1]===x1),last=mine[mine.length-1];
  if(last&&last[0]===y2&&last[1]===x2&&i===chain.length-2){mine.pop();send({t:'plan',p:mine});return}
  if(i<0){if(!st&&!mine.length&&y1===0){send({t:'plan',p:[[y1,x1],[y2,x2]]});return}toast('Tocca una linea che parte dal tuo percorso.');return}
  const base=chain.slice(st?1:0,i+1);base.push([y2,x2]);send({t:'plan',p:base})}
function availNodes(){
  if(!R.map)return[];
  if(!R.pos)return R.map[0].filter(Boolean);
  const n=R.map[R.pos.y][R.pos.x];return n.next.map(x=>R.map[R.pos.y+1][x]);
}
function resolveVote(){
  const tally={};active().forEach(p=>{const v=R.votes[p];if(v)tally[v]=(tally[v]||0)+1});
  const max=Math.max(...Object.values(tally));const best=Object.keys(tally).filter(k=>tally[k]===max);
  const win=rng.pick(best),opts=Object.keys(tally);
  if(solo||opts.length<2){R.votes={};const [y,x]=win.split(',').map(Number);enterNode(y,x);return}
  // voti diversi: mostra a tutti chi vince prima di partire
  const tie=best.length>1;R.voteAnim={id:Math.floor(Math.random()*1e9),opts:tie?best:opts,tally,win,tie,ms:tie?3600:2200};
  setTimeout(finishVote,R.voteAnim.ms+400);
}
function finishVote(){
  if(!R||!isHost||!R.voteAnim||R.phase!=='map')return;
  const [y,x]=R.voteAnim.win.split(',').map(Number);R.voteAnim=null;R.votes={};enterNode(y,x);checkProgress();commit();
}

function enterNode(y,x){
  R.pos={y,x};R.path.push([y,x]);R.floor=y+1;const t=R.map[y][x].type;
  if(R.plans)Object.keys(R.plans).forEach(p=>{const pl=R.plans[p];if(pl&&pl[0]&&pl[0][0]===y&&pl[0][1]===x&&pl.length>1)R.plans[p]=pl.slice(1);else delete R.plans[p]});
  if(segRoll(y,x,t)){R.segN=(R.segN|0)+1;R.segAt=(R.segAt||[]).concat([[R.cycle||1,y,x]]);R.segNext={y,x};openSecret();return}

/* Strade segrete (v8.2): di rado, arrivando su una casella, si apre un passaggio con tesori unici.
   Al massimo una per giro di mappa, mai al primo piano, prima del boss, su élite, mercante o falò, né nella sfida del giorno.
   Il tiro usa un generatore a parte (dal seme della partita), così non cambia il resto della partita. */
const SEG_P=.03,SEG_T=['combat','event','treasure'];// circa una partita su quattro (su un percorso ci sono 8-10 caselle adatte)

  return !!R.segForce||new RNG(hashStr(R.seed+'#seg'+(R.dg||'')+':'+(R.cycle||1)+':'+y+':'+x)).next()<SEG_P}
function secretOpts(){const pool=SECRET_RELICS.filter(k=>!run.relics.includes(k)),o=rng.shuffle(pool.slice()).slice(0,2).map(id=>({k:'relic',id}));
  while(o.length<2)o.push({k:'tesoro',gold:90+o.length*40});o.push({k:'tesoro',gold:90});return o}
function openSecret(){const ids=active();R.phase='room';
  R.order.forEach(pid=>{const P=R.players[pid];P.screen=null;P.done=!ids.includes(pid);if(P.done)return;ctx(pid);P.secret={opts:secretOpts(),taken:null};P.screen='secret'})}
function nodeContent(y,x){const t=R.map[y][x].type;
  const D=DG();
  if(t==='combat')return startCombat(rng.pick(y<3?D.easy:D.hard),'combat');
  if(t==='elite')return startCombat(rng.pick(D.elites),'elite');
  if(t==='boss')return startCombat([bossId()],'boss');
  const ids=active();let evId=null;
  if(t==='event'){const all=EVENTS.filter(e=>(!e.dg||e.dg.includes(R.dg||'rocca'))&&(!e.lo||LO()));let pool=all.filter(e=>!R.seenEv.includes(e.id));if(!pool.length)pool=all;evId=rng.pick(pool).id;R.seenEv.push(evId)}
  R.phase='room';
  R.order.forEach(pid=>{const P=R.players[pid];P.screen=null;P.done=!ids.includes(pid);if(P.done)return;ctx(pid);
    if(t==='event'){P.event={id:evId,result:null};P.screen='event'}
    else if(t==='rest'){if(R.map[y][x].spento){P.screen='spento';if(LO()&&P.caduto&&!P.malato){P.malato=1;if(P.stx)P.stx.malattie=(P.stx.malattie||0)+1}}else P.screen='rest'}

  const ai=aiutiDisp(P);if(ai.length||P.aiuto)out.push(`<div class="mxbox"><b>${ic('i_house',16)} Aiuto dal villaggio</b>${P.aiuto?`<span class="mx ok">Già chiamato: ${AIUTI[P.aiuto].n}</span>`:`<button class="btn" onclick="aiutoUI()">Chiama un abitante (una volta per partita)</button>${LO()&&vilFiducia(ME)<1?`<small class="muted">${vilFidTxt(vilFiducia(ME))}</small>`:''}`}</div>`);

/* «Aprite il cancello» (v8.4): le campagne bruciano e i contadini corrono verso la Rocca.
   Tieni aperto il cancello: 8 ondate di mostri, a ogni ondata 5 abitanti provano a entrare.
   A ogni tuo turno uno passa il cancello; nei turni in cui i nemici ti feriscono ne catturano 1 (2 con élite o boss); vincendo entrano tutti gli altri.
   Dopo la 3ª e la 6ª ondata le Retrovie (non c'è tempo per un Falò): cure con le bende o armaioli; all'8ª arriva Gorrak. I premi dipendono da quanti abitanti salvi. */
const PORTA_ONDATE=8,PORTA_GRUPPO=5,PORTA_CR=4,PORTA_K='valdombra-porta-premiate',PORTA_REC='valdombra-porta-record';
const isPorta=()=>!!(R&&R.mode==='porta');
function portaIds(w){const D=DUNGEONS.rocca,e=()=>rng.pick(D.easy),h=()=>rng.pick(D.hard),m=()=>rng.pick(D.easy.flat());
  return [null,[e(),'combat'],[[...e(),m()],'combat'],[h(),'combat'],[rng.pick(D.elites),'elite'],[[...h(),m()],'combat'],[[...h(),...e()],'combat'],[[...rng.pick(D.elites),m()],'elite'],[['signoreguerra'],'boss']][w]}
function portaOndata(){const P=R.porta;P.ondata++;P.gruppo=Math.min(PORTA_GRUPPO,P.fuori);P.fuori-=P.gruppo;R.floor=P.ondata;R.pos=null;
  const [ids,kind]=portaIds(P.ondata);startCombat(Array.isArray(ids)?ids:[ids],kind)}
function portaCattura(){const c=R.combat,P=R.porta;if(!isPorta()||!c||!P||!P.gruppo||!c.ferito)return;const al=alive();if(!al.length)return;
  const n=Math.min(P.gruppo,al.some(e=>e.boss||ENEMIES[e.id].elite)?2:1);P.gruppo-=n;P.persi+=n;
  fx(eid(al[0]),n>1?'−'+n+' abitanti':'−1 abitante','dmg')}
// dopo la ricompensa: Retrovie alla 3ª e alla 6ª ondata, poi l'ondata seguente
function portaDopo(){const P=R.porta;if((P.ondata===3||P.ondata===6)&&P.falo!==P.ondata){P.falo=P.ondata;const ids=active();R.phase='room';

// abitanti in salvo dietro l'eroe: crescono a soglie con i salvati e calano quando se ne perdono (si conta salvati − persi)

function portaFollaN(){const P=R&&R.porta;if(!P)return 0;const n=Math.max(0,(P.salvati|0)-(P.persi|0));if(!n)return 0;const t=PORTA_FOLLA.find(([lim])=>n<=lim);return t?t[1]:PORTA_FOLLA[PORTA_FOLLA.length-1][1]}

function portaBanner(){const P=R.porta;if(!P)return '';
  return `<div class="climabar portabar"><b>Ondata ${P.ondata}/${PORTA_ONDATE}</b> · ${P.gruppo?`${P.gruppo} ${pl(P.gruppo,'abitante aspetta','abitanti aspettano')} al cancello: a ogni tuo turno ne entra uno, ma se i nemici ti feriscono ne catturano ${alive().some(e=>e.boss||ENEMIES[e.id].elite)?2:1}`:'Nessuno in attesa al cancello'} · <span style="color:#9be06a">Salvati ${P.salvati}</span> · <span style="color:#ff9a8f">Persi ${P.persi}</span></div>`}
function portaAward(){if(!isPorta()||R.phase!=='end'||!R.porta)return null;const key=R.code+':'+R.seed+':'+(R.t0||0);const done=jsonArr(PORTA_K);
  const n=R.porta.salvati,cr=n*PORTA_CR,gm=n>=PORTA_ONDATE*PORTA_GRUPPO?2:n>=30?1:0;

  const rec=n>(parseInt(load(PORTA_REC)||'0',10)||0);if(rec)store(PORTA_REC,String(n));UI.lastPorta={key,cr,gm,rec};return UI.lastPorta}
// punteggio: abitanti salvati, ondate respinte, nemici uccisi (nella tabella «classifica»: dungeon 'porta', piani = abitanti salvati)
function portaScore(kills){const P=R.porta||{};return (P.salvati|0)*100+(R.win?PORTA_ONDATE:Math.max(0,(P.ondata|0)-1))*50+(kills|0)*2}
function portaEndScreen(){const P=R.porta||{salvati:0,persi:0,ondata:0},a=portaAward()||{cr:0,gm:0},tot=PORTA_ONDATE*PORTA_GRUPPO,rec=parseInt(load(PORTA_REC)||'0',10)||0;
  const t=R.win?(P.salvati>=tot?'Tutti in salvo!':'Il cancello è chiuso'):'Il cancello è caduto';
  const d=R.win?(P.salvati>=tot?'Nessun abitante è rimasto fuori: Valdombra canterà il tuo nome per generazioni.':'Gorrak è sconfitto e il cancello si chiude alle spalle degli ultimi fuggiaschi.'):'Le orde hanno sfondato. Chi è riuscito a entrare racconterà del tuo coraggio.';

    <div class="panel portafine"><div class="adtiles"><div class="adtile"><small>Abitanti salvati</small><b style="color:#9be06a">${P.salvati}</b><span>su ${tot}</span></div><div class="adtile"><small>Persi</small><b style="color:#ff9a8f">${P.persi}</b><span>catturati dalle orde</span></div><div class="adtile"><small>Ondate</small><b>${R.win?PORTA_ONDATE:Math.max(0,P.ondata-1)}</b><span>respinte su ${PORTA_ONDATE}</span></div><div class="adtile"><small>Il tuo record</small><b>${rec}</b><span>${a.rec?'nuovo record!':'abitanti salvati'}</span></div></div>
    <p><b style="color:var(--torch2)">+${a.cr} Corone</b>${a.gm?` e <b class="gemc">+${a.gm} ${pl(a.gm,'Gemma','Gemme')}</b>`:''} · ${PORTA_CR} Corone per ogni abitante salvato; 1 Gemma se ne salvi almeno 30, 2 se li salvi tutti.</p></div>
    ${(()=>{const kills=R.order.reduce((s,p)=>s+(R.players[p].kills||0),0),mode=solo?'solo':'coop';
      if((solo||R.host===ME)&&!R.lbId&&!UI.lbMsg)setTimeout(submitScore,0);
      if(R.lbId&&UI.lbFor!==R.lbId){UI.lbFor=R.lbId;UI.lb=null;UI.lbDg='porta';fetchBoard(mode).then(r=>{UI.lb=r;render()})}
      return `<div class="endstats"><div><b>${portaScore(kills)}</b>Punteggio</div><div><b>${P.salvati}</b>Abitanti salvati</div><div><b>${kills}</b>Nemici uccisi</div><div><b>${fmtTempo(tempoMs())}</b>Tempo di gioco</div></div>
      <div class="panel"><h3>Classifica ${solo?'giocatore singolo':'cooperativa'}: Aprite il cancello</h3>${boardBody(UI.lbMsg?{error:UI.lbMsg}:R.lbId?UI.lb:null,R.lbId,true)}</div>`})()}
    ${summaryHTML()}${achPanel()}${xpPanel()}${gemsPanel()}
    <div class="row">${againBtns()}</div></div></main>`}
function newCycle(){
  R.cycle++;R.map=genMap(new RNG(hashStr(R.seed+'#map'+R.cycle)));R.pos=null;R.path=[];R.floor=0;R.votes={};R.segN=0;R.segNext=null;R.clima=genClimi();
  R.order.forEach(p=>{const P=R.players[p];P.hp=Math.min(P.max,P.hp+Math.floor(P.max*.3))});
}
const totalFloors=()=>((R.cycle||1)-1)*(ROWS+1)+(R.floor||0);
function endRun(win){if(!win&&R.combat)R.deathAt=R.combat.enemies.map(e=>e.id).join(',').slice(0,80);R.phase='end';R.win=win;R.combat=null;g=null}

/* ================= LUCE E OMBRA ================= */
// ogni carta con danni, Armatura o Veleno si può giocare dal lato Ombra: +50%, ma dà 1 Ombra.
// 5 Ombra: i nemici ti colpiscono più forte. 10 Ombra: Caduta nell'ombra (v9.0: a 10 si resta finché non ci si purifica).
const DARK=new Set(['scheletro','cavaliere','spettro','zombi','cultista','pipistrello','golem','vampiro','imp','segugio','demone','lich','tiranno','verme']);
const OM_MAX=10,OM_HIGH=5,OM_KEYS=['d','b','p'],OM_KILL=8;// con almeno OM_KILL Ombra si può uccidere il mercante
const LO=()=>!!(R&&R.lo);
const isDark=e=>!!e&&LO()&&DARK.has(e.id);
const shUp=n=>Math.ceil(n*1.5);
// lato Ombra «di base»: carte con danni, Armatura o Veleno
function omBase(c){if(!LO()||!c)return false;const d=CARDS[c.id];if(!d||d.unplay||d.nosh||d.t==='P'||d.t==='X')return false;const v=vals(c);return OM_KEYS.some(k=>v[k]>0)}
// «Ombra per tutti gli eroi» (Sviluppo, v8.2): anche le altre carte hanno un lato Ombra. I loro numeri
// (cure, Marchio, Condanna, Debole, Vulnerabile, Forza, evocazioni, carte pescate, Fervore...) crescono del 50%;
// le carte senza numeri ti fanno pescare 1 carta in più. Energia e PV persi non cambiano.
const OMX_KEYS=['h','m','w','s','v','n','dr','f','de','k'];
const LOX=()=>!!(R&&R.lo&&R.lox);
function omExt(c){if(!LOX()||!c||omBase(c))return false;const d=CARDS[c.id];return !!d&&!d.unplay&&!d.nosh&&d.t!=='P'&&d.t!=='X'}
function omxVals(v){const o={...v};OMX_KEYS.forEach(k=>{if(o[k]>0)o[k]=shUp(o[k])});return o}
const omxDraw=c=>{const v=vals(c);return !OMX_KEYS.some(k=>v[k]>0)};// senza numeri da far crescere: pesca 1 carta in più
function canShadow(c){return omBase(c)||omExt(c)}
function shadowVals(v){const o={...v};OM_KEYS.forEach(k=>{if(o[k]>0)o[k]=shUp(o[k])});return o}
// i valori mostrati e usati dal lato Ombra
function omVals(c){return omExt(c)?omxVals(vals(c)):shadowVals(vals(c))}
// per l'enciclopedia (fuori dalla partita): 'O' lato Ombra di base, 'X' esteso (solo con «Ombra per tutti gli eroi»), null nessuno
function encShadow(id){const d=CARDS[id];if(!d||d.unplay||d.nosh||d.t==='P'||d.t==='X')return null;const v=d.v||{};if(OM_KEYS.some(k=>v[k]>0))return 'O';return SET.lo&&SET.lox?'X':null}
// Equilibrio (v8.3): chi resta nella Luce (0-2 Ombra) ha i suoi vantaggi, chi scende nell'Ombra paga di più.
// Luce: cure +25%, Scudo di Luce (+3 Armatura a fine turno se hai giocato solo carte Luce) e il potere di Luce dell'eroe.
// Ombra 5+: i nemici colpiscono più forte e c'è il potere d'Ombra dell'eroe; da 7 le cure curano la metà.
const OM_LUCE=2,OM_BUIO=7;
const omStato=pid=>{const n=omOf(pid);return n<=OM_LUCE?'L':n>=OM_HIGH?'O':'N'};
function curaMod(pid,n){if(!n||!R)return n;const P=R.players[pid];let v=n;
  if(LO()){const o=omOf(pid);if(o<=OM_LUCE)v=Math.round(v*1.25);else if(o>=OM_BUIO)v=Math.floor(v/2)}
  if(P&&P.relics&&P.relics.includes('cuorecavo'))v=Math.floor(v/2);return v}
// poteri a inizio combattimento: [testo, effetto(h, o)] dove o = {en, dr} del primo turno
const OMPOW={
  guerriero:{L:['Inizi il combattimento con 5 Armatura.',h=>{h.blk+=5}],O:['Inizi il combattimento con 2 Forza.',h=>S(h,'str',2)]},
  mago:{L:['Nel primo turno peschi 1 carta in più.',(h,o)=>{o.dr++}],O:['Nel primo turno hai 1 Energia in più.',(h,o)=>{o.en++}]},
  ladro:{L:['Inizi il combattimento con 1 Destrezza.',h=>S(h,'dex',1)],O:['A inizio combattimento applichi 3 Veleno a tutti i nemici.',()=>SA('poison',3)]},
  chierico:{L:['A inizio combattimento recuperi 4 PV.',()=>H(4)],O:['A inizio combattimento applichi 1 Debole a tutti i nemici.',()=>SA('weak',1)]},
  necromante:{L:['Inizi il combattimento con 6 Armatura.',h=>{h.blk+=6}],O:['A inizio combattimento evochi uno Scheletro.',()=>SUMMON(1)]},
  ranger:{L:['Nel primo turno peschi 1 carta in più.',(h,o)=>{o.dr++}],O:['A inizio combattimento applichi 2 Marchio a tutti i nemici.',()=>SA('mark',2)]},
  druido:{L:['A inizio combattimento recuperi 4 PV.',()=>H(4)],O:['Inizi il combattimento con 1 Forza e 1 Destrezza.',h=>{S(h,'str',1);S(h,'dex',1)}]},
  monaco:{L:['Inizi il combattimento con 1 Destrezza.',h=>S(h,'dex',1)],O:['Nel primo turno hai 1 Energia in più.',(h,o)=>{o.en++}]},
  guardiano:{L:['Inizi il combattimento con 8 Armatura.',h=>{h.blk+=8}],O:['Inizi il combattimento con 2 Forza.',h=>S(h,'str',2)]},
  paladino:{L:['A inizio combattimento ottieni 2 Fervore.',()=>FERV(2)],O:['A inizio combattimento applichi 2 Vulnerabile a tutti i nemici.',()=>SA('vuln',2)]},
};
function omPow(pid){if(!LO()||!R||!R.players[pid])return null;const t=OMPOW[R.players[pid].cls],st=omStato(pid);return t&&st!=='N'?[st,...t[st]]:null}
const omOf=pid=>{const P=R&&R.players[pid];return P?P.om|0:0};
function omAdd(pid,n){const P=R&&R.players[pid];if(!P||!LO()||!n)return;const b=P.om|0;P.om=Math.max(0,Math.min(OM_MAX,b+n));
  if(P.om!==b)fxq.push({k:'h-'+pid,txt:(n>0?'+':'')+(P.om-b)+' Ombra',cls:n>0?'psn':'heal'});if(P.om>=OM_MAX)omFall(pid);else omGuarisci(pid)}
/* Caduta nell'ombra (v9.0): a 10 Ombra si cade e si RESTA a 10 finché non ci si purifica (riposo a un falò acceso, Incenso, Pellegrino, Tempio):
   i turni di sola Luce non bastano più. Alla caduta: PV massimi −4 (−2 col Tempio al 3) e alcuni falò della mappa si spengono (di più col Livello di Assedio).
   In combattimento anche Forma oscura (danni doppi per il turno) e +2 Energia; fuori dal combattimento arrivano all'inizio del prossimo. */
const omSpentiN=()=>1+Math.floor((R&&R.lvl|0)/2);
function omFall(pid){const P=R.players[pid];if(!P||P.caduto)return;P.caduto=1;P.om=OM_MAX;const loss=(P.vb&&P.vb.tempio>=3)?2:4;P.max=Math.max(10,P.max-loss);P.hp=Math.min(P.hp,P.max);
  if(P.stx)P.stx.falls=(P.stx.falls||0)+1;const n=falSpegni();fxq.push({k:'h-'+pid,txt:'Caduta nell\'ombra!',cls:'psn'});
  noteP(P,'Caduta nell\'ombra: −'+loss+' PV massimi. Resti a 10 Ombra finché non ti purifichi'+(n?' e '+(n>1?n+' falò si sono spenti':'un falò si è spento')+' sulla mappa':'')+'.');
  const c=R.combat,h=c&&c.heroes[pid];if(h&&!h.down&&!c.won){h.st.oscuro=1;h.energy+=2}else P.cadPend=1}
// spegne a caso alcuni falò ancora da raggiungere
function falSpegni(){if(!R||!R.map||isPorta())return 0;const y0=R.pos?R.pos.y:-1,L=[];R.map.forEach(row=>row.forEach(n=>{if(n&&n.type==='rest'&&n.y>y0&&!n.spento)L.push(n)}));
  const k=Math.min(L.length,omSpentiN());rng.shuffle(L).slice(0,k).forEach(n=>n.spento=1);return k}
// sotto 10 Ombra si esce dalla caduta e passa la Malattia (anche le carte Malattia del combattimento in corso se ne vanno)
function omGuarisci(pid){const P=R&&R.players[pid];if(!P||!P.caduto||(P.om|0)>=OM_MAX)return;P.caduto=0;P.cadPend=0;
  if(P.malato){P.malato=0;noteP(P,'Sei sotto 10 Ombra: la Malattia se ne va.');const h=R.combat&&R.combat.heroes[pid];if(h)['hand','draw','disc'].forEach(k=>h[k]=h[k].filter(c=>c.id!=='malattia'))}}
function omStart(){const c=R.combat;if(!LO()||!c)return;const tot=Object.keys(c.heroes).reduce((t,p)=>t+omOf(p),0),n=Math.min(3,Math.floor(tot/5));
  if(n)c.enemies.forEach(e=>{if(isDark(e)){e.st.str=(e.st.str||0)+n;fx(eid(e),'+'+n+' Forza dall\'ombra','dmg')}})}
// all'inizio del combattimento: chi ha 10 Ombra cade subito; con 7 o più i nemici comuni ti temono
function omAfterStart(){const c=R.combat;if(!LO()||!c)return;const ids=Object.keys(c.heroes);
  if(ids.some(p=>omOf(p)>=7))c.enemies.forEach(e=>{if(!isDark(e)&&!e.boss&&e.hp>0){e.st.weak=(e.st.weak||0)+1;fx(eid(e),'Ti teme!','blk')}});
  ids.forEach(p=>{const P=R.players[p],h=c.heroes[p];if(!P||!h)return;if(omOf(p)>=OM_MAX&&!P.caduto)omFall(p);
    if(P.cadPend&&!h.down){P.cadPend=0;h.st.oscuro=1;h.energy+=2;fxq.push({k:'h-'+p,txt:'Caduta nell\'ombra!',cls:'psn'})}
    if(P.malato&&P.caduto&&(P.om|0)>=OM_MAX){h.draw.splice(rng.int(0,h.draw.length),0,{id:'malattia',up:false,uid:uid++});fxq.push({k:'h-'+p,txt:'+1 Malattia',cls:'psn'})}})}
// il mercante: sconto a chi è puro, rincaro a chi è nell'ombra
function omPrice(p,P){P=P||run;if(!LO()||!P)return p;const o=P.om|0;return Math.round(p*(o<=1?.9:o>=OM_HIGH?1.15:1))}
function omChip(pid,click){if(!LO())return '';const n=omOf(pid);return `<span class="chip omb ${n>=OM_HIGH?'hi':''}" role="button" tabindex="0" onclick="event.stopPropagation();${click||`omInfo()`}">Ombra ${n}</span>`}

function startCombat(ids,kind){
  const L=R.lvl||0,party=active(),n=Math.max(1,party.length);
  const cy=(R.cycle||1)-1,surv=R.mode==='surv';
  const minions=DG().easy.flat(),strong=DG().hard.flat();
  ids=[...ids];if((n>=4||(surv&&n>=2))&&kind==='combat')ids.push(rng.pick(minions));
  if(surv&&cy>=1&&kind==='combat')ids.push(rng.pick(strong));
  if(surv&&cy>=3&&kind==='combat')ids.push(rng.pick(strong));
  const big=kind==='elite'||kind==='boss';
  const hpM=1.15*(big?1.1:1)*(1+.7*(n-1))*(1+.5*cy),dM=1.12*(1+.1*(n-1))*(1+.2*cy);
  R.combat={hp0:Object.fromEntries(party.map(p=>[p,R.players[p].hp])),kind,n,turn:0,busy:false,won:false,heroes:{},hpM:hpM*(R.daily&&R.daily.mod==='potenti'?1.25:1),dM,L,enemies:[],clima:R.pos?climaOf(R.pos.y):null,cursed:party.some(p=>R.players[p].relics.includes('occhiovuoto'))};
  ids.forEach(id=>R.combat.enemies.push(mkEnemy(id)));
  if(kind==='elite')R.combat.enemies.forEach(e=>{if(ENEMIES[e.id].elite){e.trait=rng.pick(Object.keys(ETRAITS));if(e.trait==='furioso')e.st.str=(e.st.str||0)+trv('furioso')}});
  party.forEach(pid=>{const P=R.players[pid];P.deck.forEach(c=>{if(!c.k)c.k=uid++});const sh=rng.shuffle(P.deck.map(c=>({...c,uid:uid++})));R.combat.heroes[pid]={pid,blk:0,st:{},pw:{},draw:[...sh.filter(c=>!innOf(c)),...sh.filter(innOf)],hand:[],disc:[],exh:[],energy:0,ended:false,down:false}});
  R.phase='combat';R.order.forEach(p=>{R.players[p].screen=null;R.players[p].done=true});
  g=R.combat;climaStart();omStart();rollIntents();startTurn();omAfterStart();if(kind==='boss')missBoss();
}
function mkEnemy(id){const c=R.combat,d=ENEMIES[id],L=c.L||0;const strong=!!(d.elite||d.boss);const hp=Math.round(rng.int(d.hp[0],d.hp[1])*(1+.1*L+(strong?.05*L:0))*c.hpM*(c.cursed?1.15:1)*(c.clima==='luna'?.8:1));
  return{id,n:d.n,hp,max:hp,blk:d.blk?Math.round(d.blk*c.hpM):0,st:{},t:0,dead:false,boss:!!d.boss,bonus:dmgBonus(L,strong),dm:c.dM}}
function targetable(){const c=R.combat;let t=Object.keys(c.heroes).filter(p=>!c.heroes[p].down&&isOnline(p));if(!t.length)t=Object.keys(c.heroes).filter(p=>!c.heroes[p].down);return t}
function rollIntents(){
  // i nemici si dividono i bersagli: ognuno preferisce chi è stato scelto meno
  const load={};
  R.combat.enemies.forEach(e=>{if(e.hp<=0)return;const it=e.intent=ENEMIES[e.id].ai(e,rng);e.t++;
    if(!(it.d||it.deb||it.curse))return;const t=targetable();if(!t.length){it.tg=null;return}
    const pick=()=>{const m=Math.min(...t.map(p=>load[p]||0));const r=rng.pick(t.filter(p=>(load[p]||0)===m));load[r]=(load[r]||0)+1;return r};
    if(it.aoe){t.forEach(p=>load[p]=(load[p]||0)+1);it.tg=null;return}
    it.tg=pick();
    if(isDark(e)){const hi=t.filter(p=>omOf(p)>=OM_HIGH).sort((a,b)=>omOf(b)-omOf(a))[0];if(hi)it.tg=hi}
    if((it.x||1)>1&&t.length>1){it.tgs=[it.tg];for(let k=1;k<it.x;k++)it.tgs.push(rng.next()<.4?it.tgs[k-1]:pick())}
  });
  retarget();
}
function startTurn(){
  const c=R.combat;c.turn++;c.pings={};
  if(isPorta()&&R.porta&&R.porta.gruppo>0){R.porta.gruppo--;R.porta.salvati++;fxq.push({k:'h-'+(R.order[0]),txt:'+1 abitante in salvo',cls:'heal'})}
  Object.values(c.heroes).forEach(h=>{if(!h.pw.fortezza)h.blk=0;h.played={};h.nTurn=0;h.shTurn=0;delete h.st.spine});
  Object.keys(c.heroes).forEach(pid=>{const h=c.heroes[pid];if(h.down)return;ctx(pid);heroTurnStart(h,c.turn)});
  checkEnd();
}
function heroTurnStart(h,turn){

    if(hasT('m3'))alive().forEach(e=>hurtEnemy(e,4));if(hasT('l2'))SA('poison',2);if(hasT('c3'))Object.keys(g.heroes).forEach(p=>BA(p,4));
    if(R.daily&&R.daily.mod==='veleno')SA('poison',3);

    if(run.vb&&run.vb.tempio){const b=Math.floor((run.vb.tempio>=2?7:4)*vilFiducia(CUR));h.blk+=b}
    if(has('teschio'))SUMMON(1);if(has('fischietto'))h.pet={atk:4+TE('pet')};if(has('scudotorre')){h.blk+=10;TAUNT(1)}
    {const b=TE('blk');if(b)h.blk+=b;if(TE('str'))S(h,'str',TE('str'));if(TE('dex'))S(h,'dex',TE('dex'));en+=TE('en1');dr+=TE('dr1');if(TE('summon'))SUMMON(TE('summon'));if(TE('doomAll'))SA('doom',TE('doomAll'));if(TE('markAll'))SA('mark',TE('markAll'));if(TE('fervor'))S(h,'fervor',TE('fervor'))}
    if(has('ancora'))h.blk+=10;if(has('amuleto'))SA('weak',1);if(has('lanternasp'))SA('burn',3);if(has('mantonero')){h.blk+=8;S(h,'dex',1)}if(has('fiala'))SA('poison',2);if(has('elmo'))S(h,'str',1);if(has('corno'))SA('vuln',1);if(has('stendardo')){SA('weak',2);SA('vuln',2)}
  }
  if(has('dado')&&turn%3===0)en++;if(has('clessidra')&&turn%2===0)en++;
  if(has('cuoreabisso')){en++;if(run.hp>1){run.hp--;fx('hero','-1','dmg')}}
  if(has('coronanera'))en++;if(has('occhiovuoto'))dr++;if(has('lamasete')&&run.hp>2){run.hp-=2;fx('hero','-2','dmg')}
  if(has('braciere'))alive().forEach(e=>hurtEnemy(e,2));
  if(has('simbolo'))H(1);
  if(pw.furia)S(h,'str',pw.furia);
  if(h.form==='orso'){h.blk+=2;fx('hero','+2','blk')}// v9.0: 3 → 2if(h.form==='gufo')dr+=2;
  if(pw.maledizione)SA('doom',pw.maledizione);if(pw.natura)H(pw.natura);
  if(pw.corazza){const n=party().length;h.blk+=pw.corazza*n;fx('hero','+'+pw.corazza*n,'blk')}
  if(pw.arcimago)en+=pw.arcimago;
  if(pw.rapide)dr+=pw.rapide;
  if(pw.aura)party().forEach(p=>{const x=g.heroes[p];x.blk+=pw.aura;fxq.push({k:'h-'+p,txt:'+'+pw.aura,cls:'blk'})});
  if(pw.inno)alive().forEach(e=>hurtEnemy(e,pw.inno));
  h.energy=en;D(dr);
  const frz=h.hand.filter(c=>c.id==='gelo').length;if(frz)h.energy=Math.max(0,h.energy-frz);

function calcDmg(base,src,tgt){let d=base+(src.st.str||0);if(src.hand){if(src.form==='pantera')d+=3;if(src.pw&&src.pw.bosco)d+=1;if(tgt&&tgt.st&&tgt.st.mark)d+=tgt.st.mark;
    if(LO()&&g&&g.side){if(g.side==='O'&&!isDark(tgt))d*=1.5;else if(g.side==='L'&&isDark(tgt))d*=1.25}if(src.st.oscuro)d*=2}
  else if(LO()&&tgt&&tgt.pid&&omOf(tgt.pid)>=OM_HIGH)d+=2;
  if(src.st.weak)d*=.75;if(tgt&&tgt.st&&tgt.st.vuln)d*=1.5;return Math.max(0,Math.floor(d))}
const enemyBase=(e,it)=>Math.round((it.d+(e.bonus||0))*(e.dm||1));
function eid(e){return 'e'+R.combat.enemies.indexOf(e)}
function hurtEnemy(e,d){
  if(e.hp<=0)return;const b=Math.min(e.blk,d);e.blk-=b;const r=d-b;if(r>0&&run&&run.stx){const real=Math.min(r,e.hp);run.stx.dmg+=real;run.stx.top=Math.max(run.stx.top,real)}e.hp-=r;
  fx(eid(e),r>0?'-'+r:'Parato',r>0?'dmg':'blk');
  if(e.id==='tiranno'&&!e.rage&&e.hp>0&&e.hp<=e.max/2){e.rage=1;e.st.str=(e.st.str||0)+3;e.blk=0;fx(eid(e),'FURIA!','dmg')}
  if(e.id==='signoreguerra'&&!e.rage&&e.hp>0&&e.hp<=e.max/2){e.rage=1;const c=R.combat;['bandito','goblin'].forEach(id=>{if(c.enemies.filter(x=>x.hp>0).length<5)c.enemies.push(mkEnemy(id))});fx(eid(e),'RINFORZI!','dmg')}
  if(e.id==='verme'&&!e.rage&&e.hp>0&&e.hp<=e.max/2){e.rage=1;e.blk+=Math.round(30*(e.dm||1));fx(eid(e),'Si rintana!','blk')}
  if(e.hp<=0){e.hp=0;if(!e.dead){e.dead=true;if(run){run.kills++;if(has('zanna'))H(3);if(has('anello')&&g&&g.hero)g.hero.energy++}}}
}
function heroDown(){
  if(run.hp>0)return;
  if(has('piuma')&&!run.piumaUsed){run.piumaUsed=true;run.relics=run.relics.filter(r=>r!=='piuma');run.hp=Math.floor(run.max*.3);fx('hero','Rinato!','heal');return}
  run.hp=0;if(g&&g.hero){g.hero.down=true;g.hero.disc.push(...g.hero.hand);g.hero.hand=[];fx('hero','A terra!','dmg')}
}
function hurtHero(d){
  const h=g.hero;const b=Math.min(h.blk,d);h.blk-=b;let r=d-b;
  if(r>0&&h.min&&h.min.length){const m=h.min[0];m.hp-=r;fx('hero','Lo Scheletro para','blk');if(m.hp<=0)h.min.shift();r=0;heroDown();return}
  if(r>0&&has('giuramento'))S(h,'fervor',1+(h.pw.zelo||0));
  if(r>0){run.hp-=r;if(run.stx)run.stx.taken+=r;fx('hero','-'+r,'dmg');if(R.combat&&R.combat.busy)R.combat.ferito=1}else fx('hero','Parato','blk');
  heroDown();
}

function B(n){let v=Math.max(0,n+(g.hero.st.dex||0)+(g.hero.form==='orso'?1:0)+(g.hero.pw.bosco||0));if(g.side==='O')v=shUp(v);g.hero.blk+=v;STX('blk',v);fx('hero','+'+v,'blk')}

function ALLYN(tp){const c=R.combat;if(!c||!g.hero)return 0;if(solo)return (g.hero.played&&g.hero.played[tp])?1:0;return Object.keys(c.heroes).filter(p=>p!==CUR&&c.heroes[p].played&&c.heroes[p].played[tp]).length}

const pxBlk=()=>{const c=R&&R.combat;return c?Object.values(c.heroes).reduce((s,x)=>s+(x&&x.blk||0),0):0};
function playCard(u,j,ap,pk,sh){
  const c=R.combat,h=g&&g.hero;if(!c||c.busy||c.won||!h||h.ended||h.down)return;

  const X=d.xc?h.energy:0;h.hand.splice(i,1);h.energy-=d.xc?X:cost;g.hit=new Set();
  if(d.ally&&!(ap&&c.heroes[ap]&&!c.heroes[ap].down))ap=CUR;

  g.side=LO()?(omx?'X':shd?'O':'L'):null;

  try{d.f(d.xc?{...v0,X}:v0,t,d.ally?ap:CUR,pk,card);if(omx&&omxDraw(card))D(1)}finally{g.side=null}
  // segnale per la Grafica Pixellab: attacco per le carte Attacco, difesa per le carte che danno Armatura
  if(d.t==='A')fxq.push({k:'h-'+CUR,txt:'',cls:'pxa'});else if(pxBlk()>blk0)fxq.push({k:'h-'+CUR,txt:'',cls:'pxd'});
  if(shd){h.shTurn=(h.shTurn||0)+1;if(run.stx)run.stx.shadow=(run.stx.shadow||0)+1;omAdd(CUR,1)}
  if(d.grow){if(d.perm===2)PERM(card);else if(!d.perm)card.g=(card.g||0)+1}
  if(d.t==='A'&&h.pw.intrise)g.hit.forEach(e=>S(e,'poison',h.pw.intrise));
  if(d.t==='A'){if(h.form==='serpente')g.hit.forEach(e=>S(e,'poison',2));if(h.elem)elemHit(h);if(has('giuramento'))FERV(1)}

function winCombat(){

  if(isPorta()&&R.porta){R.porta.salvati+=R.porta.gruppo;R.porta.gruppo=0}
  pids.forEach(pid=>{const P=R.players[pid],x=P&&P.stx;if(!x)return;if(kind==='elite')x.elites=(x.elites||0)+1;
    if(kind==='boss'){x.bk=(x.bk||0)+1;x.bosses=x.bosses||[];c.enemies.forEach(e=>{if(BOSSI[e.id]&&!x.bosses.includes(e.id))x.bosses.push(e.id)});if(!c.heroes[pid].down&&c.hp0&&P.hp>=c.hp0[pid])x.flawless=1}});
  pids.forEach(pid=>{ctx(pid);missWin(c,pid);if(c.heroes[pid].down)run.hp=Math.max(1,Math.floor(run.max*.25));else{if(has('elmo'))H(6);if(has('calicestelle'))H(8);if(TE('heal'))H(TE('heal'));if(has('martellonano')){const ids=run.deck.map((c,i)=>i).filter(i=>canUp(run.deck[i]));if(ids.length)run.deck[rng.pick(ids)].up=true}if(hasT('g5')||hasT('c2'))H(5);if(has('calice')){run.max++;run.hp++}}});
  R.combat=null;g=null;
  if(kind==='boss'){if(R.mode!=='surv'){endRun(true);return}newCycle()}
  R.phase='room';
  R.order.forEach(pid=>{const P=R.players[pid];if(!pids.includes(pid)||!isOnline(pid)){P.done=true;P.screen=null;return}
    ctx(pid);const big=kind==='elite'||kind==='boss';let gold=big?rng.int(25,35):rng.int(10,20);gold=Math.round(gold*(1+.1*(R.lvl||0)));if(R.daily&&R.daily.mod==='povero')gold=Math.round(gold/2);if(has('sacchetto'))gold=Math.round(gold*1.25);if(has('borsafondo'))gold=Math.round(gold*1.5);if(LO()&&(P.om|0)>=OM_HIGH)gold=Math.round(gold*1.25);if(c&&c.clima==='nebbia')gold=Math.round(gold*1.5);
    P.reward={title:kind==='boss'?((b=>b?BOSSI[b.id][0]:'Il boss')(R.combat&&R.combat.enemies.find(x=>BOSSI[x.id])))+' sconfitto! Inizia il ciclo '+R.cycle:kind==='elite'?'Élite sconfitta!':'Vittoria!',gold,cards:rollCards(3,big),
      potion:rng.next()<(big?.6:.4)?rng.pick(DG().pots):null,relic:big?randomRelic():null};
    P.screen='reward';P.done=false});
}

/* ================= RICOMPENSE / NEGOZIO / EVENTI ================= */
function rollCards(n,elite){
  const pool=Object.keys(CARDS).filter(k=>CARDS[k].cl===run.cls&&CARDS[k].r!=='B'&&!(solo&&CARDS[k].mp));const out=[];
  for(let i=0;i<n;i++){const p=rng.next()-.02*(R.lvl||0);const rar=p<(elite?.12:.05)?'R':p<(elite?.5:.37)?'U':'C';
    let opts=pool.filter(k=>CARDS[k].r===rar&&!out.includes(k));if(!opts.length)opts=pool.filter(k=>!out.includes(k));out.push(rng.pick(opts))}
  return out;
}
function randomRelic(){const p=DG().relics.filter(k=>!run.relics.includes(k)&&!(k==='piuma'&&run.piumaUsed));return p.length?rng.pick(p):null}
function gainRelic(id){run.relics.push(id);if(id==='cuore'){run.max+=8;run.hp+=8}if(id==='calicestelle'){run.max+=10;run.hp+=10}if(id==='borsafondo')run.gold+=100;if(id==='cuorecavo'){run.max+=25;run.hp+=25}}
function givePotion(P,id){if(P.potions.length<3)P.potions.push(id);else P.pendPot=id}
function addCard(id){run.deck.push({id,up:false})}
function genShop(){
  const pool=Object.keys(CARDS).filter(k=>CARDS[k].cl===run.cls&&CARDS[k].r!=='B'&&!(solo&&CARDS[k].mp));
  const pickR=(r,n,ex)=>rng.shuffle(pool.filter(k=>CARDS[k].r===r&&!ex.includes(k))).slice(0,n);
  const ids=[];ids.push(...pickR('C',2,ids));ids.push(...pickR('U',2,ids));ids.push(...pickR('R',1,ids));
  const pr={C:[45,55],U:[70,82],R:[140,160]};
  const rel=rng.shuffle(DG().relics.filter(k=>!run.relics.includes(k))).slice(0,2);
  run.shop={cards:ids.map(id=>({id,price:rng.int(...pr[CARDS[id].r]),sold:false})),
    relics:rel.map(id=>({id,price:rng.int(140,170),sold:false})),
    potions:rng.shuffle([...DG().pots]).slice(0,2).map(id=>({id,price:rng.int(45,55),sold:false})),removeUsed:false};
  const dk=DG().relics.filter(k=>!run.relics.includes(k)&&!rel.includes(k)&&k!=='piuma');{const cu=cursedPick();run.shop.dark=cu?{id:cu,sold:false}:dk.length?{id:rng.pick(dk),sold:false}:null}
}
function buy(kind,k,swap){
  const it=run.shop[kind]&&run.shop[kind][k];if(!it||it.sold||run.gold<omPrice(it.price))return;
  run.gold-=omPrice(it.price);it.sold=true;
  if(kind==='cards')addCard(it.id);else if(kind==='relics')gainRelic(it.id);
  else if(run.potions.length>=3&&Number.isInteger(swap)&&swap>=0&&swap<run.potions.length)run.potions[swap]=it.id;else givePotion(run,it.id);
}
function removePrice(){return omPrice(75+run.removes*25)}

/* ================= RETE (Supabase Realtime) ================= */
function connect(code,onReady){
  if(typeof supabase==='undefined'){toast('Il multigiocatore non è disponibile qui: apri il gioco dal sito.');return false}
  sbc=sbc||supabase.createClient(SB_URL,SB_KEY);
  chan=sbc.channel('valdombra-'+code,{config:{broadcast:{self:false},presence:{key:ME}}});
  chan.on('broadcast',{event:'state'},({payload})=>onState(payload))
    .on('broadcast',{event:'act'},({payload})=>{if(isHost&&payload&&payload.a)dispatch(payload.pid,payload.a)})
    .on('broadcast',{event:'hello'},({payload})=>{if(isHost)onHello(payload)})
    .on('broadcast',{event:'closed'},()=>{toast('La stanza è stata chiusa.');leaveRoom(true)})
    .on('presence',{event:'sync'},()=>{if(!chan)return;online=new Set(Object.keys(chan.presenceState()));online.add(ME);onPresence()})
    .subscribe(async st=>{
      if(st==='SUBSCRIBED'){UI.status='';const tr=()=>{try{chan&&chan.track({name:myName,at:Date.now()})}catch(e){}};tr();setTimeout(tr,1200);setTimeout(tr,4000);clearInterval(window.trackIv);window.trackIv=setInterval(tr,15000);if(onReady){const f=onReady;onReady=null;f()}render()}
      else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'){UI.status='Connessione instabile, riprovo...';render()}
    });
  return true;
}
function onState(pl){
  if(!pl||!pl.s)return;const r=JSON.parse(pl.s);
  if(isHost){if(r.host===ME||(R&&r.v<=R.v))return;isHost=false}
  R=r;cacheState(pl.s);clearTimeout(joinTimer);UI.joining=null;
  if(R.host===ME&&!isHost){isHost=true;rng=new RNG(0);rng.s=R.rs|0;toast('Ora sei tu a guidare la stanza.')}
  if(!R.players[ME]&&R.phase!=='lobby'&&chan){const n=(UI.helloTries=(UI.helloTries||0)+1);if(n<=8&&!UI.helloT)UI.helloT=setTimeout(()=>{UI.helloT=null;if(R&&!R.players[ME]&&chan)chan.send({type:'broadcast',event:'hello',payload:{pid:ME,name:myName,cls:pickCls}})},3000)}else UI.helloTries=0;
  checkHost();render(pl.fx||[]);
}
function remapPid(o,n){
  R.players[n]=R.players[o];R.players[n].pid=n;delete R.players[o];R.order=R.order.map(x=>x===o?n:x);
  if(R.votes&&R.votes[o]){R.votes[n]=R.votes[o];delete R.votes[o]}
  const c=R.combat;if(c&&c.heroes[o]){c.heroes[n]=c.heroes[o];delete c.heroes[o];c.enemies.forEach(e=>{if(e.intent&&e.intent.tg===o)e.intent.tg=n;if(e.intent&&e.intent.tgs)e.intent.tgs=e.intent.tgs.map(x=>x===o?n:x)})}
  if(R.host===o)R.host=n;(R.chat||[]).forEach(m=>{if(m.p===o)m.p=n});
}
function onHello(p){
  if(!p||!p.pid||!R)return;const name=String(p.name||'Eroe').slice(0,16);
  if(R.players[p.pid])R.players[p.pid].name=name;
  else{
    // stesso nome di un giocatore disconnesso: è lui che rientra (telefono diverso o memoria cancellata)
    const old=R.order.find(q=>q!==p.pid&&!online.has(q)&&String(R.players[q].name).toLowerCase()===name.toLowerCase());
    if(old)remapPid(old,p.pid);
    else if(R.phase==='lobby'&&R.order.length<MAXP){R.players[p.pid]={pid:p.pid,name,cls:CLASSES[p.cls]?p.cls:'guerriero',ready:false};R.order.push(p.pid)}
  }
  commit();
}
function onPresence(){if(!R)return;if(isHost){checkProgress();commit()}else{checkHost();render()}}
function checkHost(){
  if(solo||!R||isHost)return;
  if(online.has(R.host)){clearTimeout(hostTimer);hostTimer=null;return}
  if(hostTimer)return;
  hostTimer=setTimeout(()=>{hostTimer=null;if(!R||isHost||online.has(R.host))return;const cand=R.order.filter(p=>online.has(p));if(cand[0]===ME)becomeHost()},4000);
}
function becomeHost(msg){
  isHost=true;R.host=ME;rng=new RNG(0);rng.s=R.rs|0;
  if(R.combat){R.combat.busy=false;if(R.combat.won){R.combat.won=false;checkEnd()}}
  if(R.voteAnim)setTimeout(finishVote,1500);
  toast(msg||'L\'host è uscito: ora sei tu a guidare la stanza.');checkProgress();commit();
}
function rememberRoom(code){store('valdombra-room',code);try{location.hash=code}catch(e){}}
function createRoom(){
  if(!saveName())return;
  solo=false;isHost=true;ME=myPid();const code=newSeed(4);R=newLobby(code);rng=new RNG(hashStr(code));online=new Set([ME]);
  if(!connect(code,()=>commit())){R=null;solo=true;return}
  rememberRoom(code);render();
}
function joinRoom(code){
  code=String(code||'').trim().toUpperCase();if(code.length!==4){toast('Il codice della stanza ha 4 caratteri.');return}
  if(!saveName())return;
  if(chan){try{chan.unsubscribe()}catch(e){}chan=null}
  solo=false;isHost=false;ME=myPid();R=null;online=new Set([ME]);screen='mp';UI.joining=code;
  const hello=()=>chan&&chan.send({type:'broadcast',event:'hello',payload:{pid:ME,name:myName,cls:pickCls}});
  if(!connect(code,()=>{hello();setTimeout(()=>{if(!R)hello()},1500);
    joinTimer=setTimeout(()=>{if(R)return;
      // nessuno risponde: se eravamo in questa partita la riprendiamo dalla copia salvata su questo dispositivo
      let r=null;try{r=JSON.parse(load('valdombra-cache-'+code))}catch(e){}
      if(r&&r.players){if(!r.players[ME]){const old=r.order.find(q=>String(r.players[q].name).toLowerCase()===myName.toLowerCase());if(old){R=r;remapPid(old,ME)}}else R=r}
      if(R){becomeHost('Nessun altro è collegato: la partita riprende da qui. Gli amici possono rientrare con il codice '+code+'.');return}
      toast('Stanza '+code+' non trovata. Controlla il codice, oppure chiedi a chi è in partita di restare collegato.');leaveRoom(false)},5000)}))return;
  rememberRoom(code);render();
}
// forget=true: dimentica la stanza (non comparirà il tasto Continua)
function leaveRoom(forget){
  const code=R&&!solo?R.code:(UI.joining||load('valdombra-room'));
  clearInterval(window.trackIv);
  if(chan){try{chan.unsubscribe()}catch(e){}chan=null}
  clearTimeout(joinTimer);clearTimeout(hostTimer);hostTimer=null;
  if(cacheT){clearTimeout(cacheT);cacheT=null;if(!forget&&R&&!solo&&cacheS)store('valdombra-cache-'+R.code,cacheS)}
  if(forget===true){store('valdombra-room',null);if(code)store('valdombra-cache-'+code,null)}
  R=null;g=null;run=null;isHost=true;solo=true;UI.joining=null;screen='title';modal=null;
  try{history.replaceState(null,'',location.pathname)}catch(e){}render();
}
function removePlayer(pid){
  delete R.players[pid];R.order=R.order.filter(x=>x!==pid);if(R.votes)delete R.votes[pid];
  const c=R.combat;if(c&&c.heroes[pid]){delete c.heroes[pid];c.enemies.forEach(e=>{if(e.intent&&e.intent.tg===pid)e.intent.tg=null;if(e.intent&&e.intent.tgs)e.intent.tgs=e.intent.tgs.map(x=>x===pid?null:x)})}
  if(c&&!Object.keys(c.heroes).length){R.combat=null;R.phase='map';R.votes={}}
}
ACT.abandon=(a,P,pid)=>{
  removePlayer(pid);
  if(pid===R.host){const next=R.order.find(q=>online.has(q));if(next)R.host=next}
};
function abandonRun(){
  modal=null;
  if(solo){store(SOLO_K,null);R=null;g=null;screen='title';render();toast('Hai abbandonato il dungeon.');return}
  const others=R.order.filter(q=>q!==ME&&isOnline(q));
  if(others.length)send({t:'abandon'});
  setTimeout(()=>{leaveRoom(true);toast('Hai abbandonato il dungeon.')},others.length?400:0);
}
function closeRoomForAll(){
  modal=null;if(chan)chan.send({type:'broadcast',event:'closed',payload:{}});
  setTimeout(()=>{leaveRoom(true);toast('Stanza chiusa per tutti.')},300);
}

    <button class="opt" onclick="modal=null;${solo?"R=null;g=null;screen='title';render()":'leaveRoom(false)'}"><b>Torna al menu principale</b><br><span class="muted">La partita resta salvata: potrai riprenderla con il tasto Continua.</span></button>
    <button class="opt" onclick="openAbandon()"><b>Abbandona il dungeon</b><br><span class="muted">${solo?'La partita viene cancellata.':'Esci per sempre da questa partita. Gli altri possono continuare senza di te.'}</span></button>

function openAbandon(){modal={title:'Abbandonare il dungeon?',html:`<div class="panel" style="max-width:520px;margin:0 auto"><p>${solo?'La partita in corso verrà cancellata e non potrai riprenderla.':'Il tuo eroe lascia il gruppo e non potrai rientrare in questa partita. Se sei l\'ultimo giocatore, la stanza viene cancellata.'}</p>
  <div class="row"><button class="btn danger" onclick="abandonRun()">Sì, abbandona</button><button class="btn" onclick="openMenu()">Annulla</button></div></div>`,cancel:true};render()}
function openClose(){modal={title:'Chiudere la stanza?',html:`<div class="panel" style="max-width:520px;margin:0 auto"><p>La partita finisce per tutti i giocatori e la stanza ${R.code} viene cancellata.</p>
  <div class="row"><button class="btn danger" onclick="closeRoomForAll()">Sì, chiudi per tutti</button><button class="btn" onclick="openMenu()">Annulla</button></div></div>`,cancel:true};render()}
// telefono: quando torni sulla pagina, ricollega se la connessione è caduta
document.addEventListener('visibilitychange',()=>{

});
